   ============================================================ */
const SAYFALAR = [
  { id:"konular", ad:"Konular", ikon:'<path d="M4 5h16M4 12h16M4 19h10"/>' },
  { id:"calis",   ad:"Çalış",   ikon:'<path d="M12 3v18M3 12h18"/><circle cx="12" cy="12" r="9"/>' },
  { id:"yanlis",  ad:"Yanlışlarım", ikon:'<path d="M12 8v5M12 16.5v.5"/><path d="M10.3 3.9 2.6 17a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>' },
  { id:"deneme",  ad:"Deneme",  ikon:'<path d="M9 3h6v3H9z"/><path d="M5 6h14v15H5z"/><path d="M9 12h6M9 16h4"/>' }
];
let aktifSayfa = "konular";

function navCiz(){
  const yv = yanlisHavuzu().length;
  $("#alt-nav").innerHTML = SAYFALAR.map(s => `
    <button data-git="${s.id}" ${aktifSayfa === s.id ? 'aria-current="page"' : ""}>
      <svg viewBox="0 0 24 24">${s.ikon}</svg>
      ${s.id === "yanlis" && yv ? `<span class="rozet">${yv}</span>` : ""}
      <span>${s.ad}</span>
    </button>`).join("");
  $("#alt-nav").querySelectorAll("button").forEach(b =>
    b.onclick = () => git(b.dataset.git));
}
function git(id){
  aktifSayfa = id;
  document.querySelectorAll(".sayfa").forEach(s => s.classList.remove("acik"));
  $("#sayfa-" + id).classList.add("acik");
  if(id === "konular") konularCiz();
  if(id === "calis")   calisCiz();
  if(id === "yanlis")  yanlisCiz();
  if(id === "deneme")  denemeCiz();
  navCiz(); centiklerCiz();
  basaDon();
}

function centiklerCiz(){
  $("#centikler").innerHTML = UNITELER.map(u => {
    const i = uniteIst(u.id);
    return `<span class="centik ${i.oran >= 80 ? "tam" : ""}" title="${kacisla(u.no + ". " + u.ad)} — %${i.oran}"><i style="width:${i.oran}%"></i></span>`;
  }).join("");
}

/* ============================================================
   KONULAR
   ============================================================ */
function konularCiz(){
  $("#unite-detay").style.display = "none";
  $("#unite-liste-gorunum").style.display = "";
  const g = genelIst();
  $("#genel-ist").innerHTML = `
    <div><b>${g.cozulen}<span style="font-size:14px;color:var(--metin-silik)">/${g.toplam}</span></b><span>Görülen soru</span></div>
    <div><b>%${g.basari}</b><span>Doğru oranı</span></div>
    <div><b>${yanlisHavuzu().length}</b><span>Tekrar bekliyor</span></div>`;
  $("#unite-listesi").innerHTML = UNITELER.map(u => {
    const i = uniteIst(u.id);
    return `<button class="unite ${i.oran >= 80 ? "tamam" : ""}" data-u="${u.id}">
      <span class="unite-no">${u.no}</span>
      <span class="unite-ad"><b>${kacisla(u.ad)}</b><span>${i.toplam} soru · ${i.cozulen} görüldü</span></span>
      ${halka(i.oran)}
    </button>`;
  }).join("");
  $("#unite-listesi").querySelectorAll(".unite").forEach(b =>
    b.onclick = () => uniteAc(+b.dataset.u));
  const gi = $("#konu-giris");
  if(gi) gi.innerHTML = `<b>${UNITELER.length} ünite.</b>` + gi.innerHTML.replace(/^\s*<b>\d+ ünite\.<\/b>/, "");
  $("#dipnot").innerHTML = `Toplam <b>${SORULAR.length}</b> soru, hepsi 5 şıklı ve açıklamalı. İlerleme bu tarayıcıya kaydedilir; kaldığın yerden devam edebilirsin.<br><br><b>Şıklar her seferinde karıştırılır</b> — aynı soru ikinci kez karşına çıktığında doğru cevap başka harfte olur. Bu bilerek yapıldı: harfin yerini değil cevabın kendisini öğrenmen için. Bu yüzden cevap harfle değil, metniyle gösteriliyor.`;
}

function uniteAc(uid){
  const u = UNITELER.find(x => x.id === uid);
  if(!u) return;
  const i = uniteIst(uid);
  $("#unite-liste-gorunum").style.display = "none";
  const d = $("#unite-detay");
  d.style.display = "";
  d.innerHTML = `
    <button class="dg" id="geri-dugme" style="margin-bottom:16px">← Konular</button>
    <p class="etiket">Ünite ${u.no} · ${i.toplam} soru</p>
    <h1>${kacisla(u.ad)}</h1>
    <div class="metin">${u.ozet}</div>
    <div class="dg-sira">
      <button class="dg ana" id="unite-calis">Bu üniteden ${i.toplam} soru çöz</button>
      <button class="dg" id="unite-sonraki">Sonraki ünite →</button>
    </div>
    <div style="height:20px"></div>`;
  $("#geri-dugme").onclick = () => konularCiz();
  $("#unite-calis").onclick = () => { git("calis"); oturumBaslat(SORULAR.filter(s => s.u === uid), "Ünite " + u.no + " — " + u.ad); };
  const sonraki = UNITELER.find(x => x.no === u.no + 1);
  const sb = $("#unite-sonraki");
  if(sonraki) sb.onclick = () => { uniteAc(sonraki.id); basaDon(); };
  else { sb.textContent = "Son ünite"; sb.disabled = true; }
  basaDon();
}

/* ============================================================
   SORU OTURUMU  (çalış / yanlışlarım / deneme ortak motoru)
   ============================================================ */
let oturum = null; // {liste, i, baslik, sinav, cevaplar, kalan, zamanlayici}

function oturumBaslat(liste, baslik, secenek){
  secenek = secenek || {};
  if(!liste.length){ calisCiz(); return; }
  oturum = {
    liste: secenek.sirali ? liste.slice() : kacir(liste),
    i: 0, baslik, sinav: !!secenek.sinav,
    dogru: 0, yanlis: 0, kalan: secenek.sure || 0, zamanlayici: null, bitti: false
  };
  soruCiz();
}

function hedefSayfa(){ return $("#sayfa-" + aktifSayfa); }

/* Şıklar her gösterimde karıştırılır: doğru cevabın yeri ezberlenemesin.
   'Hiçbiri' / 'Hepsi' gibi kapanış şıkları en sonda sabit tutulur. */
function sikSirasi(s){
  const kapanis = /^(hiçbiri|hepsi|yukarıdakilerin)/i;
  const sabit = [], oynak = [];
  s.c.forEach((metin, i) => (kapanis.test(metin) ? sabit : oynak).push(i));
  return kacir(oynak).concat(sabit);
}

function soruCiz(){
  if(!oturum) return;
  const s = oturum.liste[oturum.i];
  oturum.sira = sikSirasi(s);
  const el = hedefSayfa();
  el.innerHTML = `
    <div class="soru-ust">
      <button class="dg" id="cik" style="padding:5px 10px; font-size:12.5px">✕ Çık</button>
      <span class="ilerle-cubuk"><i style="width:${100 * oturum.i / oturum.liste.length}%"></i></span>
      <span>${oturum.i + 1}/${oturum.liste.length}</span>
    </div>
    <div class="soru-kart">
      <div class="soru-unite">${oturum.sinav ? kacisla(oturum.baslik) : kacisla(uniteAdi(s.u))}</div>
      <p class="soru-metin">${kacisla(s.s)}</p>
      <div class="siklar" id="siklar">
        ${oturum.sira.map((gercek, gosterim) => `<button class="sik" data-ix="${gosterim}"><span class="sik-harf">${HARF[gosterim]}</span><span>${kacisla(s.c[gercek])}</span></button>`).join("")}
      </div>
      <div id="aciklama-yeri"></div>
    </div>`;
  $("#cik").onclick = () => oturumIptal();
  el.querySelectorAll(".sik").forEach(b => b.onclick = () => sikSec(+b.dataset.ix));
}
const uniteAdi = u => { const x = UNITELER.find(y => y.id === u); return x ? "Ünite " + x.no + " · " + x.ad : ""; };

function sikSec(gosterimIx){
  const s = oturum.liste[oturum.i];
  const dogruGosterim = oturum.sira.indexOf(s.d);
  const dogruMu = gosterimIx === dogruGosterim;
  cevapIsle(s.id, dogruMu);
  if(dogruMu) oturum.dogru++; else oturum.yanlis++;

  const btns = hedefSayfa().querySelectorAll(".sik");
  btns.forEach((b,i) => {
    b.disabled = true;
    if(i === dogruGosterim) b.classList.add("dogru");
    else if(i === gosterimIx) b.classList.add("yanlis");
    else b.classList.add("solgun");
  });

  if(oturum.sinav){
    // Sınavda anında açıklama yok — gerçek koşul. Doğrudan sonrakine.
    setTimeout(() => sonraki(), 180);
    return;
  }
  $("#aciklama-yeri").innerHTML = `
    <div class="aciklama ${dogruMu ? "iyi" : "kotu"}">
      <div class="basi">${dogruMu ? "✓ Doğru" : "✕ Yanlış"}</div>
      ${dogruMu ? "" : `<div class="dogru-cevap"><b>Doğru cevap:</b> ${kacisla(s.c[s.d])}</div>`}
      <div>${kacisla(s.a)}</div>
    </div>
    <div class="dg-sira"><button class="dg ana genis" id="ileri">${oturum.i + 1 < oturum.liste.length ? "Sonraki soru →" : "Bitir ve sonucu gör"}</button></div>`;
  $("#ileri").onclick = () => sonraki();
  $("#ileri").focus();
}
function sonraki(){
  if(!oturum || oturum.bitti) return;
  oturum.i++;
  if(oturum.i >= oturum.liste.length) oturumBitir();
  else soruCiz();
}
function oturumIptal(){
  if(oturum && oturum.zamanlayici) clearInterval(oturum.zamanlayici);
  oturum = null;
  git(aktifSayfa);
}
function oturumBitir(){
  if(!oturum) return;
  oturum.bitti = true;
  if(oturum.zamanlayici) clearInterval(oturum.zamanlayici);
  const toplam = oturum.liste.length;
  const dogru = oturum.dogru;
  const puan = Math.round(100 * dogru / toplam);
  const gecti = puan >= 60;
  if(oturum.sinav){
    D.denemeler.push({ t: new Date().toISOString().slice(0,10), dogru, toplam, puan });
    kaydet();
  }
  const kalanYanlis = yanlisHavuzu().length;
  hedefSayfa().innerHTML = `
    <div class="kart sonuc">
      <div class="puan ${gecti ? "gecti" : "kaldi"}">${puan}</div>
      <div class="karar">${gecti ? "İyi gidiyor" : "Tekrar gerek"}</div>
      <p>${toplam} soruda <b>${dogru} doğru</b>, ${toplam - dogru} yanlış.
      ${kalanYanlis ? kalanYanlis + " soru tekrar kutusunda bekliyor." : "Tekrar kutun boş."}</p>
      <div class="dg-sira" style="justify-content:center">
        <button class="dg ana" id="son-yanlis">Yanlışları çalış (${kalanYanlis})</button>
        <button class="dg" id="son-kapat">Kapat</button>
      </div>
    </div>`;
  $("#son-kapat").onclick = () => oturumIptal();
  $("#son-yanlis").onclick = () => { oturum = null; git("yanlis"); const h = yanlisHavuzu(); if(h.length) oturumBaslat(h, "Tekrar", { sirali:true }); };
  oturum = null;
}

/* ============================================================
   ÇALIŞ
   ============================================================ */
function calisCiz(){
  const g = genelIst();
  const gorulmemis = SORULAR.filter(s => !D.kayit[s.id]);
  $("#sayfa-calis").innerHTML = `
    <h1>Çalış</h1>
    <p class="giris">Her soruda cevabın hemen açıklanır. Yanlış yaptıkların otomatik olarak tekrar kutusuna düşer.</p>
    <div class="dizi">
      <button class="unite" id="c-yeni">
        <span class="unite-no">›</span>
        <span class="unite-ad"><b>Hiç görmediklerim</b><span>${gorulmemis.length} soru bekliyor</span></span>
      </button>
      <button class="unite" id="c-karisik">
        <span class="unite-no">⤨</span>
        <span class="unite-ad"><b>Karışık 20 soru</b><span>Tüm ünitelerden rastgele</span></span>
      </button>
      <button class="unite" id="c-zayif">
        <span class="unite-no">↓</span>
        <span class="unite-ad"><b>En zayıf ünitem</b><span>${zayifUnite() ? zayifUnite().ad : "henüz veri yok"}</span></span>
      </button>
      <button class="unite" id="c-tum">
        <span class="unite-no">∞</span>
        <span class="unite-ad"><b>Tüm banka</b><span>${g.toplam} soru, karışık sırada</span></span>
      </button>
    </div>
    <h2>Üniteden seç</h2>
    <div class="dizi">
      ${UNITELER.map(u => { const i = uniteIst(u.id);
        return `<button class="unite" data-cu="${u.id}">
          <span class="unite-no">${u.no}</span>
          <span class="unite-ad"><b>${kacisla(u.ad)}</b><span>${i.toplam} soru</span></span>
          ${halka(i.oran)}</button>`; }).join("")}
    </div>
    <div style="height:16px"></div>`;
  $("#c-yeni").onclick = () => gorulmemis.length ? oturumBaslat(gorulmemis, "Yeni sorular") : null;
  $("#c-karisik").onclick = () => oturumBaslat(kacir(SORULAR).slice(0,20), "Karışık");
  $("#c-zayif").onclick = () => { const z = zayifUnite(); if(z) oturumBaslat(SORULAR.filter(s => s.u === z.id), z.ad); };
  $("#c-tum").onclick = () => oturumBaslat(SORULAR, "Tüm banka");
  $("#sayfa-calis").querySelectorAll("[data-cu]").forEach(b =>
    b.onclick = () => { const u = UNITELER.find(x => x.id === +b.dataset.cu); oturumBaslat(SORULAR.filter(s => s.u === u.id), u.ad); });
}
function zayifUnite(){
  const denenmis = UNITELER.filter(u => uniteIst(u.id).cozulen >= 3);
  if(!denenmis.length) return null;
  return denenmis.sort((a,b) => uniteIst(a.id).oran - uniteIst(b.id).oran)[0];
}

/* ============================================================
   YANLIŞLARIM
   ============================================================ */
function yanlisCiz(){
  const h = yanlisHavuzu();
  const el = $("#sayfa-yanlis");
  if(!h.length){
    el.innerHTML = `<h1>Yanlışlarım</h1>
      <div class="bos"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>
      <p>Tekrar kutun boş.<br>Yanlış yaptığın her soru buraya düşer ve üç kez doğru bilene kadar kalır.</p></div>`;
    return;
  }
  const kutular = [1,2,3].map(k => h.filter(s => D.kayit[s.id].kutu === k).length);
  el.innerHTML = `
    <h1>Yanlışlarım</h1>
    <p class="giris">Aralıklı tekrar: yanlış yaptığın soru 1. kutuya düşer, her doğru cevapta bir üst kutuya çıkar, 4. kutuya ulaşınca listeden çıkar. Bir yanlış onu tekrar 1'e indirir.</p>
    <div class="ist">
      <div><b>${kutular[0]}</b><span>1. kutu · taze</span></div>
      <div><b>${kutular[1]}</b><span>2. kutu</span></div>
      <div><b>${kutular[2]}</b><span>3. kutu · son adım</span></div>
    </div>
    <button class="dg ana genis" id="y-basla">${h.length} soruyu tekrar et</button>
    <h2>Bekleyen sorular</h2>
    <div class="dizi">
      ${h.slice(0,40).map(s => `<div class="kart" style="padding:11px 13px">
        <div class="soru-unite" style="margin-bottom:4px">${kacisla(uniteAdi(s.u))} · ${D.kayit[s.id].kutu}. kutu</div>
        <div style="font-size:14.5px; line-height:1.45">${kacisla(s.s)}</div></div>`).join("")}
    </div>
    <div style="height:16px"></div>`;
  $("#y-basla").onclick = () => oturumBaslat(h, "Tekrar", { sirali:true });
}

/* ============================================================
   DENEME
   ============================================================ */
function denemeCiz(){
  const el = $("#sayfa-deneme");
  const dn = D.denemeler.slice().reverse();
  el.innerHTML = `
    <h1>Deneme</h1>
    <p class="giris">Tüm ünitelerden 20 karışık soru, açıklama olmadan. Sonunda puanını ve hangi soruları kaçırdığını görürsün. Süre yok, istediğin zaman çık.</p>
    <button class="dg ana genis" id="d-basla" style="padding:15px">20 soruluk deneme başlat</button>
    ${dn.length ? `<h2>Geçmiş denemeler</h2>
      <div class="tablo-sar"><table>
        <thead><tr><th>Tarih</th><th>Doğru</th><th>Puan</th><th>Sonuç</th></tr></thead>
        <tbody>${dn.map(x => `<tr>
          <td style="font-family:var(--f-sayi)">${x.t.split("-").reverse().join(".")}</td>
          <td style="font-family:var(--f-sayi)">${x.dogru}/${x.toplam}</td>
          <td style="font-family:var(--f-sayi)">${x.puan}</td>
          <td style="color:${x.puan >= 60 ? "var(--dogru)" : "var(--yanlis)"}; font-weight:600">${x.puan >= 60 ? "Geçti" : "Kaldı"}</td>
        </tr>`).join("")}</tbody>
      </table></div>` : ""}
    <div style="height:16px"></div>`;
  $("#d-basla").onclick = () => {
    // Üniteleri dengeli tara: her üniteden en az bir soru, kalanı rastgele.
    const secili = [];
    kacir(UNITELER).forEach(u => {
      const havuz = kacir(SORULAR.filter(s => s.u === u.id));
      if(havuz.length) secili.push(havuz[0]);
    });
    const kalanHavuz = kacir(SORULAR.filter(s => !secili.includes(s)));
    while(secili.length < 20 && kalanHavuz.length) secili.push(kalanHavuz.pop());
    oturumBaslat(kacir(secili).slice(0,20), "Deneme", { sinav:true });
  };
}

/* ============================================================
   KAYDIRMA — fare tekerleği / PageUp / PageDown olmadan
   ============================================================ */
const govde = () => $("#govde");
function basaDon(){ const g = govde(); if(g) g.scrollTo({ top:0, behavior:"auto" }); }

(function kaydirmaKur(){
  const g = govde(), yukari = $("#k-yukari"), asagi = $("#k-asagi"), kutu = $("#kaydir");

  function durumTazele(){
    const kaydirilabilir = g.scrollHeight - g.clientHeight > 8;
    kutu.style.display = kaydirilabilir ? "flex" : "none";
    yukari.disabled = g.scrollTop <= 2;
    asagi.disabled  = g.scrollTop >= g.scrollHeight - g.clientHeight - 2;
  }

  /* Tek tık: bir ekran boyu (biraz örtüşmeli, okuma yeri kaybolmasın).
     Basılı tutma: kısa adımlarla sürekli kaydırır. */
  function adim(yon, buyuk){
    g.scrollBy({ top: yon * (buyuk ? g.clientHeight * 0.82 : 46), behavior: buyuk ? "smooth" : "auto" });
  }
  [[yukari,-1],[asagi,1]].forEach(([dugme, yon]) => {
    let sayac = null, tekrar = null, basiliKaydi = false;
    const birak = () => { clearTimeout(sayac); clearInterval(tekrar); sayac = tekrar = null; };
    dugme.addEventListener("pointerdown", e => {
      if(e.button) return;
      basiliKaydi = false;
      sayac = setTimeout(() => { basiliKaydi = true; tekrar = setInterval(() => adim(yon, false), 16); }, 300);
    });
    ["pointerup","pointerleave","pointercancel"].forEach(o => dugme.addEventListener(o, birak));
    dugme.addEventListener("click", () => { if(!basiliKaydi) adim(yon, true); basiliKaydi = false; });
  });

  g.addEventListener("scroll", durumTazele, { passive:true });
  new ResizeObserver(durumTazele).observe(g.firstElementChild);
  window.addEventListener("resize", durumTazele);
  durumTazele();

  /* Klavyesi olan için: yön tuşları ve boşluk da gövdeyi kaydırsın */
  document.addEventListener("keydown", e => {
    if(/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName)) return;
    const tus = { ArrowDown:[1,false], ArrowUp:[-1,false], PageDown:[1,true], PageUp:[-1,true], " ":[1,true] }[e.key];
    if(!tus) return;
    e.preventDefault();
    adim(tus[0] * (tus[1] ? 1 : 3), tus[1]);
  });
})();

/* ============================================================
   TEMA
   ============================================================ */
function temaUygula(){
  if(D.tema) document.documentElement.setAttribute("data-theme", D.tema);
  else document.documentElement.removeAttribute("data-theme");
}
$("#temaDugme").onclick = () => {
  const suan = D.tema || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  D.tema = suan === "dark" ? "light" : "dark";
  kaydet(); temaUygula();
};

/* ============================================================
   BAŞLAT
   ============================================================ */
(function(){
  SORULAR.forEach((s, i) => s.id = i);
  UNITELER.forEach((u, i) => { if(!u.id) u.id = i + 1; u.no = i + 1; });
  yukle();
  temaUygula();
  git("konular");
})();
</script>
