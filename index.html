 geç kaldın, hiç ciddiye almıyorsun.\"<br>\n<b>Ben dili</b> davranışı ve etkisini anlatır: \"Geç başlayınca ısınmayı kısaltmak zorunda kalıyorum, bu beni zorluyor.\"<br>\nBen dilinde kişilik değil <b>davranış</b> konuşulur; sporcu savunmaya geçmez ve mesaj yerine ulaşır. Geri bildirimin kişiye değil harekete yöneltilmesi ilkesiyle aynı mantıktır.</div>\n<h3>Etkin dinleme</h3>\n<p>İletişim yalnız anlatmak değil, <b>anlamaktır</b>. Etkin dinleme; sözünü kesmemeyi, göz teması kurmayı, sporcunun söylediğini kendi cümlelerinle özetleyip doğrulamayı ve duygusunu adlandırmayı içerir. Sporcu konuşurken cevap hazırlamak dinlemeyi kesintiye uğratır.</p>\n<div class=\"kutu\"><span class=\"etiket\">İletişim engelleri</span>\nEmir vermek, tehdit etmek, sürekli öğüt vermek, yargılamak ve etiketlemek (\"tembelsin\"), alay etmek, konuyu değiştirmek, sporcunun duygusunu küçümsemek (\"abartma\"), yalnızca hataya odaklanmak. Bunlar mesajı taşımaz, ilişkiyi yıpratır.</div>\n<h3>Antrenör–sporcu ilişkisi</h3>\n<p>Etkili antrenörlük üç bilgi türünün birleşimidir: <b>profesyonel bilgi</b> (branş ve spor bilimleri), <b>kişilerarası bilgi</b> (iletişim ve ilişki kurma) ve <b>içsel bilgi</b> (kendini değerlendirme, mesleki gelişimini sürdürme). Yalnız birine yaslanan antrenör eksik kalır.</p>\n"}];

ğlamıştır","Öğretim yapmamıştır, çünkü planlılık ve amaçlılık yoktur","Eğitim yapmıştır, çünkü çocuklar spor yapmıştır","Değerlendirme yapmıştır","Öğrenme kesinlikle gerçekleşmemiştir"],"d":1,"a":"Öğrenme kendiliğinden de olabilir, ancak öğretimden söz edebilmek için sürecin planlı, programlı ve hedefe yönelik olması gerekir."},{"u":2,"s":"Öğrenmeyi etkileyen faktörler kaç ana başlıkta toplanır ve bunlar hangileridir?","c":["İkiye: öğrenen ve öğretmen","Üçe: öğrenen, öğrenme malzemesi, öğrenme yöntemi","Dörde: öğrenen, öğretmen, okul, aile","Üçe: kalıtım, çevre, olgunlaşma","İkiye: içsel ve dışsal"],"d":1,"a":"Standart sınıflama üçlüdür: öğrenenle ilgili, öğrenme malzemesiyle ilgili ve öğrenme yöntemiyle ilgili faktörler."},{"u":2,"s":"Aşağıdakilerden hangisi 'öğrenenle ilgili faktörler' arasında yer ALMAZ?","c":["Güdülenme","Olgunlaşma","Dikkat","Kavramsal gruplandırma","Genel uyarılmışlık hâli"],"d":3,"a":"Kavramsal gruplandırma öğrenme malzemesiyle ilgili bir faktördür; malzemenin nasıl düzenlendiğine ilişkindir, öğrenenin kendi özelliği değildir."},{"u":2,"s":"Aşağıdakilerden hangisi öğrenme malzemesiyle ilgili bir faktördür?","c":["Zekâ","Telaffuz edilebilirlik","Kaygı düzeyi","Etkin katılım","Öğrenmeye ayrılan zaman"],"d":1,"a":"Telaffuz edilebilirlik malzemenin bir özelliğidir. Zekâ ve kaygı öğrenene, etkin katılım ve zaman ise yönteme ilişkindir."},{"u":2,"s":"Öğrenme malzemesinin telaffuz edilebilir olması öğrenmeyi neden kolaylaştırır?","c":["Malzemeyi görsel hâle getirdiği için","Söylenebilen malzemenin zihinde tekrar edilmesi kolay olduğu için","Malzemeyi kısalttığı için","Dikkati dağıttığı için","Ölçmeyi kolaylaştırdığı için"],"d":1,"a":"Kolay söylenen malzeme zihinde de kolay tekrarlanır; tekrar edilebilen malzeme kısa süreli bellekten uzun süreli belleğe daha rahat geçer."},{"u":2,"s":"Genel uyarılmışlık düzeyi ile öğrenme arasındaki ilişki nasıldır?","c":["Uyarılmışlık arttıkça öğrenme sürekli artar","Uyarılmışlık azaldıkça öğrenme sürekli artar","Orta düzeyde uyarılmışlıkta öğrenme en yüksektir","Uyarılmışlığın öğrenmeyle ilişkisi yoktur","Yalnızca yüksek uyarılmışlıkta öğrenme olur"],"d":2,"a":"İlişki ters U biçimindedir: çok düşük uyarılmışlık ilgisizlik, çok yüksek uyarılmışlık kaygı doğurur; en verimli öğrenme orta düzeyde gerçekleşir."},{"u":2,"s":"Aşırı kaygılı bir sporcunun yeni bir tekniği öğrenmekte zorlanmasının nedeni aşağıdakilerden hangisiyle açıklanır?","c":["Türe özgü hazıroluş","Genel uyarılmışlık hâlinin çok yüksek olması","Olumsuz transfer","Kavramsal gruplandırma","Sönme"],"d":1,"a":"Aşırı uyarılmışlık dikkati daraltır ve bilgi işlemeyi bozar; ters U ilişkisinin sağ ucunda öğrenme düşer."},{"u":2,"s":"Daha önce hentbol oynayan bir sporcunun voleybol smacını çabuk öğrenmesi hangi kavramla açıklanır?","c":["Olumsuz transfer","Olumlu transfer","Sıfır transfer","Sönme","Genelleme yokluğu"],"d":1,"a":"Önceki öğrenmenin yeni öğrenmeyi kolaylaştırmasına olumlu transfer denir. İki beceri ne kadar benzerse olumlu transfer o kadar güçlüdür."},{"u":2,"s":"Uzun süre tenis oynamış bir sporcunun badmintonda bilek kullanımını yanlış yapması hangi kavramın örneğidir?","c":["Olumlu transfer","Olumsuz transfer","Sıfır transfer","Olgunlaşma eksikliği","Sönme"],"d":1,"a":"Önceki öğrenmenin yeni öğrenmeyi güçleştirmesi olumsuz transferdir. Benzer görünen ama farklı yapılan hareketlerde sık görülür."},{"u":2,"s":"Aşağıdakilerden hangisi 'öğrenme yöntemiyle ilgili' faktörlerdendir?","c":["Yaş","Anlamsal çağrışım","Aralıklı çalışma","Zekâ","Türe özgü hazıroluş"],"d":2,"a":"Aralıklı çalışma, öğrenmenin nasıl düzenlendiğine ilişkin bir yöntem faktörüdür."},{"u":2,"s":"Aynı toplam süre kullanıldığında öğrenmenin kalıcılığı açısından hangisi genellikle daha üstündür?","c":["Kesintisiz toplu (kütlesel) çalışma","Aralıklı çalışma","Yalnızca zihinsel çalışma","Yalnızca gözlem","Rastgele izleme"],"d":1,"a":"Araya dinlenme ve zaman aralıkları koyan çalışma, bilginin pekişmesine olanak tanır ve kalıcılığı artırır."},{"u":2,"s":"'Konuya etkin katılım' ilkesi öğrenme açısından neden önemlidir?","c":["Antrenörün iş yükünü azalttığı için","Öğrenen yaparak yaşayarak öğrendiğinde kalıcılık arttığı için","Zamanı kısalttığı için","Ölçmeyi kolaylaştırdığı için","Yarışma sonucunu iyileştirdiği için"],"d":1,"a":"Pasif izleyen değil, süreçte etkin rol alan öğrenir. Etkin katılım öğrenmeyi en çok artıran faktörlerden biridir."},{"u":2,"s":"Öğrenmede geri bildirimin bulunmaması durumunda ne olur?","c":["Öğrenme hızlanır","Tekrarlar hatayı pekiştirebilir","Kalıcılık artar","Transfer güçlenir","Uyarılmışlık düzeyi düşer"],"d":1,"a":"Doğru ile yanlışın ayırt edilmediği bir tekrar dizisi, yanlış hareket kalıbını da sağlamlaştırır. Geri bildirimsiz tekrar güvenilir değildir."},{"u":2,"s":"Türe özgü hazıroluş kavramı neyi ifade eder?","c":["Bireyin o gün kendini iyi hissetmesini","Organizmanın türü gereği o davranışı yapabilecek donanımda olmasını","Bireyin konuya ilgi duymasını","Ön öğrenmelerin tamamlanmasını","Malzemenin uygun düzenlenmesini"],"d":1,"a":"Türe özgü hazıroluş biyolojik sınırı belirtir: insana kanat çırparak uçmayı öğretemezsiniz, çünkü tür olarak buna uygun değildir."},{"u":2,"s":"Bir çocuğa henüz sinir–kas gelişimi tamamlanmadan karmaşık bir teknik öğretilmeye çalışılmaktadır. Buradaki temel engel nedir?","c":["Güdülenme eksikliği","Olgunlaşmanın tamamlanmamış olması","Malzemenin anlamsız olması","Olumsuz transfer","Ceza kullanımı"],"d":1,"a":"Olgunlaşma tamamlanmadan öğretim yapılamaz. Sinir–kas sistemi hazır olmayan çocuğa karmaşık teknik yüklemek beceriyi hatalı yerleştirir ve sakatlık riskini artırır."},{"u":2,"s":"Öğrenilecek malzemenin anlamlı ve birbiriyle ilişkili gruplar hâlinde düzenlenmesi hangi faktörle ilgilidir?","c":["Kavramsal gruplandırma","Etkin katılım","Genel uyarılmışlık","Türe özgü hazıroluş","Sönme"],"d":0,"a":"Kavramsal gruplandırma, malzemenin anlamlı kümeler hâlinde sunulmasıdır ve bellekte tutulmasını kolaylaştırır."},{"u":2,"s":"İki farklı beceri arasında hiçbir etkileşim bulunmaması durumuna ne ad verilir?","c":["Olumlu transfer","Olumsuz transfer","Sıfır transfer","Sönme","Genelleme"],"d":2,"a":"Sıfır transferde önceki öğrenme yeni öğrenmeyi ne kolaylaştırır ne de zorlaştırır."},{"u":3,"s":"Bedende meydana gelen nicel (sayısal) artışa ne ad verilir?","c":["Gelişme","Olgunlaşma","Büyüme","Hazırbulunuşluk","Öğrenme"],"d":2,"a":"Büyüme boy, kilo, uzuv uzunluğu gibi ölçülebilir niceliklerdeki artıştır. Nitelik değişimi değil, sayısal artıştır."},{"u":3,"s":"Organizmanın kalıtımın etkisiyle, kendisinden beklenen işlevi yerine getirebilecek düzeye gelmesine ne denir?","c":["Büyüme","Olgunlaşma","Öğrenme","Hazırbulunuşluk","Gelişme"],"d":1,"a":"Olgunlaşma öğrenmeden bağımsızdır ve zamanla kendiliğinden gerçekleşir. Olgunlaşmamış bir çocuğa o beceri öğretilemez."},{"u":3,"s":"Büyüme, olgunlaşma ve öğrenmenin etkileşimi sonucu ortaya çıkan sürekli değişime ne ad verilir?","c":["Büyüme","Gelişme","Hazırbulunuşluk","Uyum","Transfer"],"d":1,"a":"Gelişme (gelişim) bu üçünü kapsayan en geniş kavramdır ve yaşam boyu sürer."},{"u":3,"s":"Hazırbulunuşluk kavramı olgunlaşmadan hangi yönüyle ayrılır?","c":["Yalnızca biyolojik hazır oluşu içermesiyle","Olgunlaşmanın yanına öğrenme, ilgi ve güdülenmeyi de eklemesiyle","Yalnızca yaşla belirlenmesiyle","Öğrenmeyi dışlamasıyla","Ölçülemez olmasıyla"],"d":1,"a":"Hazırbulunuşluk daha geniştir: biyolojik olgunluğun yanında ön öğrenmeleri, isteği ve tutumu da kapsar."},{"u":3,"s":"Bireyin anne ve babasından aldığı kalıtsal özelliklerin tümüne ne ad verilir?","c":["Fenotip","Genotip","Kromozom","Hazırbulunuşluk","Olgunlaşma"],"d":1,"a":"Genotip bireyin genetik yapısıdır ve doğrudan gözlenemez. Gözlenen özellikler fenotiptir."},{"u":3,"s":"Genotipin çevreyle etkileşimi sonucu ortaya çıkan, gözlenebilen özelliklere ne denir?","c":["Genotip","Fenotip","Şema","Uyumsama","Kritik dönem"],"d":1,"a":"Fenotip görünen sonuçtur. Boy potansiyeli genotip, beslenme ve antrenmanla ulaşılan gerçek boy fenotiptir."},{"u":3,"s":"Gelişimin baştan ayağa doğru ilerlemesi ilkesine ne ad verilir?","c":["Proksimodistal (içten dışa)","Sefalokaudal (baştan ayağa)","Genelden özele","Nöbetleşe gelişim","Bütünlük"],"d":1,"a":"Bebek önce baş kontrolünü kazanır, sonra gövde, en son bacak kontrolünü. Bu sefalokaudal ilkedir."},{"u":3,"s":"Gelişimin vücudun merkezinden uzuvlara doğru ilerlemesi hangi ilkedir?","c":["Sefalokaudal","Proksimodistal","Bireysel farklılık","Süreklilik","Kritik dönem"],"d":1,"a":"Proksimodistal ilkeye göre önce omuz ve kol kontrolü, sonra el ve parmak kontrolü gelişir. Bu yüzden küçük çocuklarda ince motor beceriler geç olgunlaşır."},{"u":3,"s":"Çocuğun önce kaba (büyük kas) hareketleri, sonra ince (küçük kas) hareketleri kazanması hangi gelişim ilkesiyle açıklanır?","c":["Genelden özele","Bilinenden bilinmeyene","Bütünlük","Nöbetleşe gelişim","Yakından uzağa"],"d":0,"a":"Gelişim genel ve kaba hareketlerden özel ve ince hareketlere doğru ilerler."},{"u":3,"s":"Belirli bir davranışın en kolay ve en hızlı kazanıldığı, kaçırıldığında sonradan öğrenilmesi güçleşen döneme ne ad verilir?","c":["Ergenlik","Kritik dönem","Plato","Olgunlaşma dönemi","Duraklama dönemi"],"d":1,"a":"Kritik dönem, gelişimin belirli bir davranışa en açık olduğu zaman aralığıdır. Temel hareket becerileri için çocukluk dönemi kritiktir."},{"u":3,"s":"Aşağıdakilerden hangisi gelişim ilkelerinden biri DEĞİLDİR?","c":["Gelişim bir bütündür","Gelişimde bireysel farklılıklar vardır","Gelişim süreklidir ancak hızı sabit değildir","Gelişim tüm bireylerde aynı hızda ilerler","Gelişimde kalıtım ve çevre birlikte etkilidir"],"d":3,"a":"Gelişimin sırası herkeste benzerdir ama hızı bireyden bireye değişir. Aynı hızda ilerlediğini söylemek bireysel farklılıklar ilkesine aykırıdır."},{"u":3,"s":"Gelişimde hızlı ve yavaş dönemlerin birbirini izlemesine ne ad verilir?","c":["Nöbetleşe gelişim","Bütünsel gelişim","Sefalokaudal gelişim","Kritik dönem","Plato"],"d":0,"a":"Nöbetleşe gelişim, farklı gelişim alanlarının ve hızlarının dönüşümlü olarak öne çıkmasıdır; bu yüzden gelişim düz bir çizgi izlemez."},{"u":3,"s":"Aynı yaştaki iki sporcunun fiziksel olarak birbirinden çok farklı düzeyde olması antrenöre ne söyler?","c":["Takvim yaşı yerine gelişim düzeyi esas alınmalıdır","Geride kalan sporcu elenmelidir","İkisine de aynı yüklenme verilmelidir","Yaş grubu değiştirilmelidir","Olgunlaşma önemsizdir"],"d":0,"a":"Biyolojik yaş takvim yaşından farklı olabilir; bu nedenle değerlendirme ve yüklenme takvim yaşına göre değil gelişim düzeyine göre yapılır."},{"u":3,"s":"Aşağıdakilerden hangisi büyümenin göstergesidir?","c":["Beceri düzeyinin artması","Boy uzunluğunun artması","Kurallara uymayı öğrenme","Dikkat süresinin uzaması","Takım içi rolünü kavrama"],"d":1,"a":"Büyüme yalnızca nicel artıştır. Diğer seçenekler gelişim ya da öğrenme kapsamındadır."},{"u":3,"s":"'Gelişim bir bütündür' ilkesi ne anlama gelir?","c":["Tüm çocuklar aynı anda gelişir","Bedensel, bilişsel, duygusal ve sosyal alanlar birbirini etkiler","Gelişim yalnızca bedensel alanda olur","Gelişim ergenlikte tamamlanır","Gelişim ölçülemez"],"d":1,"a":"Bir alandaki gelişim diğerlerini de etkiler; bedensel olarak zorlanan çocuğun duygusal ve sosyal gelişimi de bundan etkilenir."},{"u":3,"s":"Kalıtım ve çevrenin gelişim üzerindeki etkisi için hangisi doğrudur?","c":["Yalnızca kalıtım belirleyicidir","Yalnızca çevre belirleyicidir","İkisi etkileşim hâlindedir; kalıtım sınırı, çevre bu sınır içindeki düzeyi belirler","Çevre kalıtımı tamamen değiştirir","İkisinin de gelişimle ilgisi yoktur"],"d":2,"a":"Kalıtım potansiyeli çizer, çevre bu potansiyelin ne kadarına ulaşılacağını belirler. Bu yüzden yetenek tek başına yeterli değildir."},{"u":4,"s":"Motor gelişim kavramı neyi inceler?","c":["Yalnızca çocukluk dönemindeki boy artışını","Yaşam boyu süren hareket davranışındaki değişimi","Yalnızca sporcuların performansını","Kas kütlesindeki artışı","Zihinsel becerilerin gelişimini"],"d":1,"a":"Motor gelişim doğumdan ölüme kadar hareket davranışındaki sürekli değişimi inceler; yalnızca çocukluğa özgü değildir."},{"u":4,"s":"Psikomotor gelişim aşağıdakilerden hangisini kapsar?","c":["Yalnızca kas gücündeki artışı","Zihin ve kas koordinasyonunu gerektiren hareket becerilerindeki gelişimi","Yalnızca duygusal gelişimi","Yalnızca boy ve kilo değişimini","Yalnızca sosyal becerileri"],"d":1,"a":"Psikomotor kavramı 'psiko' (zihin) ve 'motor' (hareket) sözcüklerinin birleşimidir; hareketin zihinsel yönü de işin içindedir."},{"u":4,"s":"Gallahue'nun motor gelişim evrelerinin doğru sırası hangisidir?","c":["İlkel – Refleks – Temel – Sporel","Refleks – İlkel – Temel – Sporel","Temel – Refleks – İlkel – Sporel","Refleks – Temel – İlkel – Sporel","Sporel – Temel – İlkel – Refleks"],"d":1,"a":"Sıra: refleks hareketler (0–1), ilkel hareketler (0–2), temel hareketler (2–7), spora özgü (sporel) hareketler (7 ve sonrası)."},{"u":4,"s":"Temel hareketler evresi hangi yaş aralığını kapsar?","c":["0–1 yaş","0–2 yaş","2–7 yaş","7–12 yaş","12 yaş ve üzeri"],"d":2,"a":"2–7 yaş temel hareketler evresidir; koşma, atlama, atma, yakalama gibi beceriler bu dönemde kazanılır ve olgunlaşır."},{"u":4,"s":"Aşağıdakilerden hangisi yer değiştirme (lokomotor) becerisidir?","c":["Yakalama","Sekme","Yuvarlanma","Topa vurma","Sektirme"],"d":1,"a":"Sekme, vücudun bir yerden başka bir yere taşınmasını sağlayan yer değiştirme becerisidir. Yuvarlanma dengeleme, diğerleri nesne kontrolü becerisidir."},{"u":4,"s":"Aşağıdakilerden hangisi nesne kontrolü (manipülatif) becerisidir?","c":["Koşma","Sıçrama","Atma","Dönme","Eğilme"],"d":2,"a":"Nesne kontrolü becerileri bir araç ya da nesne üzerinde denetim gerektirir: atma, yakalama, vurma, tekme atma, sektirme."},{"u":4,"s":"Aşağıdakilerden hangisi dengeleme becerileri arasında yer alır?","c":["Galop","Yuvarlanma","Sektirme","Yakalama","Tekme atma"],"d":1,"a":"Yuvarlanma, dönme, eğilme, uzanma ve tek ayak üzerinde durma dengeleme becerileridir."},{"u":4,"s":"Temel hareket becerileri olgunlaşmadan spora özgü teknik öğretilmeye çalışılırsa ne olur?","c":["Öğrenme hızlanır","Beceri hatalı biçimde yerleşir ve düzeltilmesi güçleşir","Transfer artar","Kalıcılık artar","Hiçbir etkisi olmaz"],"d":1,"a":"Temel hareket altyapısı olmadan yüklenen teknik, üzerine kurulduğu zeminin bozukluğunu taşır; sonradan düzeltmek yeniden öğretmekten zordur."},{"u":4,"s":"Temel hareketler evresinin alt evreleri hangileridir?","c":["Refleks – İlkel – Olgun","Başlangıç – Geçiş – Olgun","Genel – Özel – Uzmanlaşma","Bilişsel – Bağlantısal – Otonom","Alıştırma – Sembolik – Kurallı"],"d":1,"a":"Temel hareketler evresi başlangıç, geçiş (ilk evre) ve olgun evre olmak üzere üçe ayrılır. Bilişsel–bağlantısal–otonom ise motor öğrenme evreleridir."},{"u":4,"s":"Sporel (spora özgü) hareketler evresinin alt evreleri hangileridir?","c":["Başlangıç – Geçiş – Olgun","Geçiş – Uygulama – Yaşam boyu kullanım","Refleks – İlkel – Temel","Duyusal – Bilişsel – Otonom","Kaba – İnce – Karma"],"d":1,"a":"Gallahue'ya göre sporel hareketler evresi üç alt evreden oluşur: geçiş (7–10 yaş, temel beceriler birleşip özelleşmeye başlar), uygulama (11–13 yaş, beceriler oyun ve yarışmada kullanılır) ve yaşam boyu kullanım (14 yaş ve sonrası, beceriler günlük yaşam, rekreasyon ve spora uygulanır)."},{"u":4,"s":"Hızlı büyüme döneminde çocuğun koordinasyonunun geçici olarak bozulması neyi gösterir?","c":["Öğrenmenin geri döndüğünü","Büyümenin motor performansı geçici olarak etkileyebileceğini","Yeteneğin olmadığını","Olgunlaşmanın durduğunu","Sporun bırakılması gerektiğini"],"d":1,"a":"Uzuv oranları hızla değişince mevcut hareket kalıpları geçici olarak uymaz hâle gelir. Bu normaldir ve yetenek eksikliği anlamına gelmez."},{"u":4,"s":"Refleks hareketler evresinin temel işlevi nedir?","c":["Spor tekniği kazandırmak","Bebeğin çevreden bilgi toplaması ve yaşamını sürdürmesi","Kurallı oyun oynamak","Denge becerisi geliştirmek","Uzmanlaşmayı sağlamak"],"d":1,"a":"Refleksler hem yaşamı sürdürmeye yarar hem de bebeğin çevre hakkında bilgi toplamasını sağlar; istemli hareketlerin temelini oluştururlar."},{"u":4,"s":"İlkel hareketler evresinde aşağıdakilerden hangisi gerçekleşir?","c":["Refleksler baskılanır, istemli hareketler ortaya çıkar","Spor tekniği öğrenilir","Kurallı oyun kavranır","Uzmanlaşma başlar","Soyut düşünme gelişir"],"d":0,"a":"0–2 yaş arasında refleksler yerini istemli hareketlere bırakır: tutma, oturma, emekleme ve yürüme bu evrenin kazanımlarıdır."},{"u":4,"s":"Motor gelişim ile büyüme arasındaki fark için hangisi doğrudur?","c":["İkisi aynı kavramdır","Büyüme nicel artış, motor gelişim hareket becerisindeki niteliksel ilerlemedir","Motor gelişim yalnızca boy artışıdır","Büyüme yalnızca beceriyle ilgilidir","Motor gelişim ölçülemez"],"d":1,"a":"Boyu uzayan çocuk otomatik olarak becerikli olmaz. Büyüme sayısal artış, motor gelişim ise hareket kalitesindeki ilerlemedir."},{"u":5,"s":"Önceden belirlenmiş bir amaca en az enerji ve zaman harcayarak isabetli biçimde ulaşabilme yeteneğine ne ad verilir?","c":["Kuvvet","Beceri","Dayanıklılık","Esneklik","Koordinasyon"],"d":1,"a":"Beceri tanımının üç anahtar öğesi vardır: belirlenmiş amaç, en az enerji ve zaman, isabetlilik."},{"u":5,"s":"Çevre koşullarının sürekli değiştiği ve önceden kestirilemediği becerilere ne ad verilir?","c":["Kapalı beceri","Açık beceri","Ayrık beceri","İnce motor beceri","Sürekli beceri"],"d":1,"a":"Açık becerilerde sporcu değişen çevreye uyum sağlamak zorundadır: futbol, güreş, tenis. Kapalı becerilerde çevre durağandır."},{"u":5,"s":"Aşağıdakilerden hangisi kapalı beceriye örnektir?","c":["Futbolda pas vermek","Güreşte rakibi devirmek","Okçulukta ok atmak","Basketbolda savunma yapmak","Tenis maçında dönüş vuruşu"],"d":2,"a":"Okçulukta çevre koşulları durağan ve kestirilebilirdir; sporcu hareketi kendi zamanlamasıyla başlatır. Bu kapalı beceridir."},{"u":5,"s":"Başlangıcı ve bitişi belirgin, kısa süreli becerilere ne ad verilir?","c":["Sürekli beceri","Seri beceri","Ayrık (diskret) beceri","Açık beceri","Kaba motor beceri"],"d":2,"a":"Basketbolda serbest atış ayrık beceridir: nerede başlayıp nerede bittiği bellidir."},{"u":5,"s":"Yüzme, koşu ve bisiklet gibi başlangıç ve bitişi keyfî olan, tekrarlı becerilere ne ad verilir?","c":["Ayrık beceri","Seri beceri","Sürekli beceri","Kapalı beceri","İnce motor beceri"],"d":2,"a":"Sürekli becerilerde hareket döngüsel biçimde yinelenir; nerede biteceğine sporcu karar verir."},{"u":5,"s":"Bir jimnastik serisinin ayrık becerilerin art arda dizilmesiyle oluşması onu hangi beceri türüne sokar?","c":["Ayrık beceri","Seri beceri","Sürekli beceri","Açık beceri","Kaba motor beceri"],"d":1,"a":"Seri beceri, ayrık becerilerin belirli bir sırayla birleştirilmesiyle oluşur; sıralama da becerinin parçasıdır."},{"u":5,"s":"Fitts ve Posner'a göre motor öğrenmenin evreleri sırasıyla hangileridir?","c":["Otonom – Bilişsel – Bağlantısal","Bilişsel – Bağlantısal – Otonom","Bağlantısal – Otonom – Bilişsel","Bilişsel – Otonom – Bağlantısal","Temel – Geçiş – Olgun"],"d":1,"a":"Önce ne yapılacağı anlaşılır (bilişsel), sonra hareket incelenir ve tutarlılık kazanır (bağlantısal), en sonunda otomatikleşir (otonom)."},{"u":5,"s":"Motor öğrenmenin bilişsel evresindeki bir sporcunun temel özelliği nedir?","c":["Hareketi düşünmeden yapması","Hatalarının çok ve düzensiz olması, dikkatinin tamamen harekette olması","Çevreyi rahatça izleyebilmesi","İnce ayar yapabilmesi","Performansının tutarlı olması"],"d":1,"a":"Bilişsel evrede sporcu 'ne yapacağım' sorusuyla uğraşır; hatalar çok ve tutarsızdır. Antrenör bu evrede az sayıda ve net ipucu vermelidir."},{"u":5,"s":"Bir sporcunun hareketi otomatik biçimde yaparken aynı anda rakibi ve boş alanı da izleyebilmesi hangi evrenin göstergesidir?","c":["Bilişsel evre","Bağlantısal evre","Otonom evre","Başlangıç evresi","Geçiş evresi"],"d":2,"a":"Otonom evrede hareket dikkat gerektirmez hâle gelir; boşalan dikkat kapasitesi oyunu okumaya ayrılabilir."},{"u":5,"s":"Motor öğrenmenin bağlantısal (çağrışımsal) evresinde antrenörün önceliği ne olmalıdır?","c":["Hareketi ilk kez göstermek","Hataları azaltıp tutarlılığı artıracak ince ayar geri bildirimi vermek","Sporcuyu tamamen serbest bırakmak","Yalnızca yarışma yaptırmak","Beceriyi tamamen değiştirmek"],"d":1,"a":"Bu evrede sporcu ne yapacağını bilir, 'nasıl daha iyi yaparım' sorusundadır; performans bilgisi türü geri bildirim en verimli burada kullanılır."},{"u":5,"s":"Aşağıdakilerden hangisi öğrenmenin gerçekleştiğinin göstergelerinden biri DEĞİLDİR?","c":["Gelişme","Tutarlılık","Kalıcılık","Uyarlanabilirlik","Tek seferlik yüksek performans"],"d":4,"a":"Bir kez yüksek performans göstermek öğrenmeyi kanıtlamaz; öğrenme gelişme, tutarlılık, kalıcılık ve uyarlanabilirlikle anlaşılır."},{"u":5,"s":"Öğrenme sürecinde performansın bir süre ilerlemeyip aynı düzeyde kalmasına ne ad verilir?","c":["Sönme","Plato","Transfer","Regresyon","Uyum"],"d":1,"a":"Plato, öğrenme eğrisindeki düzlüktür. Öğrenmenin durduğu değil, sporcunun içsel olarak yeniden yapılandığı dönem olarak kabul edilir."},{"u":5,"s":"Öğrenilen becerinin farklı koşullarda da kullanılabilmesi hangi göstergedir?","c":["Tutarlılık","Kalıcılık","Uyarlanabilirlik","Gelişme","Hız"],"d":2,"a":"Uyarlanabilirlik, becerinin antrenman ortamı dışında ve değişen koşullarda da uygulanabilmesidir; gerçek öğrenmenin en güçlü kanıtıdır."},{"u":5,"s":"Kaba motor beceri ile ince motor beceriyi ayıran ölçüt nedir?","c":["Becerinin süresi","Kullanılan kas gruplarının büyüklüğü","Çevrenin değişkenliği","Başlangıç ve bitişin belirginliği","Sporcunun yaşı"],"d":1,"a":"Kaba motor beceriler büyük kas gruplarını (koşma, atlama), ince motor beceriler küçük kas gruplarını (dart atma, ince ayar) kullanır."},{"u":5,"s":"Pilates ya da halter gibi, hareketin sporcunun kendi zamanlamasıyla ve durağan çevrede yapıldığı beceriler hangi gruptadır?","c":["Açık beceri","Kapalı beceri","Seri beceri","Manipülatif beceri","Lokomotor beceri"],"d":1,"a":"Çevre koşulları sabit ve kestirilebilir olduğunda beceri kapalıdır; sporcu hareketi kendisi başlatır ve dış etkene uyum zorunluluğu yoktur."},{"u":5,"s":"Motor öğrenmenin tanımı için aşağıdakilerden hangisi doğrudur?","c":["Yorgunluğa bağlı geçici performans değişimidir","Alıştırma ve yaşantı sonucu becerideki nispeten kalıcı gelişmedir","Olgunlaşmayla kendiliğinden oluşan değişimdir","Yalnızca yarışmada gözlenen üstünlüktür","Kalıtımla belirlenen yetenektir"],"d":1,"a":"Motor öğrenme, alıştırma ve deneyimin ürünüdür ve kalıcıdır; olgunlaşmadan ve geçici performans dalgalanmalarından ayrılır."},{"u":5,"s":"Açık becerilerin öğretiminde antrenmanların hangi özelliği taşıması daha uygundur?","c":["Tamamen sabit ve değişmez koşullarda yapılması","Değişen ve kestirilemeyen koşullar içermesi","Yalnızca zihinsel çalışmayla yürütülmesi","Hiç geri bildirim verilmemesi","Yalnızca tek bir tekrar biçimi kullanılması"],"d":1,"a":"Açık beceri değişken çevrede kullanılacaksa antrenman da değişkenlik içermelidir; sabit koşullarda öğrenilen beceri maça aktarılmakta zorlanır."},{"u":5,"s":"Bir sporcunun aynı hareketi her denemede benzer biçimde yapabilmesi hangi öğrenme göstergesidir?","c":["Gelişme","Tutarlılık","Uyarlanabilirlik","Kalıcılık","Transfer"],"d":1,"a":"Tutarlılık, performanstaki değişkenliğin azalmasıdır ve becerinin oturduğunu gösterir."},{"u":6,"s":"Hareket eğitimi yaklaşımının temel amacı nedir?","c":["Belirli bir spor dalının tekniğini öğretmek","Çocuğun hareket dağarcığını, beden farkındalığını ve özgüvenini geliştirmek","Yetenekli çocukları seçmek","Yarışmaya hazırlamak","Kondisyon geliştirmek"],"d":1,"a":"Hareket eğitimi çocuk merkezlidir ve amacı belirli bir tekniği öğretmek değil, çocuğun hareket yoluyla bütünsel gelişimini sağlamaktır."},{"u":6,"s":"Hareket eğitimiyle ilgili aşağıdakilerden hangisi YANLIŞTIR?","c":["Çocuk merkezlidir","Keşfetme ve problem çözmeye dayanır","Tek doğru hareket biçimi dayatır","Her çocuğun kendi düzeyinde başarı yaşamasını hedefler","Yaratıcılığı geliştirir"],"d":2,"a":"Hareket eğitiminde tek doğru yoktur; çocuğa problem verilir, o kendi çözümünü üretir. Tek tip doğru dayatmak yaklaşımın özüne aykırıdır."},{"u":6,"s":"Laban'ın hareket analizinde 'Ne hareket ediyor?' sorusu hangi boyuta karşılık gelir?","c":["Mekân farkındalığı","Beden farkındalığı","Çaba (efor) farkındalığı","İlişki farkındalığı","Zaman farkındalığı"],"d":1,"a":"Beden farkındalığı, hangi vücut bölümünün ne yaptığını ve hangi şekilleri alabildiğini kapsar."},{"u":6,"s":"'Nerede hareket ediyor?' sorusu hareketin hangi boyutunu tanımlar?","c":["Beden farkındalığı","Mekân (alan) farkındalığı","Çaba farkındalığı","İlişki farkındalığı","Akış"],"d":1,"a":"Mekân farkındalığı kişisel ve genel alanı, yönü, düzeyi (alçak–orta–yüksek) ve izlenen yolu kapsar."},{"u":6,"s":"Hareketin hızlı–yavaş, sert–yumuşak, bağlı–serbest biçiminde incelenmesi hangi boyuttur?","c":["Beden farkındalığı","Mekân farkındalığı","Çaba (efor) farkındalığı","İlişki farkındalığı","Denge"],"d":2,"a":"Çaba farkındalığı hareketin nasıl yapıldığıyla ilgilenir: zaman, kuvvet ve akış boyutlarını içerir."},{"u":6,"s":"Çocuğun eşiyle, grupla ya da araçla kurduğu bağlantı hareketin hangi boyutudur?","c":["Beden farkındalığı","İlişki farkındalığı","Mekân farkındalığı","Çaba farkındalığı","Denge farkındalığı"],"d":1,"a":"İlişki farkındalığı; kiminle, neyle ve nasıl bir bağ kurularak hareket edildiğini kapsar."},{"u":6,"s":"'Topu üç farklı biçimde durdurabilir misin?' yönergesi hangi öğretim anlayışının örneğidir?","c":["Komut stili","Hareket eğitimi / problem çözme yaklaşımı","Blok alıştırma","Sunuş yoluyla öğretim","Ceza uygulaması"],"d":1,"a":"Tek doğru dayatmadan birden çok çözüm arayan yönergeler hareket eğitiminin ve ıraksayan (problem çözme) stilinin özüdür."},{"u":6,"s":"Hareket eğitiminde değerlendirme nasıl yapılır?","c":["Çocuklar birbiriyle kıyaslanarak","Her çocuğun kendi gelişimi esas alınarak","Yalnızca yarışma derecesine göre","Kronometreyle sıralama yapılarak","Değerlendirme yapılmaz"],"d":1,"a":"Hareket eğitiminde ölçüt bireyseldir: çocuk başkasıyla değil, kendi önceki düzeyiyle karşılaştırılır."},{"u":6,"s":"Hareket eğitiminin çocuğun duygusal gelişimine katkısı aşağıdakilerden hangisidir?","c":["Yalnızca kas kuvvetini artırması","Başarı yaşayarak özgüven kazanmasını sağlaması","Rekabeti keskinleştirmesi","Kuralları ezberletmesi","Boy uzamasını hızlandırması"],"d":1,"a":"Herkesin kendi düzeyinde başarabildiği bir ortam, çocukta yeterlik ve özgüven duygusu oluşturur."},{"u":6,"s":"Hareket eğitiminde temel hareket becerilerinin çeşitlendirilmesi neden önemlidir?","c":["Erken uzmanlaşmayı hızlandırdığı için","Geniş hareket dağarcığı ileride her spor dalına olumlu transfer sağladığı için","Yarışma sonuçlarını yükselttiği için","Antrenman süresini kısalttığı için","Ölçmeyi kolaylaştırdığı için"],"d":1,"a":"Zengin hareket dağarcığı, sonradan öğrenilecek spora özgü becerilere olumlu transfer sağlar; erken uzmanlaşma ise bu zemini daraltır."},{"u":6,"s":"Hareket eğitimi hangi yaş grubu için özellikle uygundur?","c":["Yalnızca ergenler","Erken çocukluk ve temel hareketler evresindeki çocuklar","Yalnızca yetişkinler","Yalnızca elit sporcular","Yalnızca yaşlılar"],"d":1,"a":"Hareket eğitimi temel hareket becerilerinin kazanıldığı 2–7 yaş ve sonrasındaki çocukluk döneminde en verimlidir."},{"u":6,"s":"Aşağıdakilerden hangisi hareket eğitiminin amaçlarından biri DEĞİLDİR?","c":["Beden farkındalığı kazandırmak","Yaratıcılığı geliştirmek","En yetenekli çocukları seçip diğerlerini elemek","Harekete karşı olumlu tutum oluşturmak","Temel hareket becerilerini çeşitlendirmek"],"d":2,"a":"Hareket eğitimi bir yetenek seçme aracı değildir; amacı ayıklamak değil, herkesi hareket yoluyla geliştirmektir."},{"u":7,"s":"Oyunun çekiciliği en çok hangi etkenden kaynaklanır?","c":["Ödülün büyüklüğünden","Sonucun önceden bilinmemesinden (belirsizlikten)","Kuralların katılığından","Süresinin uzunluğundan","Seyirci sayısından"],"d":1,"a":"Sonucu baştan belli olan oyun ilgi çekmez. Bu yüzden denk takımlar kurmak, oyunu canlı tutmanın en basit ve en etkili yoludur."},{"u":7,"s":"Oyun türlerinden hangisinde çocuk bir rolü üstlenir?","c":["Alıştırmalı (işlevsel) oyun","Sembolik (–mış gibi) oyun","Kurallı oyun","Paralel oyun","Tek başına oyun"],"d":1,"a":"Sembolik oyunda çocuk doktor, öğretmen ya da anne rolüne bürünür; rol üstlenme içeren oyun türü budur. Alıştırmalı oyunda hareket kendisi için yinelenir, kurallı oyunda ise ortak kabul edilmiş kurallar vardır."},{"u":7,"s":"Hareketin kendisi için tekrarlandığı, bebeklikte görülen oyun türü hangisidir?","c":["Kurallı oyun","Sembolik oyun","Alıştırmalı (işlevsel) oyun","İşbirlikli oyun","Eğitsel oyun"],"d":2,"a":"Alıştırmalı oyunda çocuk topu defalarca yere atmak gibi hareketi hazzı için yineler; oyunun en ilkel biçimidir."},{"u":7,"s":"Çocukların yan yana ama birbirine karışmadan, ortak amaç gütmeden oynamasına ne ad verilir?","c":["İşbirlikli oyun","Paralel oyun","Tek başına oyun","İzleyici davranışı","Kurallı oyun"],"d":1,"a":"Paralel oyunda çocuklar aynı ortamda ve benzer etkinlikte bulunur ama etkileşim kurmazlar; sosyal oyun gelişiminin ara basamağıdır."},{"u":7,"s":"Ortak bir amaç ve rol paylaşımı içeren, sosyal oyun gelişiminin en üst basamağı hangisidir?","c":["Paralel oyun","Tek başına oyun","İşbirlikli oyun","İzleyici davranışı","Alıştırmalı oyun"],"d":2,"a":"İşbirlikli oyunda çocuklar ortak hedef için rol dağıtır ve birbirine bağımlı çalışır; takım sporlarının zeminidir."},{"u":7,"s":"Eğitsel oyunun tanımlayıcı özelliği nedir?","c":["Kuralsız ve kendiliğinden olması","Belirli bir eğitim amacına yönelik, planlı ve kurallı olması","Yalnızca yarışma amacı taşıması","Yetişkinlere özgü olması","Yalnızca kapalı alanda oynanması"],"d":1,"a":"Eğitsel oyun rastgele oyundan ayrılır: önceden belirlenmiş bir hedefi, planı ve kuralı vardır."},{"u":7,"s":"Eğitsel oyunlar sınıflandırılırken aşağıdakilerden hangisi ölçüt olarak kullanılMAZ?","c":["Katılımcı sayısı","Oyunun amacı","Hareket içeriği","Oyuncuların göz rengi","Yaş düzeyi"],"d":3,"a":"Eğitsel oyunlar katılımcı sayısı, amaç, yapı, hareket içeriği ve yaş düzeyine göre sınıflandırılır."},{"u":7,"s":"Oyunun çocuğun sosyal gelişimine katkısı aşağıdakilerden hangisidir?","c":["Kas kuvvetini artırması","Kurala uyma, sıra bekleme ve işbirliği öğretmesi","Boy uzamasını hızlandırması","Dikkat süresini kısaltması","Refleksleri güçlendirmesi"],"d":1,"a":"Oyun, kurallara uymayı, sırasını beklemeyi, paylaşmayı ve liderliği doğal ortamda öğretir."},{"u":7,"s":"Oyunun bilişsel gelişime katkısı hangisidir?","c":["Dayanıklılığı artırması","Dikkat, strateji ve problem çözme becerilerini geliştirmesi","Esnekliği artırması","Kemik yoğunluğunu artırması","Kalp atım hızını düşürmesi"],"d":1,"a":"Oyun kural izleme, strateji kurma ve hızlı karar verme gerektirir; bunlar doğrudan bilişsel becerilerdir."},{"u":7,"s":"Kurallı oyunların çocuk tarafından benimsenmesi hangi gelişimsel kazanımı gerektirir?","c":["Nesne sürekliliği","Başkasının bakış açısını alabilme ve kurala uyabilme","Refleks baskılanması","Soyut düşünme","Dil gelişiminin tamamlanması"],"d":1,"a":"Kurallı oyun, benmerkezcilikten çıkmayı ve ortak kabul edilen kurala uymayı gerektirir; okul çağıyla birlikte belirginleşir."},{"u":7,"s":"Çocuk sporunda oyunun temel işlevi nedir?","c":["Yalnızca eğlendirmek","Öğrenmenin doğal ve en etkili aracı olmak","Yalnızca kondisyon geliştirmek","Sıralama yapmak","Disiplin sağlamak"],"d":1,"a":"Çocuk için oyun boş zaman etkinliği değil, öğrenmenin doğal yoludur; beceri öğretimi oyun içine yerleştirildiğinde çok daha kalıcı olur."},{"u":8,"s":"'Etkin katılım' ilkesi hangi anlama gelir?","c":["Antrenörün çok konuşması","Öğrenenin süreçte yaparak yaşayarak yer alması","Sporcunun izleyerek öğrenmesi","Yalnızca yazılı materyal kullanılması","Antrenmanın kısa tutulması"],"d":1,"a":"Etkin katılım, öğrenenin pasif izleyici değil etkin uygulayıcı olmasıdır ve öğrenmeyi en çok artıran ilkelerden biri kabul edilir."},{"u":8,"s":"Antrenörün önce durağan topla pas çalıştırıp sonra hareket hâlinde pasa geçmesi hangi ilkedir?","c":["Basitten karmaşığa","Yakından uzağa","Somuttan soyuta","Ekonomiklik","Güncellik"],"d":0,"a":"Alıştırmanın kolaydan zora doğru sıralanması basitten karmaşığa ilkesidir."},{"u":8,"s":"'Öğretim bireyin yaşına, hazırbulunuşluğuna ve ilgisine uygun olmalıdır' ifadesi hangi ilkedir?","c":["Ekonomiklik","Öğrenciye görelik","Açıklık","Bütünlük","Hedefe görelik"],"d":1,"a":"Öğrenciye görelik (bireysellik) ilkesi, herkese aynı programı vermenin neden yanlış olduğunu açıklar."},{"u":8,"s":"Antrenörün önce hareketi göstermesi, sonra taktiksel gerekçesini anlatması hangi ilkeyle uyumludur?","c":["Somuttan soyuta","Yakından uzağa","Ekonomiklik","Güncellik","Bütünlük"],"d":0,"a":"Elle tutulur, görülebilir olandan kavramsal olana geçmek somuttan soyuta ilkesidir."},{"u":8,"s":"Öğretimde mümkün olduğunca çok duyu organına hitap etme ilkesi hangisidir?","c":["Açıklık (ayanilik)","Ekonomiklik","Bütünlük","Süreklilik","Hedefe görelik"],"d":0,"a":"Açıklık ilkesi anlat–göster–yaptır zincirini gerektirir; ne kadar çok duyu devreye girerse öğrenme o kadar güçlü olur."},{"u":8,"s":"'En az emek ve zamanla en çok verimi elde etme' ilkesi hangisidir?","c":["Ekonomiklik","Açıklık","Bütünlük","Yaşama yakınlık","Öğrenciye görelik"],"d":0,"a":"Ekonomiklik ilkesi, tek bir alıştırmayla birden çok hedefe hizmet etmeyi savunur."},{"u":8,"s":"Antrenmanda maç koşullarına benzer alıştırmalar kullanmak hangi ilkeyle açıklanır?","c":["Yaşama yakınlık","Ekonomiklik","Açıklık","Bilinenden bilinmeyene","Süreklilik"],"d":0,"a":"Yaşama yakınlık ilkesi, öğretilenin gerçek kullanım ortamına benzemesini gerektirir; böylece transfer güçlenir."},{"u":8,"s":"Yeni öğretilecek beceriyi sporcunun bildiği bir hareketle ilişkilendirmek hangi ilkedir?","c":["Bilinenden bilinmeyene","Yakından uzağa","Ekonomiklik","Açıklık","Bütünlük"],"d":0,"a":"Yeni bilgi mevcut bilgiye bağlandığında anlamlı öğrenme gerçekleşir; bu Ausubel'in anlamlı öğrenme anlayışıyla da örtüşür."},{"u":8,"s":"Sporcunun yalnız tekniğini değil, kaygısını ve sosyal uyumunu da dikkate alan antrenör hangi ilkeyi uygular?","c":["Bütünlük","Ekonomiklik","Güncellik","Süreklilik","Açıklık"],"d":0,"a":"Bütünlük ilkesine göre birey bedensel, zihinsel, duygusal ve sosyal yönleriyle bir bütündür ve bir arada ele alınmalıdır."},{"u":8,"s":"Antrenmanın her bölümünün belirlenmiş hedefe hizmet etmesi gerektiğini belirten ilke hangisidir?","c":["Hedefe görelik","Ekonomiklik","Yakından uzağa","Açıklık","Güncellik"],"d":0,"a":"Hedefe görelik ilkesi, içerik ve etkinliklerin hedefle tutarlı olmasını gerektirir; hedefe hizmet etmeyen etkinlik zaman kaybıdır."},{"u":8,"s":"Sunuş yoluyla öğretme stratejisinin kuramcısı ve işleyişi hangisidir?","c":["Bruner – özelden genele","Ausubel – genelden özele, düzenli sunum","Dewey – problem çözme","Skinner – pekiştirme","Piaget – dengeleme"],"d":1,"a":"Ausubel'in sunuş yoluyla öğretiminde önce genel kavram verilir, sonra ayrıntıya inilir; kısa sürede çok bilgi aktarmak için uygundur."},{"u":8,"s":"Buluş yoluyla öğretme stratejisinde öğrenenin rolü nedir?","c":["Verilen bilgiyi ezberlemek","Örneklerden yola çıkarak kuralı kendisi keşfetmek","Yalnızca izlemek","Ölçme yapmak","Yalnızca tekrar etmek"],"d":1,"a":"Bruner'in buluş yoluyla öğretiminde öğretmen örnek ve ipucu sunar, genel kuralı öğrenen kendisi bulur; özelden genele işler."},{"u":8,"s":"Araştırma–inceleme yoluyla öğretme stratejisinin temel yararı nedir?","c":["Kısa sürede çok bilgi aktarması","Problem çözme ve bilimsel düşünme becerisi kazandırması","Ölçmeyi kolaylaştırması","Antrenörün iş yükünü azaltması","Ezberi güçlendirmesi"],"d":1,"a":"Bu strateji öğreneni bilimsel yöntemle problem çözmeye yöneltir; kalıcılığı ve üst düzey düşünmeyi geliştirir. Zayıf yönü zaman almasıdır."},{"u":8,"s":"Araştırma–inceleme stratejisinin en belirgin sınırlılığı nedir?","c":["Kalıcılığın düşük olması","Çok zaman gerektirmesi","Güdülenmeyi düşürmesi","Yalnızca ezbere dayanması","Ölçülememesi"],"d":1,"a":"Öğrenenin problemi kendi başına çözmesi zaman alır; sınırlı süreli antrenmanlarda tek başına kullanılması güçtür."},{"u":8,"s":"Tamamen bilinmeyen yeni bir konunun kısa sürede öğretilmesi gerekiyorsa hangi strateji uygundur?","c":["Buluş yoluyla öğretme","Sunuş yoluyla öğretme","Araştırma–inceleme yoluyla öğretme","Problem çözme","Tartışma"],"d":1,"a":"Ön bilgi yoksa ve süre kısıtlıysa, düzenli biçimde sunulan bilgi (sunuş yolu) en verimli seçenektir."},{"u":8,"s":"Öğretim ilkeleri neden önemlidir?","c":["Yalnızca sınavda sorulduğu için","Konu ne olursa olsun öğretimin uyması gereken genel kuralları belirlediği için","Antrenman süresini uzattığı için","Yarışma sonucunu garanti ettiği için","Ölçme aracı oldukları için"],"d":1,"a":"İlkeler alandan bağımsızdır; hangi beceri öğretilirse öğretilsin geçerli olan genel kurallardır."},{"u":8,"s":"'Öğretim yakın çevreden başlayıp uzağa doğru genişlemelidir' ifadesi hangi ilkedir?","c":["Yakından uzağa","Basitten karmaşığa","Somuttan soyuta","Ekonomiklik","Bütünlük"],"d":0,"a":"Yakından uzağa ilkesi hem mekân hem zaman bakımından bilinen yakın örneklerden başlamayı gerektirir."},{"u":8,"s":"Strateji, yöntem ve teknik kavramlarının ilişkisi için hangisi doğrudur?","c":["Üçü aynı anlama gelir","Strateji en genel yoldur; yöntem stratejinin uygulanma biçimi, teknik ise yöntemin uygulama ayrıntısıdır","Teknik en geniş kavramdır","Yöntem stratejiden daha geneldir","Strateji yalnızca ölçmeyle ilgilidir"],"d":1,"a":"Kapsam sırası stratejiden tekniğe doğru daralır: strateji genel yolu, yöntem izlenen usulü, teknik ise uygulamadaki ayrıntıyı belirtir."},{"u":9,"s":"Beden eğitimi ve antrenörlükte en yaygın kullanılan öğretim yöntemi hangisidir?","c":["Anlatım","Gösterip yaptırma (demonstrasyon)","Tartışma","Örnek olay","Beyin fırtınası"],"d":1,"a":"Hareket öğretiminde beceri önce doğru biçimde gösterilir, sonra sporcuya yaptırılır; gösterip yaptırma bu alanın temel yöntemidir."},{"u":9,"s":"Etkili bir gösterim (demonstrasyon) için aşağıdakilerden hangisi YANLIŞTIR?","c":["Model doğru olmalıdır","Herkesin görebileceği bir konumda yapılmalıdır","Uzun ve ayrıntılı açıklamayla birlikte verilmelidir","Farklı açılardan birkaç kez tekrarlanmalıdır","Gösterimin hemen ardından sporcu denemelidir"],"d":2,"a":"Gösterime eşlik eden açıklama kısa ve tek bir noktaya odaklı olmalıdır. Uzun açıklama dikkati dağıtır ve görsel bilginin kodlanmasını engeller."},{"u":9,"s":"Beceri bir bütün olarak, parçalara ayrılmadan öğretiliyorsa hangi yöntem kullanılmıştır?","c":["Parça yöntemi","Bütün yöntemi","Karma yöntem","Blok alıştırma","Zihinsel çalışma"],"d":1,"a":"Bütün yöntemi becerinin baştan sona tek parça çalışılmasıdır; basit, hızlı ve bölündüğünde anlamını yitiren becerilerde tercih edilir."},{"u":9,"s":"Aşağıdaki durumlardan hangisinde parça yöntemi tercih edilmelidir?","c":["Beceri basit ve hızlıysa","Beceri karmaşık, yavaş ve doğal parçalara ayrılabiliyorsa","Beceri bölündüğünde anlamını yitiriyorsa","Sporcu otonom evredeyse","Süre çok kısıtlıysa"],"d":1,"a":"Yüzmede kol–ayak–nefes ya da bir jimnastik serisi gibi karmaşık ve parçalanabilir becerilerde parça yöntemi uygundur."},{"u":9,"s":"Uygulamada en yaygın kullanılan karma yol hangisidir?","c":["Parça–bütün–parça","Bütün–parça–bütün","Yalnızca bütün","Yalnızca parça","Blok–rastgele–blok"],"d":1,"a":"Önce bütün gösterilir, zorlanılan parça ayrıca çalışılır, sonra yine bütünleştirilir. Bu, becerinin anlamını kaybetmeden ayrıntının düzeltilmesini sağlar."},{"u":9,"s":"Aynı becerinin arka arkaya tekrarlandığı alıştırma düzeni hangisidir?","c":["Rastgele (karışık) alıştırma","Blok (sabit) alıştırma","Değişken alıştırma","Aralıklı çalışma","Zihinsel çalışma"],"d":1,"a":"Blok alıştırmada aynı beceri kesintisiz yinelenir; antrenmandaki performansı hızla yükseltir."},{"u":9,"s":"Blok alıştırma ile rastgele alıştırma karşılaştırıldığında hangisi doğrudur?","c":["Blok alıştırma hem performansı hem kalıcılığı artırır","Rastgele alıştırma antrenmanda daha
