<head>

<meta name="theme-color" content="#151814" media="(prefers-color-scheme: dark)">

</head>
<body>
<!--ARTIFACT-BASLA-->
<style>
/* ---------- Tokens: açık tema temel, koyu tema üzerine yazar ---------- */
:root{
  --zemin:#F3F4F1;
  --kart:#FFFFFF;
  --kart-2:#EBEDE8;
  --cizgi:#D6D9D2;
  --cizgi-güç:#B9BEB4;
  --metin:#1C211B;
  --metin-yumusak:#5A6157;
  --metin-silik:#868D82;
  --vurgu:#B8791F;
  --vurgu-koyu:#8E5C13;
  --vurgu-zemin:#F7EBD8;
  --dogru:#2C7A4B;
  --dogru-zemin:#DFF0E5;
  --yanlis:#B23B2E;
  --yanlis-zemin:#F8E3E0;
  --bilgi:#2D5F8A;
  --bilgi-zemin:#E1ECF6;
  --golge:0 1px 2px rgba(28,33,27,.06), 0 8px 24px -12px rgba(28,33,27,.18);
  --r:10px;
  --f-baslik:"Bahnschrift","DIN Condensed","Avenir Next Condensed","Haettenschweiler","Franklin Gothic Medium",system-ui,sans-serif;
  --f-metin:Cambria,Charter,Georgia,"Times New Roman",serif;
  --f-ui:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",sans-serif;
  --f-sayi:Consolas,"SF Mono",ui-monospace,"Courier New",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --zemin:#151814;
    --kart:#1E221D;
    --kart-2:#262B24;
    --cizgi:#333A31;
    --cizgi-güç:#4A5346;
    --metin:#E9ECE6;
    --metin-yumusak:#AAB2A5;
    --metin-silik:#7C857A;
    --vurgu:#E0A345;
    --vurgu-koyu:#F0BC69;
    --vurgu-zemin:#3A2E17;
    --dogru:#6BC08C;
    --dogru-zemin:#1D3527;
    --yanlis:#E88A7C;
    --yanlis-zemin:#3A211D;
    --bilgi:#8FBADF;
    --bilgi-zemin:#1B2A38;
    --golge:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --zemin:#151814;
  --kart:#1E221D;
  --kart-2:#262B24;
  --cizgi:#333A31;
  --cizgi-güç:#4A5346;
  --metin:#E9ECE6;
  --metin-yumusak:#AAB2A5;
  --metin-silik:#7C857A;
  --vurgu:#E0A345;
  --vurgu-koyu:#F0BC69;
  --vurgu-zemin:#3A2E17;
  --dogru:#6BC08C;
  --dogru-zemin:#1D3527;
  --yanlis:#E88A7C;
  --yanlis-zemin:#3A211D;
  --bilgi:#8FBADF;
  --bilgi-zemin:#1B2A38;
  --golge:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
/* Sayfa üç şeride bölünür: başlık, kaydırılabilir gövde, alt gezinme.
   Kaydırma pencerede değil <main> içinde olur — böylece kaydırma düğmeleri
   hem dosyadan açıldığında hem gömülü sayfada aynı biçimde çalışır. */
html,body{height:100%}
body{
  height:100dvh;
  margin:0; background:var(--zemin); color:var(--metin);
  font-family:var(--f-ui); font-size:16px; line-height:1.55;
  display:flex; flex-direction:column; overflow:hidden;
}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--vurgu); outline-offset:2px; border-radius:4px}
@media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important} }

/* ---------- Üst şerit ---------- */
.ust{
  flex:none; z-index:30; background:var(--zemin);
  border-bottom:1px solid var(--cizgi);
}
.ust-ic{max-width:780px; margin:0 auto; padding:10px 16px 8px; display:flex; align-items:center; gap:12px}
.marka{display:flex; flex-direction:column; gap:1px; min-width:0}
.marka b{
  font-family:var(--f-baslik); font-weight:600; font-size:19px; letter-spacing:.02em;
  text-transform:uppercase; line-height:1.1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.marka span{font-size:11.5px; color:var(--metin-silik); letter-spacing:.06em; text-transform:uppercase}
.ust-sag{margin-left:auto; display:flex; align-items:center; gap:8px}
.tema-dugme{
  background:none; border:1px solid var(--cizgi); border-radius:8px; width:34px; height:34px;
  cursor:pointer; display:grid; place-items:center; font-size:15px; flex:none;
}
.tema-dugme:hover{background:var(--kart-2)}

/* 14 ünite = 14 çentik. Doluluk gerçek ilerlemeyi gösterir. */
.centikler{max-width:780px; margin:0 auto; padding:0 16px 9px; display:flex; gap:3px}
.centik{height:4px; flex:1; background:var(--cizgi); border-radius:2px; overflow:hidden}
.centik i{display:block; height:100%; background:var(--vurgu); width:0}
.centik.tam i{background:var(--dogru)}

/* ---------- Alt gezinme ---------- */
.alt{
  flex:none; z-index:30;
  background:var(--kart); border-top:1px solid var(--cizgi);
  padding-bottom:env(safe-area-inset-bottom);
}
.alt-ic{max-width:780px; margin:0 auto; display:grid; grid-template-columns:repeat(5,1fr)}
.alt button{
  background:none; border:0; padding:9px 2px 10px; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:3px;
  font-size:10.5px; letter-spacing:.03em; color:var(--metin-silik);
  border-top:2.5px solid transparent; text-transform:uppercase;
}
.alt button svg{width:21px; height:21px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
.alt button[aria-current="page"]{color:var(--vurgu); border-top-color:var(--vurgu)}
.rozet{
  position:absolute; transform:translate(14px,-6px); background:var(--yanlis); color:#fff;
  font-size:9.5px; font-family:var(--f-sayi); min-width:16px; height:16px; border-radius:8px;
  display:grid; place-items:center; padding:0 4px;
}

/* ---------- Yerleşim ---------- */
main{
  flex:1 1 auto; min-height:0; overflow-y:auto; overflow-x:hidden;
  scroll-behavior:smooth; -webkit-overflow-scrolling:touch;
}
.govde{max-width:780px; margin:0 auto; padding:18px 16px 30px}

/* Fare tekerleği ya da PageUp/PageDown olmadan da gezinme */
.kaydir{
  position:fixed; right:14px; bottom:88px; z-index:40;
  display:flex; flex-direction:column; gap:7px;
}
.kaydir button{
  width:46px; height:46px; border-radius:12px; cursor:pointer;
  background:var(--kart); border:1px solid var(--cizgi-güç); box-shadow:var(--golge);
  display:grid; place-items:center; color:var(--metin-yumusak);
  transition:background .12s, color .12s, opacity .15s;
  -webkit-user-select:none; user-select:none; touch-action:manipulation;
}
.kaydir button:hover:not(:disabled){background:var(--vurgu); border-color:var(--vurgu); color:#1C1608}
.kaydir button:disabled{opacity:.3; cursor:default}
.kaydir button svg{width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round}
@media (max-width:520px){ .kaydir{right:8px; bottom:80px} .kaydir button{width:42px; height:42px} }
.sayfa{display:none}
.sayfa.acik{display:block; animation:gir .18s ease-out}
@keyframes gir{from{opacity:0; transform:translateY(4px)}to{opacity:1; transform:none}}

h1{font-family:var(--f-baslik); font-size:27px; font-weight:600; letter-spacing:.01em; margin:0 0 4px; text-wrap:balance}
h2{font-family:var(--f-baslik); font-size:21px; font-weight:600; margin:26px 0 8px; letter-spacing:.01em; text-wrap:balance}
h3{font-family:var(--f-ui); font-size:14px; font-weight:700; margin:20px 0 6px; letter-spacing:.01em}
.giris{color:var(--metin-yumusak); font-size:14.5px; margin:0 0 20px; max-width:60ch}
.etiket{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--metin-silik); font-weight:600}

.kart{background:var(--kart); border:1px solid var(--cizgi); border-radius:var(--r); box-shadow:var(--golge)}
.dizi{display:flex; flex-direction:column; gap:10px}

/* Ünite listesi */
.unite{
  display:flex; align-items:center; gap:13px; width:100%; text-align:left;
  padding:12px 14px; background:var(--kart); border:1px solid var(--cizgi);
  border-radius:var(--r); cursor:pointer; transition:border-color .15s, transform .1s;
}
.unite:hover{border-color:var(--cizgi-güç)}
.unite:active{transform:scale(.995)}
.unite-no{
  font-family:var(--f-sayi); font-size:13px; width:30px; height:30px; flex:none; border-radius:7px;
  display:grid; place-items:center; background:var(--kart-2); color:var(--metin-yumusak);
}
.unite.tamam .unite-no{background:var(--dogru-zemin); color:var(--dogru)}
.unite-ad{flex:1; min-width:0}
.unite-ad b{display:block; font-size:15px; font-weight:600; line-height:1.3}
.unite-ad span{font-size:12px; color:var(--metin-silik); font-variant-numeric:tabular-nums}
.halka{width:34px; height:34px; flex:none}
.halka circle{fill:none; stroke-width:3.5}
.halka .iz{stroke:var(--cizgi)}
.halka .dolu{stroke:var(--vurgu); stroke-linecap:round; transform:rotate(-90deg); transform-origin:50% 50%}
.halka text{font-family:var(--f-sayi); font-size:11px; fill:var(--metin-yumusak); text-anchor:middle}

/* Ünite metni */
.metin{font-family:var(--f-metin); font-size:17.5px; line-height:1.65; max-width:62ch}
.metin p{margin:0 0 13px}
.metin ul{margin:0 0 14px; padding-left:20px}
.metin li{margin-bottom:6px}
.metin b{color:var(--metin)}
.metin em{font-style:italic; color:var(--metin-yumusak)}
.kutu{
  border-left:3px solid var(--vurgu); background:var(--vurgu-zemin);
  padding:11px 14px; border-radius:0 8px 8px 0; margin:0 0 15px;
  font-family:var(--f-ui); font-size:14.5px; line-height:1.5; max-width:62ch;
}
.kutu .etiket{display:block; margin-bottom:4px; color:var(--vurgu-koyu)}
.karistirma{
  border-left:3px solid var(--bilgi); background:var(--bilgi-zemin);
  padding:11px 14px; border-radius:0 8px 8px 0; margin:0 0 15px;
  font-family:var(--f-ui); font-size:14.5px; max-width:62ch;
}
.karistirma .etiket{display:block; margin-bottom:4px; color:var(--bilgi)}
.tablo-sar{overflow-x:auto; margin:0 0 16px; border:1px solid var(--cizgi); border-radius:8px}
table{border-collapse:collapse; width:100%; font-family:var(--f-ui); font-size:14px}
th,td{padding:8px 11px; text-align:left; border-bottom:1px solid var(--cizgi); vertical-align:top}
th{background:var(--kart-2); font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--metin-yumusak); font-weight:600}
tr:last-child td{border-bottom:0}

/* Düğmeler */
.dg{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  padding:11px 17px; border-radius:9px; border:1px solid var(--cizgi);
  background:var(--kart); cursor:pointer; font-size:14.5px; font-weight:600;
  transition:background .15s, border-color .15s;
}
.dg:hover{background:var(--kart-2)}
.dg.ana{background:var(--vurgu); border-color:var(--vurgu); color:#1C1608}
.dg.ana:hover{background:var(--vurgu-koyu); border-color:var(--vurgu-koyu); color:#fff}
.dg.genis{width:100%}
.dg:disabled{opacity:.45; cursor:default}
.dg-sira{display:flex; gap:9px; flex-wrap:wrap; margin-top:16px}

/* ---------- Soru ---------- */
.soru-ust{
  display:flex; align-items:center; gap:10px; margin-bottom:14px;
  font-size:12.5px; color:var(--metin-silik); font-family:var(--f-sayi);
}
.ilerle-cubuk{flex:1; height:5px; background:var(--cizgi); border-radius:3px; overflow:hidden}
.ilerle-cubuk i{display:block; height:100%; background:var(--vurgu); transition:width .25s}

.soru-kart{background:var(--kart); border:1px solid var(--cizgi); border-radius:var(--r); padding:18px; box-shadow:var(--golge)}
.soru-unite{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--metin-silik); margin-bottom:7px}
.soru-metin{font-family:var(--f-metin); font-size:18.5px; line-height:1.5; margin:0 0 16px; text-wrap:pretty}
.siklar{display:flex; flex-direction:column; gap:8px}
.sik{
  display:flex; gap:11px; align-items:flex-start; text-align:left; width:100%;
  padding:11px 13px; border:1.5px solid var(--cizgi); border-radius:9px;
  background:var(--kart); cursor:pointer; font-size:15.5px; line-height:1.45;
  transition:border-color .12s, background .12s;
}
.sik:hover:not(:disabled){border-color:var(--cizgi-güç); background:var(--kart-2)}
.sik:disabled{cursor:default}
.sik-harf{
  font-family:var(--f-sayi); font-size:12.5px; width:23px; height:23px; flex:none; border-radius:6px;
  display:grid; place-items:center; background:var(--kart-2); color:var(--metin-yumusak); margin-top:1px;
}
.sik.dogru{border-color:var(--dogru); background:var(--dogru-zemin)}
.sik.dogru .sik-harf{background:var(--dogru); color:#fff}
.sik.yanlis{border-color:var(--yanlis); background:var(--yanlis-zemin)}
.sik.yanlis .sik-harf{background:var(--yanlis); color:#fff}
.sik.solgun{opacity:.55}

.aciklama{margin-top:15px; padding:13px 15px; border-radius:9px; background:var(--kart-2); border:1px solid var(--cizgi); font-size:14.5px; line-height:1.55}
.aciklama .basi{display:flex; align-items:center; gap:7px; font-weight:700; margin-bottom:6px; font-size:13px; letter-spacing:.04em; text-transform:uppercase}
.aciklama.iyi .basi{color:var(--dogru)}
.aciklama.kotu .basi{color:var(--yanlis)}
.dogru-cevap{
  margin-bottom:8px; padding:7px 10px; border-radius:7px;
  background:var(--dogru-zemin); color:var(--dogru); font-weight:600; line-height:1.4;
}

/* Sonuç */
.sonuc{text-align:center; padding:30px 20px}
.sonuc .puan{font-family:var(--f-baslik); font-size:64px; line-height:1; font-variant-numeric:tabular-nums}
.sonuc .puan.gecti{color:var(--dogru)}
.sonuc .puan.kaldi{color:var(--yanlis)}
.sonuc .karar{font-family:var(--f-baslik); font-size:22px; letter-spacing:.04em; text-transform:uppercase; margin-top:6px}
.sonuc p{color:var(--metin-yumusak); font-size:14.5px; max-width:44ch; margin:10px auto 0}


/* İstatistik */
.ist{display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin-bottom:18px}
.ist div{background:var(--kart); border:1px solid var(--cizgi); border-radius:var(--r); padding:12px}
.ist b{display:block; font-family:var(--f-sayi); font-size:24px; line-height:1.15; font-variant-numeric:tabular-nums}
.ist span{font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:var(--metin-silik)}

.bos{text-align:center; padding:44px 20px; color:var(--metin-silik); font-size:15px}
.bos svg{width:40px; height:40px; stroke:currentColor; fill:none; stroke-width:1.4; margin-bottom:10px; opacity:.6}
.dip{margin:30px 0 10px; font-size:12.5px; color:var(--metin-silik); line-height:1.55; border-top:1px solid var(--cizgi); padding-top:14px}
@media (max-width:420px){
  .soru-metin{font-size:17px}
  h1{font-size:23px}
  .sonuc .puan{font-size:52px}
}
</style>

<header class="ust">
  <div class="ust-ic">
    <div class="marka">
      <b>Sporda Öğrenme ve Öğretme</b>
      <span>Temel Antrenörlük Eğitimi · 2. Kademe</span>
    </div>
    <div class="ust-sag">
      <button class="tema-dugme" id="temaDugme" title="Açık / koyu tema" aria-label="Temayı değiştir">◐</button>
    </div>
  </div>
  <div class="centikler" id="centikler" title="Ünite ilerlemesi"></div>
</header>

<main id="govde"><div class="govde">
  <!-- KONULAR -->
  <section class="sayfa acik" id="sayfa-konular">
    <div id="unite-liste-gorunum">
      <h1>Konular</h1>
      <p class="giris" id="konu-giris"> Her ünitenin özeti bir oturumda okunacak uzunlukta; altındaki sorular doğrudan o üniteden geliyor. Halkalar o üniteden verdiğin doğru cevap oranını gösterir.</p>
      <div class="ist" id="genel-ist"></div>
      <div class="dizi" id="unite-listesi"></div>
      <p class="dip" id="dipnot"></p>
    </div>
    <div id="unite-detay" style="display:none"></div>
  </section>

  <!-- ÇALIŞ -->
  <section class="sayfa" id="sayfa-calis"></section>

  <!-- YANLIŞLARIM -->
  <section class="sayfa" id="sayfa-yanlis"></section>

  <!-- DENEME -->
  <section class="sayfa" id="sayfa-deneme"></section>
</div></main>

<div class="kaydir" id="kaydir">
  <button id="k-yukari" aria-label="Yukarı kaydır" title="Yukarı"><svg viewBox="0 0 24 24"><path d="M18 15l-6-6-6 6"/></svg></button>
  <button id="k-asagi" aria-label="Aşağı kaydır" title="Aşağı"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
</div>

<nav class="alt">
  <div class="alt-ic" id="alt-nav"></div>
</nav>

<script>
"use strict";

/* ============================================================
   VERİ
   ============================================================ */
const UNITELER = [{"ad":"Öğrenme ve Öğretme Kavramları","ozet":"\n<p><b>Öğrenme</b>, yaşantı ürünü olarak meydana gelen, nispeten kalıcı izli davranış değişikliğidir. Bu tanım üç ölçüt içerir.</p>\n<div class=\"kutu\"><span class=\"etiket\">Öğrenmenin üç ölçütü</span>\n<b>1. Davranışta değişme olacak.</b> Sadece bilme değil, davranışa yansıma.<br>\n<b>2. Değişme yaşantı ürünü olacak.</b> Yani birey çevreyle etkileşime girmiş olacak.<br>\n<b>3. Değişme nispeten kalıcı olacak.</b> Geçici değişmeler öğrenme sayılmaz.</div>\n<p>Bu ölçütlerden biri eksikse ortada öğrenme yoktur. <b>Refleksler, içgüdüler, olgunlaşmayla ortaya çıkan davranışlar</b> ve yorgunluk, hastalık, ilaç, alkol gibi etkenlerle oluşan <b>geçici</b> değişmeler öğrenme değildir. Bebeğin emmesi refleks, yürümeye başlaması büyük ölçüde olgunlaşmadır; ama yüzmeyi sökmesi öğrenmedir.</p>\n<p><b>Öğrenme doğrudan gözlenemez.</b> Gözlenen şey performanstır; öğrenmenin olup olmadığını performanstan çıkarsarız. Sporcunun antrenmanda tutturduğu servis performanstır; iki hafta sonra da tutturabiliyorsa öğrenme gerçekleşmiştir.</p>\n<div class=\"karistirma\"><span class=\"etiket\">Kolay karışanlar</span>\n<b>Öğrenme</b>: kalıcı, gözlenemez, süreçtir. &nbsp;•&nbsp; <b>Performans</b>: anlık, gözlenebilir, üründür. Yorgunluk ve heyecan performansı düşürür ama öğrenmeyi silmez.</div>\n<p><b>Öğretme</b>, öğrenmenin gerçekleşmesi için ortam düzenleme ve kılavuzluk etme işidir. <b>Öğretim</b> ise öğretmenin planlı, programlı ve amaçlı biçimde yapılmasıdır. <b>Eğitim</b>, bireyde kendi yaşantısı yoluyla kasıtlı olarak istendik davranış değişikliği meydana getirme sürecidir — üçünün en geniş kavramıdır.</p>\n<div class=\"tablo-sar\"><table>\n<thead><tr><th>Kavram</th><th>Ne demek</th><th>Örnek</th></tr></thead>\n<tbody>\n<tr><td>Eğitim</td><td>Kasıtlı, istendik davranış değiştirme süreci (en geniş)</td><td>Sporcunun kulüpteki tüm gelişimi</td></tr>\n<tr><td>Öğretim</td><td>Planlı ve programlı eğitim</td><td>Haftalık antrenman programı</td></tr>\n<tr><td>Öğretme</td><td>Öğrenmeyi sağlama, kılavuzluk</td><td>Antrenörün beceriyi göstermesi</td></tr>\n<tr><td>Öğrenme</td><td>Bireyde oluşan kalıcı değişme</td><td>Sporcunun beceriyi kazanması</td></tr>\n</tbody></table></div>\n<p>Antrenör bu zincirde <b>öğretici</b> konumundadır.</p>\n"},{"ad":"Öğrenmeyi Etkileyen Faktörler","ozet":"\n<p>Öğrenmeyi etkileyen etkenler üç başlıkta toplanır. Hangi maddenin hangi başlığa ait olduğu ayırt edilmelidir.</p>\n<div class=\"tablo-sar\"><table>\n<thead><tr><th>Öğrenenle ilgili</th><th>Öğrenme malzemesiyle ilgili</th><th>Öğrenme yöntemiyle ilgili</th></tr></thead>\n<tbody><tr>\n<td>Türe özgü hazıroluş<br>Olgunlaşma<br>Genel uyarılmışlık hâli ve kaygı<br>Yaş<br>Zekâ ve yetenek<br>Güdülenme (motivasyon)<br>Dikkat<br>Ön öğrenmeler ve transfer</td>\n<td>Algısal ayırt edilebilirlik<br>Anlamsal çağrışım (anlamlılık)<br>Kavramsal gruplandırma<br>Telaffuz edilebilirlik<br>Malzemenin uzunluğu<br>Benzerlik ve karışma</td>\n<td>Konuya etkin katılım<br>Öğrenmeye ayrılan zaman<br>Aralıklı çalışma<br>Geri bildirim<br>Tekrar<br>Araya giren etkinlikler<br>Rehberlik</td>\n</tr></tbody></table></div>\n<h3>Öğrenenle ilgili faktörler</h3>\n<p><b>Türe özgü hazıroluş</b>, organizmanın türü gereği o davranışı yapabilecek donanımda olmasıdır — insana uçmayı öğretemezsiniz. <b>Olgunlaşma</b> ise bireyin o beceriyi yapabilecek biyolojik düzeye gelmesidir; olgunlaşmamış çocuğa beceri öğretilemez.</p>\n<p><b>Genel uyarılmışlık hâli</b> ile öğrenme arasında <b>ters U</b> ilişkisi vardır: çok düşük uyarılmışlık (uyuşukluk) da çok yüksek uyarılmışlık (aşırı kaygı) da öğrenmeyi düşürür; en iyi öğrenme <b>orta düzeyde</b> gerçekleşir.</p>\n<h3>Malzemeyle ilgili faktörler</h3>\n<p>Malzeme <b>algısal olarak ayırt edilebilir</b>, <b>anlamlı</b>, <b>kavramsal olarak gruplanabilir</b> ve <b>kolay telaffuz edilebilir</b> olduğunda daha çabuk öğrenilir. Telaffuz edilebilirlik önemlidir çünkü söylenebilen malzeme zihinde tekrar edilebilir; tekrar edilebilen malzeme belleğe daha kolay yerleşir.</p>\n<h3>Yöntemle ilgili faktörler</h3>\n<p><b>Etkin katılım</b> öğrenmenin en güçlü belirleyicilerindendir: izleyen değil yapan öğrenir. <b>Aralıklı çalışma</b> toplu (kütlesel) çalışmadan üstündür — aynı toplam sürede araya dinlenme koyan sporcu daha kalıcı öğrenir. <b>Geri bildirim</b> olmadan tekrar, hatayı pekiştirmekten başka işe yaramaz.</p>\n<div class=\"kutu\"><span class=\"etiket\">Transfer (öğrenmenin aktarılması)</span>\n<b>Olumlu transfer:</b> Önceki öğrenme yenisini kolaylaştırır (hentbol atışı bilen voleybol smacını çabuk öğrenir).<br>\n<b>Olumsuz transfer:</b> Önceki öğrenme yenisini zorlaştırır (tenis forehandı badminton vuruşunu bozar).<br>\n<b>Sıfır transfer:</b> İkisi arasında ilişki yoktur.</div>\n"},{"ad":"Büyüme, Gelişme ve Olgunlaşma","ozet":"\n<p>Aşağıdaki dört kavram birbirine benzer görünür; hiçbiri diğerinin yerine kullanılamaz.</p>\n<div class=\"tablo-sar\"><table>\n<thead><tr><th>Kavram</th><th>Tanım</th><th>Ayırt edici</th></tr></thead>\n<tbody>\n<tr><td><b>Büyüme</b></td><td>Bedende meydana gelen <b>nicel</b> (sayısal) artış</td><td>Ölçülebilir: boy, kilo, uzuv uzunluğu</td></tr>\n<tr><td><b>Olgunlaşma</b></td><td>Organizmanın <b>kalıtımın</b> etkisiyle kendisinden beklenen işlevi yerine getirebilecek düzeye gelmesi</td><td>Öğrenmeden bağımsızdır, zamanla kendiliğinden olur</td></tr>\n<tr><td><b>Gelişme</b></td><td>Büyüme, olgunlaşma ve öğrenmenin etkileşimiyle oluşan <b>sürekli ilerleyen</b> değişim</td><td>En kapsayıcı kavram</td></tr>\n<tr><td><b>Hazırbulunuşluk</b></td><td>Olgunlaşma + öğrenme + ilgi, tutum ve güdülenmenin toplamı</td><td>Olgunlaşmadan <b>daha geniştir</b></td></tr>\n</tbody></table></div>\n<div class=\"karistirma\"><span class=\"etiket\">Kolay karışanlar</span>\n<b>Olgunlaşma</b> yalnız biyolojik hazır oluştur. <b>Hazırbulunuşluk</b> ise ona istekliliği ve ön öğrenmeleri de ekler. Çocuk kayak yapacak olgunluğa gelmiş olabilir ama kardan korkuyorsa hazırbulunuşluğu yoktur.</div>\n<h3>Kalıtım ve çevre</h3>\n<p><b>Genotip</b>, bireyin anne ve babasından aldığı <b>kalıtsal yapının tümüdür</b> — dışarıdan görünmez. <b>Fenotip</b>, genotipin çevreyle etkileşimi sonucunda ortaya çıkan, <b>gözlenebilen</b> özelliklerdir. Boy potansiyeli genotiptir; beslenme ve antrenmanla ulaşılan gerçek boy fenotiptir.</p>\n<h3>Gelişim ilkeleri</h3>\n<ul>\n<li><b>Baştan ayağa (sefalokaudal):</b> Gelişim baştan başlar, ayaklara doğru ilerler. Bebek önce başını tutar, sonra oturur, en son yürür.</li>\n<li><b>İçten dışa (proksimodistal):</b> Vücudun merkezinden uzuvlara doğru. Önce omuz ve kol, sonra el ve parmak kontrolü.</li>\n<li><b>Genelden özele:</b> Kaba (büyük kas) hareketlerden ince (küçük kas) hareketlere.</li>\n<li><b>Gelişim bir bütündür:</b> Bedensel, bilişsel, duygusal ve sosyal alanlar birbirini etkiler.</li>\n<li><b>Gelişim süreklidir ama hızı sabit değildir:</b> Hızlı ve yavaş dönemler birbirini izler (nöbetleşe gelişim).</li>\n<li><b>Kritik dönemler vardır:</b> Belirli bir davranışın en kolay kazanıldığı dönem kaçırılırsa sonradan öğrenmek güçleşir.</li>\n<li><b>Bireysel farklılıklar vardır:</b> Sıra aynıdır, hız kişiden kişiye değişir.</li>\n</ul>\n<div class=\"kutu\"><span class=\"etiket\">Antrenöre düşen</span>\nAynı yaştaki iki çocuğun biyolojik yaşı farklı olabilir. Bu nedenle takvim yaşı değil, gelişim düzeyi esas alınır.</div>\n"},{"ad":"Motor Gelişim ve Evreleri","ozet":"\n<p><b>Motor gelişim</b>, yaşam boyu süren hareket davranışındaki değişimi inceler. <b>Psikomotor gelişim</b> ise zihin ile kas gücünün birlikte çalışmasını gerektiren beceri gelişimidir — yani hareketin içinde <em>düşünme</em> de vardır. Motor gelişim yalnız çocukluğu değil, doğumdan ölüme kadar tüm yaşamı kapsar.</p>\n<h3>Motor gelişim evreleri (Gallahue)</h3>\n<div class=\"tablo-sar\"><table>\n<thead><tr><th>Evre</th><th>Yaş</th><th>Ne olur</th></tr></thead>\n<tbody>\n<tr><td><b>Refleks hareketler</b></td><td>Doğum–1</td><td>İstemsiz refleksler. Bebek çevreden bilgi toplar ve çözer.</td></tr>\n<tr><td><b>İlkel hareketler</b></td><td>0–2</td><td>Refleksler baskılanır, istemli hareketler başlar: tutma, oturma, yürüme.</td></tr>\n<tr><td><b>Temel hareketler</b></td><td>2–7</td><td>Koşma, atlama, atma, yakalama gibi <b>temel beceriler</b> kazanılır. Başlangıç → geçiş → olgun evrelerden geçer.</td></tr>\n<tr><td><b>Sporel (spora özgü) hareketler</b></td><td>7 ve sonrası</td><td>Temel beceriler birleşip spor tekniklerine dönüşür. Üç alt evresi: <b>geçiş</b> (7–10), <b>uygulama</b> (11–13), <b>yaşam boyu kullanım</b> (14+).</td></tr>\n</tbody></table></div>\n<div class=\"kutu\"><span class=\"etiket\">Antrenörlükteki karşılığı</span>\nTemel hareketler evresi <b>olgunlaşmadan</b> spora özgü teknik öğretilmeye kalkılırsa beceri hatalı yerleşir. 2–7 yaş dönemi teknik dönemi değil, <b>hareket dağarcığı</b> dönemidir.</div>\n<h3>Temel hareket becerileri</h3>\n<div class=\"tablo-sar\"><table>\n<thead><tr><th>Yer değiştirme (lokomotor)</th><th>Dengeleme</th><th>Nesne kontrolü (manipülatif)</th></tr></thead>\n<tbody><tr>\n<td>Yürüme, koşma, sıçrama, sekme, atlama, galop, kayma, tırmanma</td>\n<td>Dönme, eğilme, uzanma, yuvarlanma, durma, esneme, tek ayak üzerinde durma</td>\n<td>Atma, yakalama, vurma, tekme atma, sektirme, yuvarlama, topa ayakla hâkim olma</td>\n</tr></tbody></table></div>\n<p>Grup ayrımına dikkat: <b>yuvarlanma</b> dengeleme, <b>sekme</b> yer değiştirme, <b>sektirme</b> nesne kontrolü becerisidir.</p>\n<div class=\"karistirma\"><span class=\"etiket\">Kolay karışanlar</span>\n<b>Büyüme</b> nicel artıştır, <b>motor gelişim</b> hareket becerisindeki niteliksel ilerlemedir. Boyu uzayan çocuk otomatik olarak daha becerikli olmaz; hatta hızlı büyüme döneminde koordinasyon geçici olarak bozulabilir.</div>\n"},{"ad":"Motor Öğrenme ve Beceri","ozet":"\n<p><b>Beceri</b>, önceden belirlenmiş bir amaca en az enerji ve zaman harcayarak, isabetli biçimde ulaşabilme yeteneğidir. <b>Motor öğrenme</b> ise alıştırma ve yaşantı sonucu becerideki nispeten kalıcı gelişmedir.</p>\n<h3>Becerilerin sınıflandırılması</h3>\n<div class=\"tablo-sar\"><table>\n<thead><tr><th>Ölçüt</th><th>Türler</th><th>Örnek</th></tr></thead>\n<tbody>\n<tr><td>Çevre koşulları</td><td><b>Açık beceri</b>: çevre değişken, kestirilemez<br><b>Kapalı beceri</b>: çevre durağan, kestirilebilir</td><td>Açık: futbol, tenis, güreş<br>Kapalı: okçuluk, halter, artistik jimnastik, pilates hareketi</td></tr>\n<tr><td>Başlangıç–bitişin belirginliği</td><td><b>Ayrık</b>: başı sonu belli, kısa<br><b>Seri</b>: ayrık becerilerin dizisi<br><b>Sürekli</b>: başı sonu keyfî, tekrarlı</td><td>Ayrık: serbest atış<br>Seri: jimnastik serisi<br>Sürekli: yüzme, koşu, bisiklet</td></tr>\n<tr><td>Kullanılan kas grubu</td><td><b>Kaba motor</b>: büyük kaslar<br><b>İnce motor</b>: küçük kaslar</td><td>Kaba: koşma, atlama<br>İnce: dart atma, yazı yazma</td></tr>\n</tbody></table></div>\n<h3>Motor öğrenmenin evreleri (Fitts ve Posner)</h3>\n<div class=\"kutu\"><span class=\"etiket\">Üç evre — sırasıyla</span>\n<b>1. Bilişsel evre:</b> Sporcu \"ne yapacağım\" sorusuyla uğraşır. Hata çok ve düzensizdir, dikkatinin tamamı harekete ayrılmıştır. Antrenör <b>az sayıda, net</b> ipucu vermelidir.<br>\n<b>2. Bağlantısal (çağrışımsal) evre:</b> \"Nasıl daha iyi yaparım\" evresi. Hata azalır, tutarlılık artar, ince ayar yapılır. Geri bildirim en verimli burada kullanılır.<br>\n<b>3. Otonom (otomatik) evre:</b> Hareket otomatikleşmiştir, dikkat artık çevreye ayrılabilir. Sporcu koşarken rakibi de okuyabilir. Değişim yavaştır ama kalıcıdır.</div>\n<h3>Öğrenmenin gerçekleştiğini nereden anlarız?</h3>\n<ul>\n<li><b>Gelişme:</b> Performans zaman içinde iyileşir.</li>\n<li><b>Tutarlılık:</b> Aynı hareket her seferinde benzer biçimde yapılır.</li>\n<li><b>Kalıcılık:</b> Aradan zaman geçse de beceri korunur.</li>\n<li><b>Uyarlanabilirlik:</b> Beceri değişen koşullarda da uygulanabilir.</li>\n</ul>\n<p><b>Öğrenme eğrisi</b> genellikle başta hızlı yükselir, sonra yavaşlar. Bir süre ilerlemenin durduğu düzlüğe <b>plato</b> denir; plato öğrenmenin bittiği anlamına gelmez, sporcunun içsel olarak yeniden yapılandığı dönemdir.</p>\n<div class=\"karistirma\"><span class=\"etiket\">Kolay karışanlar</span>\n<b>Performans</b> antrenmanda gözlenen anlık düzeydir; <b>öğrenme</b> aradan zaman geçtikten sonra da korunan kalıcı değişimdir. Antrenmanda mükemmel yapıp bir hafta sonra unutuluyorsa öğrenme değil geçici performans artışı olmuştur.</div>\n"},{"ad":"Hareket Eğitimi","ozet":"\n<p><b>Hareket eğitimi</b>, çocuğun hareket yoluyla eğitilmesini amaçlayan, <b>çocuk merkezli</b> bir yaklaşımdır. Amaç belirli bir spor dalının tekniğini öğretmek değil, çocuğun hareket dağarcığını, beden farkındalığını ve kendine güvenini geliştirmektir.</p>\n<div class=\"kutu\"><span class=\"etiket\">Yaklaşımın özü</span>\nHareket eğitiminde <b>tek doğru yoktur</b>. Çocuğa hareket <em>gösterilip taklit ettirilmez</em>; problem verilir, çocuk kendi çözümünü keşfeder. \"Topu üç farklı biçimde durdurabilir misin?\" hareket eğitimidir; \"topu şöyle durdur\" değildir.</div>\n<h3>Hareketin dört boyutu (Laban)</h3>\n<div class=\"tablo-sar\"><table>\n<thead><tr><th>Boyut</th><th>Sorusu</th><th>İçeriği</th></tr></thead>\n<tbody>\n<tr><td><b>Beden farkındalığı</b></td><td>Ne hareket ediyor?</td><td>Vücut bölümleri, bunların ne yapabildiği, vücut şekilleri</td></tr>\n<tr><td><b>Mekân (alan) farkındalığı</b></td><td>Nerede hareket ediyor?</td><td>Kişisel ve genel alan, yön, düzey (alçak–orta–yüksek), yol</td></tr>\n<tr><td><b>Çaba (efor) farkındalığı</b></td><td>Nasıl hareket ediyor?</td><td>Zaman (hızlı–yavaş), kuvvet (sert–yumuşak), akış (bağlı–serbest)</td></tr>\n<tr><td><b>İlişki farkındalığı</b></td><td>Kiminle / neyle?</td><td>Eşle, grupla, araçla, engelle kurulan ilişki</td></tr>\n</tbody></table></div>\n<h3>Hareket eğitiminin amaçları</h3>\n<ul>\n<li>Temel hareket becerilerini çeşitlendirmek ve olgunlaştırmak</li>\n<li>Beden farkındalığı ve mekân algısı kazandırmak</li>\n<li>Yaratıcılığı ve problem çözmeyi geliştirmek</li>\n<li>Her çocuğun <b>kendi düzeyinde</b> başarı yaşamasını sağlamak — eleme ve kıyas yoktur</li>\n<li>Harekete karşı olumlu tutum ve kalıcı spor alışkanlığı oluşturmak</li>\n</ul>\n<div class=\"karistirma\"><span class=\"etiket\">Dikkat</span>\nHareket eğitimi <b>yarışma odaklı değildir</b>, <b>tek tip doğru hareket dayatmaz</b>, <b>belirli bir spor dalına hazırlık amacı gütmez</b> ve <b>yetenek seçimi aracı değildir</b>. Bu dört ifadeden biri \"hareket eğitimiyle ilgili doğrudur\" diye önüne konursa yanlıştır.</div>\n"},{"ad":"Oyun ve Eğitsel Oyunlar","ozet":"\n<p><b>Oyun</b>, gönüllü katılımla yapılan, kendi kuralları olan, haz veren ve sonucu önceden belli olmayan etkinliktir. Çocuk için oyun eğlence değil, <b>öğrenmenin doğal yoludur</b>.</p>\n<div class=\"kutu\"><span class=\"etiket\">Oyunun çekiciliği nereden gelir?</span>\n<b>Belirsizlikten.</b> Sonucun önceden bilinmemesi oyunu çekici kılar. Sonucu baştan belli olan oyun ilgi çekmez; bu yüzden denk takımlar kurmak, oyunu canlı tutmanın en basit yoludur.</div>\n<h3>Oyun türleri</h3>\n<p><b>Oyun türleri:</b></p>\n<ul>\n<li><b>Alıştırmalı (işlevsel) oyun:</b> Hareketin kendisi için tekrarlanması. Bebeğin topu sürekli yere atması.</li>\n<li><b>Sembolik (–mış gibi / rol) oyun:</b> Çocuğun bir rolü üstlendiği oyun. Doktorculuk, evcilik. <b>Rol üstlenme içeren oyun türü budur.</b></li>\n<li><b>Kurallı oyun:</b> Ortak kabul edilmiş kurallarla oynanan oyun. Sportif oyunların temeli; okul çağıyla birlikte belirginleşir.</li>\n</ul>\n<p><b>Sosyal katılıma göre (Parten):</b> tek başına oyun → izleyici davranışı → <b>paralel oyun</b> (yan yana ama birbirine karışmadan) → birlikte oyun → <b>işbirlikli oyun</b> (ortak amaç ve rol paylaşımı).</p>\n<h3>Eğitsel oyunlar</h3>\n<p><b>Eğitsel oyun</b>, belirli bir eğitim amacına ulaşmak için planlanmış, kuralları önceden belirlenmiş oyundur. Sınıflandırılırken şu ölçütler kullanılır: <b>katılımcı sayısı</b> (bireysel, eşli, grup), <b>amaç</b> (ısınma, beceri, kuvvet, dikkat), <b>yapı</b> (kurallı–kuralsız), <b>hareket içeriği</b> (koşulu, toplu, dengeli) ve <b>yaş düzeyi</b>.</p>\n<div class=\"kutu\"><span class=\"etiket\">Oyunun gelişime katkısı</span>\n<b>Bedensel:</b> temel hareket becerileri, koordinasyon, dayanıklılık. <b>Bilişsel:</b> dikkat, strateji, problem çözme, kavram öğrenme. <b>Sosyal:</b> kurala uyma, sıra bekleme, işbirliği, liderlik. <b>Duygusal:</b> kazanmayı ve kaybetmeyi öğrenme, öz denetim. <b>Dil:</b> sözcük dağarcığı ve iletişim.</div>\n"},{"ad":"Öğretim İlkeleri ve Stratejileri","ozet":"\n<p>Öğretim ilkeleri, hangi konu öğretilirse öğretilsin uyulması gereken genel kurallardır. Sınavda bir örnek verilip \"bu hangi ilkedir\" diye sorulur.</p>\n<div class=\"tablo-sar\"><table>\n<thead><tr><th>İlke</th><th>Anlamı</th><th>Sporda karşılığı</th></tr></thead>\n<tbody>\n<tr><td><b>Öğrenciye görelik</b></td><td>Öğretim bireyin yaşına, düzeyine, ilgisine uygun olmalı</td><td>Aynı alıştırmayı 8 ve 18 yaşa aynı biçimde vermemek</td></tr>\n<tr><td><b>Etkin katılım</b></td><td>Öğrenen <b>yaparak</b> öğrenir; izleyici değil katılımcı olmalı</td><td>Sıra bekleyen kuyruklar yerine herkesin topla çalıştığı düzen</td></tr>\n<tr><td><b>Somuttan soyuta</b></td><td>Önce elle tutulur olan, sonra kavram</td><td>Önce hareketi göstermek, sonra taktiği anlatmak</td></tr>\n<tr><td><b>Basitten karmaşığa</b></td><td>Kolaydan zora doğru sıralama</td><td>Duran topla pas, sonra hareket hâlinde pas</td></tr>\n<tr><td><b>Bilinenden bilinmeyene</b></td><td>Yeni bilgi eskisine bağlanmalı</td><td>Bildiği bir hareketle yeni hareketi ilişkilendirmek</td></tr>\n<tr><td><b>Yakından uzağa</b></td><td>Yakın çevreden uzağa doğru</td><td>Kendi kulübünden başlayıp uluslararası örneklere geçmek</td></tr>\n<tr><td><b>Açıklık (ayanilik)</b></td><td>Mümkün olduğunca çok duyuya hitap etmek</td><td>Anlat + göster + yaptır</td></tr>\n<tr><td><b>Ekonomiklik</b></td><td>En az emek ve zamanla en çok verim</td><td>Tek alıştırmayla hem ısınma hem beceri çalışmak</td></tr>\n<tr><td><b>Yaşama yakınlık</b></td><td>Öğretilen, gerçek yaşamda kullanılabilir olmalı</td><td>Maç koşullarına benzeyen alıştırmalar</td></tr>\n<tr><td><b>Bütünlük</b></td><td>Bireyin bedensel, zihinsel, duygusal yönü birlikte ele alınmalı</td><td>Yalnız tekniği değil, sporcunun kaygısını da yönetmek</td></tr>\n<tr><td><b>Hedefe görelik</b></td><td>Tüm etkinlikler belirlenen hedefe hizmet etmeli</td><td>Antrenmanın her bölümünün bir amacı olması</td></tr>\n</tbody></table></div>\n<div class=\"kutu\"><span class=\"etiket\">Bağlantı</span>\n\"Öğrencinin derse aktif katılması, yaparak yaşayarak öğrenmesi\" ifadesi <b>etkin katılım</b> ilkesidir. Bu ilke, öğrenmeyi en çok artıran ilke olarak kabul edilir.</div>\n<h3>Öğretim stratejileri</h3>\n<div class=\"tablo-sar\"><table>\n<thead><tr><th>Strateji</th><th>Kuramcı</th><th>İşleyiş</th><th>Ne zaman uygun</th></tr></thead>\n<tbody>\n<tr><td><b>Sunuş yoluyla</b></td><td>Ausubel</td><td>Öğretmen kavram ve ilkeleri düzenli biçimde sunar; genelden özele</td><td>Yeni ve tamamen bilinmeyen konularda, kısa sürede çok bilgi verilecekse</td></tr>\n<tr><td><b>Buluş yoluyla</b></td><td>Bruner</td><td>Örnekler verilir, öğrenen kuralı kendisi bulur; özelden genele</td><td>Kavram ve ilke öğretiminde, güdülenmeyi artırmak için</td></tr>\n<tr><td><b>Araştırma–inceleme yoluyla</b></td><td>Dewey</td><td>Problem ortaya konur, öğrenen bilimsel yöntemle çözer</td><td>Problem çözme ve üst düzey düşünme hedefleniyorsa</td></tr>\n</tbody></table></div>\n<p><b>Araştırma–inceleme stratejisinin yararları:</b> problem çözme becerisi kazandırır, bilimsel düşünmeyi öğretir, öğrenmeyi kalıcı kılar, üst düzey zihinsel becerileri geliştirir ve öğreneni bağımsız hâle getirir. Zayıf yönü <b>zaman almasıdır</b>.</p>\n"},{"ad":"Öğretim Yöntem, Teknik ve Stilleri","ozet":"\n<p>Strateji <em>yolu</em>, yöntem <em>yöntemi</em>, teknik ise <em>uygulama biçimini</em> belirler. Sporda beceri öğretiminin kendine özgü yöntemleri vardır.</p>\n<h3>Genel öğretim yöntemleri</h3>\n<p><b>Anlatım</b> (kısa ve az kullanılmalı), <b>soru–cevap</b>, <b>tartışma</b>, <b>gösterip yaptırma</b>, <b>problem çözme</b>, <b>işbirlikli öğrenme</b>, <b>bireysel çalışma</b>, <b>beyin fırtınası</b>, <b>drama</b>. Beden eğitimi ve antrenörlükte en çok kullanılan yöntem <b>gösterip yaptırmadır</b> (demonstrasyon).</p>\n<div class=\"kutu\"><span class=\"etiket\">Etkili gösterimin kuralları</span>\nModel <b>doğru</b> olmalı; herkesin görebileceği yerde, <b>farklı açılardan</b> ve <b>birkaç kez</b> yapılmalı; önce <b>gerçek hızda</b>, sonra gerekiyorsa yavaşlatılarak gösterilmeli; gösterime eşlik eden açıklama <b>kısa ve tek bir noktaya</b> odaklı olmalı. Gösterim sonrası sporcu <b>hemen</b> denemelidir.</div>\n<h3>Bütün ve parça yöntemi</h3>\n<div class=\"tablo-sar\"><table>\n<thead><tr><th>Yöntem</th><th>Nasıl</th><th>Ne zaman tercih edilir</th></tr></thead>\n<tbody>\n<tr><td><b>Bütün yöntemi</b></td><td>Beceri baştan sona bir bütün olarak çalışılır</td><td>Beceri <b>basit</b>, <b>hızlı</b> ve parçalara ayrıldığında anlamını yitiriyorsa (sıçrama, atış)</td></tr>\n<tr><td><b>Parça yöntemi</b></td><td>Beceri anlamlı parçalara ayrılır, ayrı ayrı öğretilir, sonra birleştirilir</td><td>Beceri <b>karmaşık</b>, <b>yavaş</b> ve doğal parçaları varsa (yüzmede kol–ayak–nefes, jimnastik serisi)</td></tr>\n<tr><td><b>Bütün–parça–bütün</b></td><td>Önce bütün gösterilir, zorlanılan parça ayrı çalışılır, sonra yine bütünleştirilir</td><td>Uygulamada en yaygın kullanılan karma yol</td></tr>\n</tbody></table></div>\n<h3>Alıştırma düzenlemesi</h3>\n<div class=\"karistirma\"><span class=\"etiket\">Kolay karışanlar</span>\n<b>Blok (sabit) alıştırma</b> — aynı beceri arka arkaya tekrarlanır. Antrenmanda performansı <b>hızla yükseltir</b> ama kalıcılığı ve transferi <b>düşüktür</b>.<br>\n<b>Rastgele (karışık) alıştırma</b> — farklı beceriler karışık sırada çalışılır. Antrenmanda performans <b>daha kötü görünür</b>, ancak öğrenme <b>daha kalıcı</b> olur ve maça daha iyi aktarılır.<br>\n</div>\n<p><b>Kütlesel (toplu) çalışma</b> dinlenmesiz veya çok kısa aralıklı; <b>aralıklı çalışma</b> ise dinlenme aralıkları geniş çalışmadır. Yeni öğrenme aşamasında ve yorgunluk riski yüksek becerilerde <b>aralıklı çalışma</b> üstündür. <b>Değişken alıştırma</b> (aynı becerinin farklı mesafe, açı ve hızlarda çalışılması) uyarlanabilirliği artırır.</p>\n<p><b>Zihinsel çalışma (imgeleme)</b>, hareketin fiilen yapılmadan zihinde canlandırılmasıdır. Fiziksel çalışmanın yerini tutmaz ama fiziksel çalışmayla <b>birlikte</b> kullanıldığında öğrenmeyi artırır; sakatlık döneminde de becerinin korunmasına yardım eder.</p>\n<h3>Mosston'un öğretim stilleri</h3>\n<p>Kararların kimde olduğuna göre öğretmen merkezliden öğrenci merkezliye doğru sıralanır:</p>\n<ul>\n<li><b>Komut stili:</b> Tüm kararlar antrenörde. Sporcu tek komutla aynı anda aynı hareketi yapar. Güvenlik ve disiplin gereken durumlarda uygun.</li>\n<li><b>Alıştırma stili:</b> Sporcu kendi hızında çalışır, antrenör bireysel dönüt verir.</li>\n<li><b>Karşılıklı (eşli) stil:</b> Sporcular ikişerli çalışır; biri yapar, diğeri ölçüt listesine göre geri bildirim verir.</li>\n<li><b>Kendini denetleme stili:</b> Sporcu kendi performansını ölçüte göre değerlendirir.</li>\n<li><b>Kapsama (katılım) stili:</b> Aynı görev farklı zorluk düzeylerinde sunulur, herkes kendi düzeyini seçer.</li>\n<li><b>Yönlendirilmiş buluş:</b> Antrenör soru dizisiyle sporcuyu tek bir doğru çözüme ulaştırır.</li>\n<li><b>Problem çözme (ıraksayan):</b> Aynı probleme birden çok doğru çözüm aranır. Yaratıcılığı en çok geliştiren stildir.</li>\n</ul>\n"},{"ad":"Geri Bildirim (Dönüt)","ozet":"\n<p><b>Geri bildirim</b>, sporcunun yaptığı hareket ve onun sonucu hakkında aldığı bilgidir. Motor öğrenmede alıştırmadan sonraki <b>en güçlü değişkendir</b>; geri bildirimsiz tekrar, hatayı pekiştirmekten başka işe yaramaz.</p>\n<h3>Kaynağına göre</h3>\n<div class=\"tablo-sar\"><table>\n<thead><tr><th>Tür</th><th>Kaynağı</th><th>Örnek</th></tr></thead>\n<tbody>\n<tr><td><b>İçsel (doğal, duyusal)</b></td><td>Sporcunun kendi duyu organları: görme, işitme, kinestetik duyu</td><td>Atışın elden nasıl çıktığını hissetmek, topun sepete girdiğini görmek</td></tr>\n<tr><td><b>Dışsal (eklenmiş, artırılmış)</b></td><td>Dışarıdan bir kaynak: antrenör, video, kronometre</td><td>\"Dirseğin düşüktü\", \"12,4 saniye\"</td></tr>\n</tbody></table></div>\n<h3>Dışsal geri bildirimin iki türü</h3>\n<div class=\"kutu\"><span class=\"etiket\">Mutlaka ayırt et</span>\n<b>Sonuç bilgisi (KR):</b> Hareketin <b>sonucu</b> hakkında bilgi. \"Top dışarı gitti\", \"9,8 saniye koştun\".<br>\n<b>Performans bilgisi (KP):</b> Hareketin <b>yapılış biçimi</b> hakkında bilgi. \"Bileğini son anda kırmadın\", \"ağırlığını arkada bıraktın\".<br>\nSonuç bilgisini sporcu çoğu zaman kendisi de edinebilir; performans bilgisi ise dışarıdan verilir.</div>\n<h3>Zamanlama ve sıklık</h3>\n<ul>\n<li><b>Eş zamanlı geri bildirim</b> hareket sürerken, <b>sonlandırıcı geri bildirim</b> hareket bittikten sonra verilir.</li>\n<li><b>Gecikmeli geri bildirim</b> her zaman kötü değildir: hareketin hemen ardından birkaç saniye beklemek, sporcunun <b>kendi içsel geri bildirimini işlemesine</b> fırsat verir ve öğrenmeyi güçlendirir.</li>\n<li><b>Her denemede geri bildirim vermek</b> antrenmandaki performansı yükseltir ama <b>bağımlılık</b> yaratır: antrenör susunca performans düşer. Bu yüzden geri bildirim zamanla <b>azaltılmalıdır</b>.</li>\n<li><b>Özet geri bildirim</b> (birkaç denemenin toplu değerlendirmesi) ve <b>bant genişliği geri bildirimi</b> (yalnız hata belirli sınırı aşınca dönüt verme) kalıcı öğrenme için daha etkilidir.</li>\n</ul>\n<h3>Geri bildirimin işlevleri</h3>\n<p><b>Bilgi verme</b> (hatanın ne olduğunu ve nasıl düzeltileceğini gösterir), <b>güdüleme</b> (çabayı sürdürtür), <b>pekiştirme</b> (doğru davranışı sağlamlaştırır).</p>\n<div class=\"kutu\"><span class=\"etiket\">İyi geri bildirimin kuralları</span>\nTek seferde <b>bir</b> noktaya odaklan — çoklu düzeltme hiçbirini düzeltmez. <b>Somut ve gözlenebilir</b> ol (\"daha iyi yap\" değil, \"dizini öne al\"). Önce <b>doğru olanı</b> söyle, sonra düzeltmeyi ver. Sporcunun <b>düzeyine</b> uygun dil kullan; bilişsel evredeki sporcuya ayrıntı verme. Geri bildirimi <b>kişiye</b> değil <b>harekete</b> yönelt.</div>\n"},{"ad":"Ders Planlama, Ölçme ve Değerlendirme","ozet":"\n<p>Planlama, \"ne öğretilecek, nasıl öğretilecek, öğrenildiği nasıl anlaşılacak\" sorularının önceden yanıtlanmasıdır. Plansız antrenman, hedefi olmayan tekrardır.</p>\n<h3>Planın dört öğesi</h3>\n<ul>\n<li><b>Hedef:</b> Öğrenenin kazanması beklenen nitelik. Hedefin gözlenebilir hâline <b>davranış</b> (kazanım) denir.</li>\n<li><b>İçerik:</b> Hedefe ulaştıracak konu ve alıştırmalar.</li>\n<li><b>Öğretme–öğrenme süreci:</b> Hangi strateji, yöntem, araç ve düzenle işleneceği.</li>\n<li><b>Ölçme ve değerlendirme:</b> Hedefe ulaşılıp ulaşılmadığının belirlenmesi.</li>\n</ul>\n<h3>Antrenman/ders bölümleri</h3>\n<div class=\"tablo-sar\"><table>\n<thead><tr><th>Bölüm</th><th>Amaç</th><th>İçerik</th></tr></thead>\n<tbody>\n<tr><td><b>Hazırlık (ısınma)</b></td><td>Organizmayı yüklenmeye hazırlamak, sakatlığı önlemek, dikkati toplamak</td><td>Genel ısınma, germe, özel ısınma</td></tr>\n<tr><td><b>Ana bölüm</b></td><td>Günün hedefine ulaşmak</td><td>Beceri öğretimi, kondisyon, oyun/uygulama</td></tr>\n<tr><td><b>Bitiş (soğuma)</b></td><td>Toparlanmayı hızlandırmak, dersi değerlendirmek</td><td>Hafif koşu, germe, geri bildirim ve kısa değerlendirme</td></tr>\n</tbody></table></div>\n<h3>Ölçme ve değerlendirme</h3>\n<div class=\"kutu\"><span class=\"etiket\">Tanım farkı</span>\n<b>Ölçme:</b> Bir niteliğin gözlenip sayı ya da sembolle ifade edilmesi. <em>Yargı içermez.</em> \"Dikey sıçraması 42 cm.\"<br>\n<b>Değerlendirme:</b> Ölçme sonucunun bir <b>ölçütle</b> karşılaştırılıp <b>yargıya</b> varılması. \"42 cm, yaş grubunun üzerinde — başarılı.\"<br>\nDeğerlendirmenin üç öğesi: <b>ölçme sonucu + ölçüt + karar</b>.</div>\n<p><b>Doğrudan ölçme</b>: nitelik doğrudan ölçülür (boy, süre). <b>Dolaylı ölçme</b>: nitelik başka bir göstergeyle ölçülür (bilgi düzeyinin testle ölçülmesi). Ölçüt <b>mutlak</b> (önceden belirlenmiş sabit değer) ya da <b>bağıl</b> (grubun ortalamasına göre) olabilir.</p>\n<h3>Değerlendirme türleri</h3>\n<div class=\"tablo-sar\"><table>\n<thead><tr><th>Tür</th><th>Ne zaman</th><th>Amaç</th></tr></thead>\n<tbody>\n<tr><td><b>Tanıma–yerleştirme</b></td><td>Öğretimden <b>önce</b></td><td>Hazırbulunuşluğu belirlemek, gruplamak</td></tr>\n<tr><td><b>Biçimlendirme–izleme</b></td><td>Öğretim <b>sürerken</b></td><td>Eksikleri anında görüp süreci düzeltmek</td></tr>\n<tr><td><b>Düzey belirleme</b></td><td>Öğretimin <b>sonunda</b></td><td>Ulaşılan düzeye karar vermek, belgelemek</td></tr>\n</tbody></table></div>\n<p>Bir ölçme aracında bulunması gereken nitelikler: <b>geçerlik</b> (ölçmek istediğini ölçmesi), <b>güvenirlik</b> (tutarlı ve kararlı sonuç vermesi) ve <b>kullanışlılık</b> (uygulanabilir, ekonomik olması).</p>\n<h3>Geçerlik</h3>\n<p><b>Geçerlik</b>, bir ölçme aracının <b>ölçmek istediği özelliği, başka özelliklerle karıştırmadan</b> ölçebilme derecesidir. İki noktası vurgulanır: doğru özelliği ölçmek ve <b>araya başka özelliklerin karışmaması</b>.</p>\n<div class=\"kutu\"><span class=\"etiket\">Geçerlik amaca görelidir</span>\nHiçbir araç \"genel olarak geçerli\" değildir; <b>belirli bir amaç ve belirli bir grup için</b> geçerlidir. Yetişkin için geçerli bir test çocuk için geçersiz olabilir. Ayrıca geçerlik var/yok değil, <b>derece</b> meselesidir.</div>\n<div class=\"tablo-sar\"><table>\n<thead><tr><th>Geçerlik türü</th><th>Sorusu</th><th>Örnek</th></tr></thead>\n<tbody>\n<tr><td><b>Kapsam (içerik) geçerliği</b></td><td>Sorular öğretilen konuların tamamını <b>temsil ediyor mu</b>?</td><td>Beş üniteden yalnız birinden soru sorulan sınav; kapsam geçerliği düşüktür</td></tr>\n<tr><td><b>Yapı geçerliği</b></td><td>Araç, iddia ettiği <b>kuramsal özelliği</b> gerçekten ölçüyor mu?</td><td>\"Kaygı ölçeği\"nin gerçekten kaygıyı mı yoksa yorgunluğu mu ölçtüğü</td></tr>\n<tr><td><b>Ölçüt geçerliği</b></td><td>Sonuçlar <b>dış bir ölçütle</b> uyuşuyor mu?</td><td>İkiye ayrılır: <b>yordama</b> (gelecekteki başarıyı kestirme) ve <b>uygunluk</b> (kabul görmüş bir ölçümle eş zamanlı uyuşma)</td></tr>\n<tr><td><b>Görünüş geçerliği</b></td><td>Araç, ölçtüğü şeyi ölçüyormuş gibi <b>görünüyor mu</b>?</td><td>En zayıf tür; yalnızca izlenimdir, gerçek kanıt değildir</td></tr>\n</tbody></table></div>\n<div class=\"karistirma\"><span class=\"etiket\">Geçerlik ve güvenirlik ilişkisi</span>\n<b>Güvenirlik geçerliğin ön koşuludur ama tek başına yetmez.</b><br>\nBir araç <b>güvenilir olup geçersiz olabilir</b>: her seferinde aynı yanlış şeyi tutarlı biçimde ölçer. Ayarı bozuk ama hep aynı değeri veren tartı gibi.<br>\nAma bir araç <b>güvenilir değilse geçerli de olamaz</b>: tutarsız ölçen bir araç doğru şeyi ölçtüğünü iddia edemez.<br>\nKısaca: <b>geçerlik ⇒ güvenirlik</b>, ama <b>güvenirlik ⇏ geçerlik</b>.</div>\n<div class=\"kutu\"><span class=\"etiket\">Geçerliği düşüren etkenler</span>\nSoruların hedef davranışı ölçmemesi; ağdalı ve belirsiz dil (konu bilgisi yerine <b>okuduğunu anlamayı</b> ölçmeye başlar); soruların çok kolay ya da çok zor olması; sürenin yetersizliği; puanlamada öznellik; uygunsuz uygulama koşulları ve kopya.<br>\nSporda örnek: aerobik dayanıklılığı <b>30 m sürat testiyle</b> ölçmek geçersizdir — test dayanıklılığı değil sürati ölçer. Beceriyi <b>yazılı sınavla</b> ölçmek de geçersizdir; beceri devinişsel alandadır.</div>\n<div class=\"kutu\"><span class=\"etiket\">Hedef alanları (Bloom)</span>\n<b>Bilişsel:</b> bilgi ve zihinsel beceriler — kuralı bilmek. <b>Duyuşsal:</b> ilgi, tutum, değer — spora karşı olumlu tutum. <b>Psikomotor (devinişsel):</b> beceri ve hareket — hareketi yapabilmek. Antrenörlük üçünü birden hedefler.</div> <h3>Ölçmede hata, hata kaynakları ve türleri</h3>\n<p><b>Hatasız ölçme yoktur.</b> Ölçme sonucuna istenmeyen değişkenlerin karışmasına <b>hata</b> denir. Hata kaynakları üçtür: <b>ölçme aracından</b> (bozuk araç, kötü yazılmış sorular), <b>ölçmeciden</b> (puanlayıcının öznelliği ve yanlılığı) ve <b>ölçülen bireyden ya da ortamdan</b> (yorgunluk, kaygı, gürültü, şans).</p>\n<div class=\"tablo-sar\"><table>\n<thead><tr><th>Hata türü</th><th>Nasıl davranır</th><th>Örnek</th></tr></thead>\n<tbody>\n<tr><td><b>Sabit hata</b></td><td>Her ölçümde <b>herkese aynı miktarda</b> karışır; yönü ve büyüklüğü değişmez</td><td>Sürekli 2 kg fazla tartan terazi — herkes 2 kg ağır çıkar</td></tr>\n<tr><td><b>Sistematik hata</b></td><td>Kişiye, gruba ya da duruma göre <b>değişir ama düzenlidir</b>; ortada bir yanlılık vardır</td><td>Puanlayıcının kendi kulübünden sporculara sürekli daha yüksek puan vermesi</td></tr>\n<tr><td><b>Tesadüfi (rastgele) hata</b></td><td>Kaynağı belirsizdir; her ölçümde <b>farklı yönde ve miktarda</b> karışır, öngörülemez</td><td>Sporcunun o günkü yorgunluğu, dikkat dağınıklığı, salondaki gürültü</td></tr>\n</tbody></table></div>\n<div class=\"karistirma\"><span class=\"etiket\">Hangi hata neyi bozar?</span>\n<b>Tesadüfi hata güvenirliği düşürür</b> — sonuçlar tutarsızlaşır, aynı ölçüm tekrarlandığında başka değer çıkar.<br>\n<b>Sabit ve sistematik hata güvenirliği bozmaz, geçerliği bozar</b> — ölçüm tutarlıdır ama sürekli yanlış yerdedir. Bozuk terazi her seferinde aynı yanlışı verir: güvenilir ama geçersiz.<br>\nTesadüfi hatalar çok sayıda ölçümde birbirini götürür; sabit ve sistematik hatalar götürmez, birikir.</div>\n<h3>Sporda gözleme dayalı ölçme araçları</h3>\n<p>Beceri ve performans yazılı sınavla ölçülemez; <b>gözlenerek</b> ölçülür. Gözlemi öznellikten kurtarmak için önceden hazırlanmış araçlar kullanılır.</p>\n<div class=\"tablo-sar\"><table>\n<thead><tr><th>Araç</th><th>Nasıl çalışır</th><th>Güçlü / zayıf yönü</th></tr></thead>\n<tbody>\n<tr><td><b>Kontrol listesi</b></td><td>Her ölçüt için <b>var/yok</b>, <b>yaptı/yapmadı</b> biçiminde iki seçenekli işaretleme</td><td>Hızlı ve kolaydır; ancak <b>düzey hakkında bilgi vermez</b> — yaptı ama ne kadar iyi yaptı, söylemez</td></tr>\n<tr><td><b>Rubrik</b><br><em>(dereceli puanlama anahtarı)</em></td><td>Ölçütler, performans düzeyleri ve her düzeyin <b>tanımı</b> birlikte verilir</td><td>Puanlamayı nesnelleştirir, sporcuya ölçütü önceden bildirir, geri bildirim sağlar; hazırlaması zaman alır</td></tr>\n</tbody></table></div>\n<div class=\"kutu\"><span class=\"etiket\">Rubriğin iki türü</span>\n<b>Bütüncül (holistik) rubrik:</b> Performansa <b>bir bütün olarak tek puan</b> verilir. Hızlıdır, genel izlenim sunar; ama sporcunun tam olarak nerede eksik kaldığını göstermez. Çok sayıda sporcunun hızla değerlendirilmesi gerektiğinde uygundur.<br>\n<b>Analitik rubrik:</b> Performans <b>ölçütlere ayrılır</b>, her ölçüt ayrı puanlanır, sonra birleştirilir. Ayrıntılı geri bildirim verir ve eksiğin yerini gösterir; buna karşılık daha çok zaman alır. Süreç içinde gelişimi izlemek için uygundur.</div>\n<p>Farkı tek cümleyle: <b>kontrol listesi davranışın olup olmadığını, rubrik ne düzeyde olduğunu</b> söyler.</p>"},{"ad":"Antrenörlük Mesleği ve Spora Katılım","ozet":"\n<h3>Antrenörlük odakları</h3>\n<p>Antrenör neyi hedefler? Yalnızca dereceyi değil. Etkili antrenörlükte sporcuda geliştirilmesi hedeflenen <b>dört kazanım</b> vardır ve antrenörün başarısı bu dördüyle birlikte ölçülür.</p>\n<div class=\"tablo-sar\"><table>\n<thead><tr><th>Odak</th><th>Ne demek</th><th>Antrenmanda karşılığı</th></tr></thead>\n<tbody>\n<tr><td><b>Yetkinlik</b></td><td>Spora özgü teknik, taktik ve fiziksel becerilerin gelişmesi; sağlıklı yaşam alışkanlığı</td><td>Beceri öğretimi, kondisyon, beslenme ve dinlenme düzeni</td></tr>\n<tr><td><b>Özgüven</b></td><td>Sporcunun kendine ve becerisine olan olumlu inancı</td><td>Başarılabilir hedefler, başarının övgüyle karşılanması</td></tr>\n<tr><td><b>Bağ</b></td><td>Antrenör, takım arkadaşları, aile ve çevreyle kurulan olumlu ilişkiler</td><td>Takım içi iletişim, aileyle işbirliği, kapsayıcı ortam</td></tr>\n<tr><td><b>Karakter</b></td><td>Saygı, dürüstlük, sorumluluk ve empati; kurala ve rakibe saygı</td><td>Kurala uymanın modellenmesi, sportmenliğin ödüllendirilmesi</td></tr>\n</tbody></table></div>\n<div class=\"karistirma\"><span class=\"etiket\">Bağlantı</span>\nBu dört odak birbirinden bağımsız değildir. <b>Yetkinlik</b> arttıkça <b>özgüven</b> beslenir; <b>bağ</b> güçlü olduğunda sporcu spora tutunur; <b>karakter</b> ise sporun bireye kalıcı katkısıdır. Yalnız yetkinliğe odaklanan antrenör kısa vadede derece alabilir ama sporcuyu spordan koparabilir.</div>\n<h3>Sporcu gelişim ortamları</h3>\n<p>Antrenörlük her yerde aynı iş değildir. Sporcunun bulunduğu ortam, antrenörün önceliğini de değiştirir.</p>\n<div class=\"tablo-sar\"><table>\n<thead><tr><th>Ortam</th><th>Amaç</th><th>Antrenörün önceliği</th></tr></thead>\n<tbody>\n<tr><td><b>Katılım sporu ortamı</b></td><td>Eğlence, sağlık, sosyalleşme ve <b>katılımın sürmesi</b></td><td>Herkesin oynaması, olumlu tutum, hareket sevgisi. Eleme ve kıyas yoktur</td></tr>\n<tr><td><b>Performans sporu ortamı</b></td><td>Yarışmada başarı</td><td>Sistemli yüklenme, teknik–taktik gelişim, yarışmaya hazırlık</td></tr>\n</tbody></table></div>\n<p>Katılım ortamında öncelik katılımın sürmesi, performans ortamında ise yarışmaya hazırlıktır. Antrenörün önceliği bulunduğu ortama göre belirlenir.</p>\n<h3>Antrenörlük felsefesi</h3>\n<p><b>Antrenörlük felsefesi</b>, antrenörün <em>neden</em> ve <em>nasıl</em> antrenörlük yaptığına ilişkin temel inanç ve değerler bütünüdür. Soyut bir söylem değildir; zor anlarda verilen kararları belirler.</p>\n<div class=\"kutu\"><span class=\"etiket\">Felsefe kendini nerede gösterir?</span>\nSakat sporcuyu kritik maçta oynatır mısın? Az yetenekli sporcuya oynama süresi verir misin? Hakem hatası senin lehine olduğunda ne yaparsın? Kazanmak için kural sınırında oynar mısın?<br>\nBu soruların yanıtı taktikte değil, <b>felsefede</b> yatar. Felsefesi belirsiz antrenör her durumda farklı davranır; sporcu da neye göre değerlendirildiğini bilemez.</div>\n<p>İki uç yaklaşım vardır: <b>kazanma merkezli</b> felsefe önceliği dereceye verir; <b>sporcu merkezli</b> felsefe önceliği sporcunun bütünsel gelişimine, sağlığına ve spora bağlı kalmasına verir. Çağdaş antrenörlük anlayışı sporcu merkezlidir — kazanmak bu gelişimin sonucudur, amacı değil.</p>\n<p>Sağlam bir felsefenin üç özelliği vardır: <b>açık</b> olmalı (antrenörün kendisi tarafından bilinçle tanımlanmış), <b>tutarlı</b> olmalı (her durumda aynı ilkelerle davranılmalı) ve <b>paylaşılmış</b> olmalı (sporcu ve aile bunu bilmeli). Felsefe geliştirmek <b>öz farkındalıkla</b>, yani antrenörün kendi değerlerini gözden geçirmesiyle başlar.</p> <p>Antrenör yalnız teknik öğreten kişi değildir. Aynı anda <b>öğretici, eğitici, model, lider, yönetici, güdüleyici ve iletişimcidir</b>. Sporcunun yaşamındaki en etkili yetişkinlerden biri olması, bu rollerin toplamından gelir.</p>\n<h3>Antrenörlük stilleri</h3>\n<p>Antrenörlük stili, <b>kararların kimde olduğunu</b> ve antrenörün sporcuyla nasıl bir ilişki kurduğunu belirler. Üç stil ayrılır.</p>\n<div class=\"tablo-sar\"><table>\n<thead><tr><th>Stil</th><th>Nasıl işler</th><th>Güçlü ve zayıf yönü</th></tr></thead>\n<tbody>\n<tr><td><b>Otokratik</b></td><td>Tüm kararlar antrenöre aittir; sporcuya yalnızca uygulama rolü kalır</td><td>Hızlı düzen ve disiplin sağlar; sporcuda sorumluluk, özgüven ve karar verme gelişmez</td></tr>\n<tr><td><b>Demokratik</b></td><td>Sporcu karar süreçlerine katılır; antrenör görüş alır ve birlikte karar verir</td><td>İçsel güdülenmeyi ve bağlılığı artırır; buna karşılık zaman ister</td></tr>\n<tr><td><b>Bütünsel (holistik)</b></td><td>Antrenör doğrudan yönlendirmeyi bırakır; <b>ortamı kurar</b> ve sorumluluğu sporcuya devreder. Sporcuyu yalnız performansıyla değil <b>bütün bir birey olarak</b> ele alır</td><td>Olgun ve sorumluluk almaya hazır sporcuda özerklik ve öz düzenleme geliştirir; hazır olmayan sporcuda yapı kaybolabilir</td></tr>\n</tbody></table></div>\n<div class=\"karistirma\"><span class=\"etiket\">Üçünü ayırt et</span>\nAyrım <b>kararın kimde olduğuna</b> göredir: <b>otokratikte</b> karar tamamen antrenörde, <b>demokratikte</b> paylaşılır, <b>bütünselde</b> büyük ölçüde sporcuya devredilir.<br>\nHiçbiri her durumda en iyi değildir. Güvenlik gerektiren anlarda ve yeni başlayanlarda otokratik yön verme gerekir; deneyimli sporcuda bütünsel yaklaşım özerkliği besler. <b>Antrenörün işi duruma uygun stili seçebilmektir.</b></div>\n<div class=\"kutu\"><span class=\"etiket\">Sporcu merkezli antrenörlük</span>\nÇağdaş antrenörlük anlayışı <b>kazanma merkezli</b> değil <b>sporcu merkezlidir</b>: öncelik sporcunun bütünsel gelişimi, sağlığı ve sporda kalmasıdır. Kazanmak bu gelişimin sonucudur, amacı değil. Çocuk sporunda başarı ölçütü <b>derece değil katılımın sürmesidir</b>.</div>\n<h3>Spora katılım ve sosyalleşme</h3>\n<p>Bireyin spora nasıl başladığını, neden sürdürdüğünü ve neden bıraktığını inceleyen alan <b>sporda sosyalleşme</b>dir. Üç boyutu vardır:</p>\n<ul>\n<li><b>Spora sosyalleşme (spora katılım):</b> Birey spora nasıl ve kimin etkisiyle başlar.</li>\n<li><b>Spor yoluyla sosyalleşme:</b> Sporun bireye kazandırdıkları — kurala uyma, işbirliği, öz denetim, kimlik.</li>\n<li><b>Spordan ayrılma (bırakma):</b> Bireyin spordan kopması ve nedenleri.</li>\n</ul>\n<p>Spora katılımı belirleyen üç etken kümesi: <b>bireyin kendi özellikleri</b> (yetenek, ilgi, sağlık), <b>önemli diğerleri</b> (aile, arkadaşlar, öğretmen, antrenör, medya) ve <b>olanaklar</b> (tesis, ekonomik durum, ulaşım, kültürel kabul). Çocukta ilk ve en güçlü etken <b>ailedir</b>.</p>\n<div class=\"kutu\"><span class=\"etiket\">Spordan kopmanın başlıca nedenleri</span>\nEğlencenin bitmesi, aşırı baskı ve kazanma zorlaması, <b>erken uzmanlaşma</b>, tekrarlayan sakatlıklar, tükenmişlik, antrenörle ilişki sorunları, oynama süresi bulamama ve başarısızlık duygusu. Bunların çoğu antrenörün kontrolündedir.</div>\n<h3>Özgüven kazanma</h3>\n<p>Özgüven, sporcunun \"ben yapabilirim\" inancıdır ve kendiliğinden oluşmaz; antrenörün kurduğu ortamda gelişir. Antrenörlük odaklarından biridir.</p>\n<div class=\"kutu\"><span class=\"etiket\">Özgüvenin dört kaynağı</span>\n<b>1. Başarı deneyimi</b> — sporcunun kendi başardığı işler. En güçlü kaynak budur.<br>\n<b>2. Başkalarının deneyimi</b> — kendine benzeyen birinin başardığını görmek.<br>\n<b>3. Sözel ikna</b> — <b>başarının övgüyle karşılanması</b>, antrenörün inancını sözle ifade etmesi.<br>\n<b>4. Duygusal durum</b> — kaygının düşük, keyfin yüksek olması.</div>\n<div class=\"karistirma\"><span class=\"etiket\">Ayırt etme</span>\n\"Özgüven kazanma aşaması neyi içerir?\" diye sorulduğunda cevap <b>başarının övgüyle karşılanmasıdır</b>. <b>Rekabetçi deneyimler</b> sonraki aşamaların işidir — özgüveni oturmamış sporcuyu rekabete sokmak özgüveni kazandırmaz, kırar. <b>Ekip ruhu beklentisi</b> sosyal gelişimin, <b>tesis güvenliği</b> ise işletmenin konusudur.</div>\n<p>Antrenör açısından pratik karşılığı: övgü <b>sonuca değil çabaya ve gelişime</b> yöneltilmelidir. \"Kazandın\" değil \"bu hafta dizini çok daha iyi kullandın\" demek, sporcunun kendi denetimindeki şeyi pekiştirir ve özgüveni yenilgide de ayakta tutar.</p>\n<h3>Antrenörlük mesleğinin gelişimi</h3>\n<p>Antrenörlük deneyime dayalı bir uğraş olmaktan çıkıp bilimsel temelli, eğitim ve belge gerektiren bir alana dönüşmüştür. Bu dönüşüm <b>profesyonelleşme</b> olarak adlandırılır. Türkiye'de antrenörlük kademeli bir sistemdir; her kademe hem <b>temel eğitim</b> hem de <b>branş eğitimini</b> içerir ve antrenörün öğrenmesi belge alındığında bitmez — sürekli mesleki gelişim antrenörlüğün parçasıdır.</p>\n"},{"ad":"Spora Katılım ve Gelişim Modelleri","ozet":"\n<h3>Gelişim modellerinin sınıflaması</h3>\n<p>Sporcu gelişimini açıklayan modeller, <b>neyi tarif ettiklerine göre</b> ayrılır. İkisi de aynı sporcuyu anlatır ama farklı sorulara yanıt verir.</p>\n<div class=\"tablo-sar\"><table>\n<thead><tr><th>Model</th><th>Neyi tarif eder</th><th>Sorusu</th></tr></thead>\n<tbody>\n<tr><td><b>Spora Katılımın Gelişimsel Modeli</b></td><td>Bireyin spora <b>katılım yolunu</b>: nasıl başladığı, nasıl sürdürdüğü, hangi aşamalardan geçtiği</td><td>Sporcu bu yola nasıl girdi ve nasıl ilerliyor?</td></tr>\n<tr><td><b>Uzun Süreli Sporcu Gelişim Modeli (LTAD)</b></td><td>Sporcunun <b>antrenman aşamalarını</b>: hangi yaşta neyin çalışılacağını</td><td>Bu sporcuya şimdi ne çalıştırmalıyım?</td></tr>\n</tbody></table></div>\n<div class=\"karistirma\"><span class=\"etiket\">Ayrımın özü</span>\n<b>Katılım modeli</b> sporcunun <em>yolculuğunu</em> anlatır — başlama, sürdürme, bırakma.<br>\n<b>LTAD</b> antrenörün <em>programını</em> anlatır — hangi aşamada hangi özelliğin geliştirileceğini.<br>\nBiri sporcuya, diğeri antrenmana bakar. Bir soruda \"katılım\" ve \"sosyalleşme\" geçiyorsa katılım modeli; \"aşama, pencere, yüklenme\" geçiyorsa LTAD kastediliyordur.</div>\n<p>Ortak noktaları da vardır: ikisi de gelişimi <b>yaşam boyu</b> ele alır, ikisi de <b>erken uzmanlaşmaya</b> karşı uyarır ve ikisi de kısa vadeli dereceyi değil <b>uzun vadeli gelişimi</b> önceler.</p> <p>Balyi'nin geliştirdiği bu model, sporcunun tek bir sezona değil <b>tüm yaşamına</b> yayılan gelişimini aşamalandırır. Temel mantığı şudur: her aşamanın kendi önceliği vardır; bir aşamanın işi ne ertelenebilir ne de öne çekilebilir.</p>\n<div class=\"tablo-sar\"><table>\n<thead><tr><th>#</th><th>Aşama</th><th>Yaklaşık dönem</th><th>Bu aşamanın işi</th></tr></thead>\n<tbody>\n<tr><td>1</td><td><b>Aktif başlangıç</b></td><td>0–6 yaş</td><td>Hareketi sevdirmek, günlük fiziksel etkinlik alışkanlığı. Performans kaygısı yok</td></tr>\n<tr><td>2</td><td><b>Temeller</b><br><em>(eğlenceli temeller)</em></td><td>K 6–8 / E 6–9</td><td>Temel hareket becerileri: koşma, atlama, atma, yakalama. Oyun ağırlıklı, ölçme yok</td></tr>\n<tr><td>3</td><td><b>Öğrenmeyi öğrenme</b><br><em>(antrenman yapmayı öğrenme)</em></td><td>K 8–11 / E 9–12</td><td>Genel spor becerileri, birden çok branş denemesi. Beceri öğrenimi için en verimli dönem</td></tr>\n<tr><td>4</td><td><b>Antrenman için antrenman</b></td><td>K 11–15 / E 12–16</td><td><b>Fizyolojik adaptasyon:</b> aerobik kapasite, kuvvet ve dayanıklılığın sistemli yüklenmeyle geliştirilmesi. Sporcunun motoru burada kurulur</td></tr>\n<tr><td>5</td><td><b>Yarışmak için antrenman</b><br><em>(performans geliştirme aşaması)</em></td><td>K 15–19 / E 16–20</td><td>Branşa özelleşme ve yarışma deneyimi. <b>Oyun ve taktik stratejileri bu aşamada geliştirilir</b></td></tr>\n<tr><td>6</td><td><b>Kazanmak için antrenman</b></td><td>Erken yetişkinlik</td><td>Elit performans: teknik detayların mükemmelleştirilmesi, taktik incelik, yarışma yönetimi</td></tr>\n<tr><td>7</td><td><b>Aktif yaşam</b></td><td>Her yaş</td><td>Yarışmayı bıraktıktan sonra da spora bağlı kalmak. Modelin nihai hedefi</td></tr>\n</tbody></table></div>\n<div class=\"kutu\"><span class=\"etiket\">Adlandırma</span>\nKaynak kitapçıkta 5. aşama (<b>yarışmak için antrenman</b>) <b>performans geliştirme aşaması</b> adıyla geçer ve bu aşamanın işi <b>oyun ve taktik stratejilerinin geliştirilmesidir</b>.<br>\nKarıştırma: <b>fizyolojik adaptasyon</b> bir önceki aşamanın (antrenman için antrenman), <b>teknik detayların mükemmelleştirilmesi</b> ise bir sonraki aşamanın (kazanmak için antrenman) işidir.</div>\n<p>İlk üç aşama birlikte <b>fiziksel okuryazarlık</b> bloğunu oluşturur.</p>\n<div class=\"karistirma\"><span class=\"etiket\">Aşamaları ayırt etmenin anahtarı</span>\nSoru \"hangi aşama\" diye sorduğunda <b>o aşamaya özgü</b> olanı ara. <b>Motivasyon</b> ve <b>yaralanma önleme</b> her aşamada geçerlidir, bu yüzden hiçbir aşamayı ayırt etmez — klasik çeldiricidir. Ayırt edici işaretler şunlardır: <b>fizyolojik adaptasyon</b> → antrenman için antrenman; <b>oyun ve taktik stratejileri</b> → performans geliştirme (yarışmak için antrenman); <b>teknik detayların mükemmelleştirilmesi</b> → kazanmak için antrenman.</div> <h3>Spora Katılımın Gelişimsel Modeli</h3>\n<p>Bu model, bireyin spora katılım <b>yolculuğunu</b> tarif eder. Temelinde <b>örneklem (katılım) yılları</b> vardır; bu dönemden sonra birey üç farklı yoldan birine girer.</p>\n<div class=\"tablo-sar\"><table>\n<thead><tr><th>Bileşen</th><th>Ne olur</th><th>Sonuç</th></tr></thead>\n<tbody>\n<tr><td><b>Örneklem (katılım) yılları</b></td><td>Çocuk <b>birçok farklı spor dalını dener</b>; çalışma oyun ağırlıklı ve eğlence odaklıdır, erken uzmanlaşma yoktur</td><td>Geniş hareket dağarcığı; üç yolun da çıkış noktası</td></tr>\n<tr><td><b>Rekreasyonel gelişim</b></td><td>Birey spora <b>eğlence, sağlık ve sosyalleşme</b> için devam eder; yarışma önceliği yoktur</td><td>Yaşam boyu katılım</td></tr>\n<tr><td><b>Elit sporcu gelişimi</b></td><td>Örneklem yıllarının ardından birey bir branşta <b>özelleşir</b> ve antrenmana yatırımı artar</td><td>Geç uzmanlaşma yoluyla elit düzey</td></tr>\n<tr><td><b>Erken uzmanlaşma</b></td><td>Örneklem yılları <b>atlanır</b>, erken yaşta tek branşa yoğunlaşılır</td><td>Bazı branşlarda gerekli, ancak sakatlık, tükenmişlik ve erken kopma riski yüksek</td></tr>\n</tbody></table></div>\n<div class=\"karistirma\"><span class=\"etiket\">Modelin ana mesajı</span>\nElit düzeye <b>iki ayrı yoldan</b> ulaşılabilir: örneklem yıllarından geçerek (geç uzmanlaşma) ya da erken uzmanlaşarak. Model, sporların büyük çoğunluğunda <b>örneklem yollu gelişimin</b> daha sağlıklı olduğunu; erken uzmanlaşmanın ise yalnız sınırlı sayıda branş için uygun ve riskli olduğunu söyler.<br>\nAyrıca <b>rekreasyonel gelişim bir başarısızlık değildir</b>; modelin geçerli üç sonucundan biridir.</div>\n<h3>LTAD modelinin dayandığı kavramlar</h3>\n<div class=\"tablo-sar\"><table>\n<thead><tr><th>Kavram</th><th>Ne demek</th></tr></thead>\n<tbody>\n<tr><td><b>Fiziksel okuryazarlık</b></td><td>Temel hareket ve temel spor becerilerinin birlikte kazanılmış olması. Nasıl okuma yazma bilmeden kitap okunamazsa, fiziksel okuryazarlık olmadan da spor yapılamaz. İlk üç aşamanın hedefi budur</td></tr>\n<tr><td><b>Kronolojik yaş</b></td><td>Doğum tarihine göre yaş. Gelişim düzeyini göstermez</td></tr>\n<tr><td><b>Biyolojik yaş</b></td><td>Bedenin gerçek olgunlaşma düzeyi. Aynı sınıftaki iki çocuk arasında 4–5 yıl fark olabilir. <b>Antrenman biyolojik yaşa göre planlanır</b></td></tr>\n<tr><td><b>Antrenman yaşı</b></td><td>Sporcunun kaç yıldır sistemli antrenman yaptığı. 25 yaşında ama 1 yıllık antrenman yaşı olan sporcu başlangıç düzeyindedir</td></tr>\n<tr><td><b>PHV</b> (en hızlı boy uzama dönemi)</td><td>Ergenlikteki en hızlı boy uzama anı; kızlarda yaklaşık 12, erkeklerde 14 yaş civarı. Modelde antrenman pencerelerinin zamanlaması bu ana göre ayarlanır</td></tr>\n<tr><td><b>Duyarlı (kritik) pencereler</b></td><td>Bir motorik özelliğin antrenmana en çok yanıt verdiği dönemler. Kaçırıldığında o özellik yine gelişir ama aynı düzeye ulaşmaz</td></tr>\n</tbody></table></div>\n<div class=\"kutu\"><span class=\"etiket\">Pencerelerin sırası</span>\n<b>Beceri</b> penceresi çocuklukta, PHV'den <b>önce</b> açılır.<br>\n<b>Dayanıklılık (aerobik)</b> penceresi PHV'nin <b>başladığı</b> dönemde açılır.<br>\n<b>Kuvvet</b> penceresi PHV'den <b>sonra</b> açılır; kızlarda adet döngüsünün başlamasıyla, erkeklerde PHV'den 12–18 ay sonra.<br>\nSıra şu: önce beceri, sonra dayanıklılık, en son kuvvet.</div>\n<h3>Erken ve geç özelleşen sporlar</h3>\n<div class=\"tablo-sar\"><table>\n<thead><tr><th></th><th>Erken özelleşen</th><th>Geç özelleşen</th></tr></thead>\n<tbody>\n<tr><td>Örnek</td><td>Artistik jimnastik, artistik buz pateni, dalış, masa tenisi, ritmik jimnastik</td><td>Takım sporları, atletizm, kürek, güreş, yüzme — <b>sporların büyük çoğunluğu</b></td></tr>\n<tr><td>Model</td><td>Aşama sayısı azalır, özelleşme erken başlar</td><td>Yedi aşamanın tamamı uygulanır; özelleşme ergenlik sonrasına bırakılır</td></tr>\n<tr><td>Gerekçe</td><td>Karmaşık beceriler olgunlaşma öncesi kazanılmalı</td><td>Erken özelleşme sakatlık, tükenmişlik ve erken kopma doğurur</td></tr>\n</tbody></table></div>\n<div class=\"kutu\"><span class=\"etiket\">İki sayısal ölçüt</span>\n<b>10 yıl / 10.000 saat kuralı:</b> Elit düzeye ulaşmak için ortalama 10 yıl ve 10.000 saatlik nitelikli antrenman gerekir. Kısa yoldan elit sporcu üretilemez.<br>\n<b>Antrenman–yarışma oranı:</b> Erken aşamalarda ağırlık antrenmandadır (yaklaşık %70–80 antrenman, %20–30 yarışma). Aşama ilerledikçe yarışmanın payı artar.</div>\n"},{"ad":"Koordinasyon ve Koordinatif Yetiler","ozet":"\n<p><b>Koordinatif yetiler doğuştan kazanılan özellikler değildir</b>; doğru öğrenme ile geliştirilir. Gelişimleri <b>biyolojik yaşa</b> bağlıdır. Koordinatif yetilerin gelişimi ve niteliği, hareket becerilerine ve spor dalı tekniklerine ait <b>öğrenme süreçlerinin hızını ve niteliğini</b> etkiler.</p>\n<h3>Koordinasyon sınıflaması</h3>\n<div class=\"tablo-sar\"><table>\n<thead><tr><th>Sınıflama</th><th>Türler</th><th>Açıklama</th></tr></thead>\n<tbody>\n<tr><td><b>1. Genel ve özel koordinasyon</b></td><td>Genel / Özel</td><td><b>Genel:</b> Hareket becerilerinin bütününün gelişmesini kapsar (denge, reaksiyon zamanı, hareket sürati). Özel koordinasyonun temelini oluşturur.<br><b>Özel:</b> Spor dalına göre geliştirilen, yapılan spor türünün hazırlığı niteliğindedir.</td></tr>\n<tr><td><b>2. Beceri türüne göre</b></td><td>Kapalı beceri / Açık beceri koordinasyonu</td><td><b>Kapalı:</b> Sabit bir motor programa dayalı teknik özellikli beceriler (bir stilde yüzme, bisiklete binme, halterde ağırlık kaldırma).<br><b>Açık:</b> Uyum gerektiren motor programa dayalı beceriler; oyun sporlarında ve taktik davranışlarda etkindir.</td></tr>\n<tr><td><b>3. Kas grubuna göre</b></td><td>Kaba / İnce koordinasyon</td><td><b>Kaba:</b> Büyük kas gruplarınca gerçekleştirilir.<br><b>İnce:</b> Küçük kasların çalışmasıyla ortaya çıkar.</td></tr>\n</tbody></table></div>\n<h3>Koordinasyonun özellikleri</h3>\n<p>Zatzyorski'ye göre koordinasyonun üç temel özelliği vardır:</p>\n<ul>\n<li><b>Zorluk derecesi:</b> Hareket kolay ya da zor olabilir. Ritimli beceriler daha az karmaşıktır ve daha kolay öğrenilir.</li>\n<li><b>Hareketin doğruluğu:</b> Hareket zaman, açı ve akış içinde uygun yapıldığında yüksek doğrulukla gerçekleşir; beceri biyomekanik ve fizyolojik olarak etkin ve ekonomik olur.</li>\n<li><b>Kazanılma süresi:</b> Becerinin karmaşıklığı, istenen düzeyde uygulanabilmesi için gereken süreyi belirler.</li>\n</ul>\n<h3>Koordinasyonu etkileyen faktörler</h3>\n<ul>\n<li><b>Düşünme (sporsal zekâ):</b> Esnek ve çabuk düşünme, ayrımlaştırma, toplanan bilginin seçilmesi işlemi.</li>\n<li><b>Duyusal organların incelik ve sürekliliği:</b> Düzenli antrenman hareket alıcılarını iyileştirir.</li>\n<li><b>Motor deneyim:</b> Koordinasyon yeteneğinde belirleyici etmendir; yetkin koordinasyon deneyimle sağlanır.</li>\n<li><b>Diğer motorik becerilerin gelişim düzeyi:</b> Sürat, kuvvet, dayanıklılık veya esneklikteki yetersiz gelişim koordinasyonu sınırlar.</li>\n<li><b>Çözümleme yeteneği:</b> Hareketin hangi duyu organıyla algılanıp oluşturulacağıdır.</li>\n</ul>\n<div class=\"kutu\"><span class=\"etiket\">Algılama türleri</span>\n<b>Kinestetik algılama:</b> Alıcılar kas kirişlerinde bulunur, ekstremitelerin durumu hakkında bilgi verir.<br>\n<b>Dokunarak algılama:</b> Derideki alıcılar şekil ve madde yüzeyi hakkında bilgi verir.<br>\n<b>Görerek algılama:</b> Yakınlık–uzaklık tahmininde ve yeni hareketlerin izlenmesinde rol oynar.<br>\n<b>Duyarak algılama:</b> Hareketin başlangıcı, bitişi ve süresi hakkında bilgi verir (futbolcunun düdük sesini algılaması).</div>\n<h3>Beş koordinatif yeti</h3>\n<p>Hirtz'e göre koordinatif yetiler beş temel yeti hâlinde sınıflandırılır: <b>tepki, oryantasyon (mekân uyumu), denge, ritim ve kinestetik ayrımlama</b>.</p>\n<div class=\"tablo-sar\"><table>\n<thead><tr><th>Yeti</th><th>Tanım</th><th>Gelişim yaşı</th></tr></thead>\n<tbody>\n<tr><td><b>Kinestetik ayrımlama</b></td><td>Kas ve kirişlerden gelen kinestetik bilgiler yolu ile hareketlerdeki hassas farklılaşmalardır. Genel anlamda bir hareketi en ekonomik ve en iyi biçimde yapabilmedir</td><td><b>8–10 yaş</b> arasında hızlı gelişir, <b>13 yaşa</b> kadar devam eder</td></tr>\n<tr><td><b>Denge</b></td><td>Vücudu dengede tutma ve bunu devam ettirme özelliğidir. Dengenin değişen çevre şartlarında korunması veya yeniden sağlanmasıdır</td><td><b>6–15 yaş</b>; en hızlı <b>10–12 yaş</b></td></tr>\n<tr><td><b>Oryantasyon (mekân uyumu)</b></td><td>Hareketin boyutunu kavramadır: hareketlerin <b>en, boy ve yükseklik</b> boyutunu kavrama. İşitsel ve görsel uyaranlarla beslenir</td><td><b>6–15 yaş</b>; en yoğun <b>7–9 yaş</b></td></tr>\n<tr><td><b>Ritim</b></td><td>Hareketin mekân boyutu içinde akıcı ve dinamik değişimlere göre hareket edebilme özelliğidir. <b>\"Zamanın farkında\" olma</b> yetisidir; işitsel ve görsel algılama beraberdir</td><td><b>6–15 yaş</b>; en hızlı <b>8–9 yaş</b></td></tr>\n<tr><td><b>Tepki (reaksiyon)</b></td><td>Bir veya birden fazla uyarıya karşı çabuk ve uygun bir şekilde harekete başlamaktır</td><td><b>7–18 yaş</b>; en hızlı <b>7–10 yaş</b></td></tr>\n</tbody></table></div>\n<div class=\"kutu\"><span class=\"etiket\">Denge yetisinin üç biçimi</span>\n<b>Statik denge:</b> Vücudun dengesinin belli bir yerde ya da pozisyonda sağlanmasıdır.<br>\n<b>Dinamik denge:</b> Hareket ederken dengenin sağlanmasıdır.<br>\n<b>Objeyle dengeleme:</b> Bir araçla hareket yaparken ya da ek bir araç kullanırken dengenin sağlanmasıdır.</div>\n<div class=\"kutu\"><span class=\"etiket\">Tepki yetisinin iki türü</span>\n<b>Basit tepkiler:</b> Yapılacak hareket bilinmektedir — sürat antrenmanında düdükle çıkış yapmak, alkış sesiyle sıçramak.<br>\n<b>Karmaşık tepkiler:</b> Birçok uyarıya karşılık en iyi, en doğru yolu seçme durumudur — rakibe engel olmak, takım arkadaşıyla işbirliği yapmak.</div>\n"},{"ad":"Biyomotor (Kondisyonel) Özellikler","ozet":"\n<p><b>Biyomotor özellikler</b>, sportif performansın fiziksel temelleridir: <b>kuvvet, sürat, dayanıklılık ve hareketlilik</b>. Bunlara çoğu sınıflamada <b>koordinasyon</b> da eklenir. Kondisyonel olanlar enerji üretimine, koordinatif olanlar sinir sisteminin hareketi yönetmesine dayanır — bkz. Koordinatif Özellikler ünitesi.</p>\n<h3>Kuvvet</h3>\n<p>Bir dirence karşı koyabilme ya da onu yenebilme yetisidir. Üç temel türü vardır:</p>\n<div class=\"tablo-sar\"><table>\n<thead><tr><th>Tür</th><th>Ne demek</th><th>Örnek</th></tr></thead>\n<tbody>\n<tr><td><b>Maksimal kuvvet</b></td><td>Kasın üretebildiği en yüksek kuvvet</td><td>Halterde tek tekrarlık maksimum</td></tr>\n<tr><td><b>Çabuk (patlayıcı) kuvvet</b></td><td>Kuvveti <b>kısa sürede</b> ortaya koyabilme — kuvvet ile süratin birleşimi</td><td>Dikey sıçrama, şut, atlama</td></tr>\n<tr><td><b>Kuvvette devamlılık</b></td><td>Kuvveti <b>uzun süre</b> koruyabilme — kuvvet ile dayanıklılığın birleşimi</td><td>Kürek çekmek, uzun süreli mücadele</td></tr>\n</tbody></table></div>\n<p>Kuvvet gelişimi <b>hormonal olgunlaşmaya bağlıdır</b>; bu yüzden asıl gelişim penceresi ergenlik ve sonrasıdır. Çocuklukta kuvvet çalışması kendi vücut ağırlığıyla ve teknik öğretimi ağırlıklı yapılır.</p>\n<h3>Sürat, çabukluk ve çeviklik</h3>\n<div class=\"karistirma\"><span class=\"etiket\">Üçünü ayırt et</span>\n<b>Sürat:</b> Bir mesafeyi en kısa sürede alabilme. Ölçüsü mesafe ve zamandır (100 m koşu).<br>\n<b>Çabukluk:</b> Tek bir hareketi ya da vücut bölümünü en kısa sürede harekete geçirebilme. Mesafe yoktur, <b>tek hareketin hızı</b> vardır (boksörün yumruğu, kalecinin eli).<br>\n<b>Çeviklik:</b> <b>Yön değiştirerek</b> hızlı hareket edebilme. Süratin yanında koordinasyon, denge ve karar verme de gerektirir.</div>\n<p>Süratin dört alt türü sorulur: <b>reaksiyon sürati</b> (uyarana yanıt süresi), <b>ivmelenme (hızlanma) sürati</b> (duruştan hızlanma), <b>maksimal sürat</b> (ulaşılan en yüksek hız) ve <b>süratte devamlılık</b> (yüksek hızı koruyabilme).</p>\n<div class=\"kutu\"><span class=\"etiket\">Çeviklik ile yön değiştirme hızı aynı şey değil</span>\n<b>Yön değiştirme hızı</b> önceden planlanmış bir rotada hızlı dönebilmektir — koni parkurunu ezbere koşmak gibi.<br>\n<b>Çeviklik</b> ise <b>öngörülemeyen</b> bir uyarana göre yön değiştirmektir — rakip sağa kaçınca ona göre dönmek. İçinde algı ve karar verme vardır. Bu yüzden çeviklik yalnız fiziksel değil, aynı zamanda bilişsel bir yetidir.</div>\n<p>Sürat büyük ölçüde <b>sinir sisteminin hızına</b> bağlıdır ve bu yüzden çocuklukta iyi gelişir. Çabukluk ve çeviklik ise kısa mesafeli hızlanmalar, yön değiştirmeler, çeviklik merdiveni ve koni çalışmalarıyla geliştirilir. <b>Yorgunken sürat çalışılmaz</b> — hız düşer, hatalı kalıp yerleşir.</p>\n<h3>Dayanıklılık</h3>\n<p>Yorgunluğa karşı koyabilme ve yüklenmeyi uzun süre sürdürebilme yetisidir.</p>\n<ul>\n<li><b>Aerobik dayanıklılık:</b> Oksijenli ortamda, uzun süreli ve düşük–orta şiddetli yüklenme. Genel dayanıklılığın temelidir.</li>\n<li><b>Anaerobik dayanıklılık:</b> Oksijensiz ortamda, kısa süreli ve yüksek şiddetli yüklenme.</li>\n<li><b>Genel dayanıklılık</b> branştan bağımsızdır; <b>özel dayanıklılık</b> branşın kendi yüklenme yapısına uygundur.</li>\n</ul>\n<h3>Hareketlilik (esneklik)</h3>\n<p>Eklemlerde geniş açılı hareket yapabilme yetisidir. <b>Aktif hareketlilik</b> sporcunun kendi kas gücüyle, <b>pasif hareketlilik</b> dış yardımla (eş, ağırlık) ulaşılan açıdır; pasif her zaman aktiften büyüktür. Germe <b>statik</b> (pozisyonda kalarak) ya da <b>dinamik</b> (kontrollü salınımla) yapılır.</p>\n<div class=\"kutu\"><span class=\"etiket\">Hangi özellik ne zaman?</span>\n<b>Hareketlilik</b> en erken yaşta en yüksektir ve yaşla azalır — korunması için erken başlanır.<br>\n<b>Sürat ve koordinasyon</b> çocuklukta iyi gelişir; sinirsel temellidir.<br>\n<b>Kuvvet</b> ergenlik ve sonrasında gelişir; hormonal temellidir.<br>\n<b>Dayanıklılık</b> her yaşta geliştirilebilir; aerobik temel çocuklukta rahat kurulur.</div>\n"},{"ad":"Antrenörde Profesyonel Bilgi ve İletişim","ozet":"\n<div class=\"kutu\"><span class=\"etiket\">Temel unsurlar</span>\nBir antrenörün <b>profesyonel alan bilgisinin temel unsurları</b> <b>spor psikolojisi ve sporcu iletişimidir</b>.<br>\nKural bilgisi, antrenman tekniği, fizyoloji ve beslenme birer <b>içerik alanıdır</b> — kitaptan öğrenilir ve her antrenörde bulunur. Antrenörü antrenör yapan, bu bilgiyi karşısındaki insana <b>aktarabilmesidir</b>.</div>\n<p>Öğretme süreci iletişim yoluyla yürür; bilginin sporcuya aktarılması iletişim becerisine bağlıdır.</p>\n<h3>İletişim sürecinin öğeleri</h3>\n<div class=\"tablo-sar\"><table>\n<thead><tr><th>Öğe</th><th>Ne demek</th><th>Antrenmanda</th></tr></thead>\n<tbody>\n<tr><td><b>Kaynak (verici)</b></td><td>Mesajı gönderen</td><td>Antrenör</td></tr>\n<tr><td><b>Mesaj</b></td><td>Aktarılmak istenen içerik</td><td>\"Dizini öne al\"</td></tr>\n<tr><td><b>Kanal</b></td><td>Mesajın taşındığı yol</td><td>Ses, gösterim, video, dokunma</td></tr>\n<tr><td><b>Alıcı</b></td><td>Mesajı alan</td><td>Sporcu</td></tr>\n<tr><td><b>Geri bildirim (dönüt)</b></td><td>Alıcının verdiği yanıt</td><td>Sporcunun hareketi düzeltmesi ya da anlamadığını belirtmesi</td></tr>\n<tr><td><b>Ortam (bağlam)</b></td><td>İletişimin geçtiği koşullar</td><td>Gürültülü salon, maç gerilimi</td></tr>\n</tbody></table></div>\n<p>Geri bildirim öğesi olmadan iletişim <b>tek yönlü</b> kalır; antrenör konuşmuş ama iletişim kurulmamış olur. Anlaşılıp anlaşılmadığını sormak iletişimi çift yönlü yapar.</p>\n<h3>Sözlü ve sözsüz iletişim</h3>\n<p>Mesajın büyük bölümü <b>sözsüz</b> taşınır: beden duruşu, yüz ifadesi, göz teması, jest, mesafe ve özellikle <b>ses tonu</b>. Sözle sözsüzün çeliştiği durumda sporcu <b>sözsüz olana</b> inanır — \"sorun yok\" derken yüzünü asan antrenöre kimse inanmaz.</p>\n<div class=\"karistirma\"><span class=\"etiket\">Ben dili / sen dili</span>\n<b>Sen dili</b> suçlar ve savunmaya iter: \"Yine
