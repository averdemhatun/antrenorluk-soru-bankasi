{u:7, s:"Yüzme, koşu ve bisiklet gibi başlangıç ve bitişi keyfî olan, tekrarlı becerilere ne ad verilir?", c:["Ayrık beceri","Seri beceri","Sürekli beceri","Kapalı beceri","İnce motor beceri"], d:2, a:"Sürekli becerilerde hareket döngüsel biçimde yinelenir; nerede biteceğine sporcu karar verir."},
{u:7, s:"Bir jimnastik serisinin ayrık becerilerin art arda dizilmesiyle oluşması onu hangi beceri türüne sokar?", c:["Ayrık beceri","Seri beceri","Sürekli beceri","Açık beceri","Kaba motor beceri"], d:1, a:"Seri beceri, ayrık becerilerin belirli bir sırayla birleştirilmesiyle oluşur; sıralama da becerinin parçasıdır."},
{u:7, s:"Fitts ve Posner'a göre motor öğrenmenin evreleri sırasıyla hangileridir?", c:["Otonom – Bilişsel – Bağlantısal","Bilişsel – Bağlantısal – Otonom","Bağlantısal – Otonom – Bilişsel","Bilişsel – Otonom – Bağlantısal","Temel – Geçiş – Olgun"], d:1, a:"Önce ne yapılacağı anlaşılır (bilişsel), sonra hareket incelenir ve tutarlılık kazanır (bağlantısal), en sonunda otomatikleşir (otonom)."},
{u:7, s:"Motor öğrenmenin bilişsel evresindeki bir sporcunun temel özelliği nedir?", c:["Hareketi düşünmeden yapması","Hatalarının çok ve düzensiz olması, dikkatinin tamamen harekette olması","Çevreyi rahatça izleyebilmesi","İnce ayar yapabilmesi","Performansının tutarlı olması"], d:1, a:"Bilişsel evrede sporcu 'ne yapacağım' sorusuyla uğraşır; hatalar çok ve tutarsızdır. Antrenör bu evrede az sayıda ve net ipucu vermelidir."},
{u:7, s:"Bir sporcunun hareketi otomatik biçimde yaparken aynı anda rakibi ve boş alanı da izleyebilmesi hangi evrenin göstergesidir?", c:["Bilişsel evre","Bağlantısal evre","Otonom evre","Başlangıç evresi","Geçiş evresi"], d:2, a:"Otonom evrede hareket dikkat gerektirmez hâle gelir; boşalan dikkat kapasitesi oyunu okumaya ayrılabilir."},
{u:7, s:"Motor öğrenmenin bağlantısal (çağrışımsal) evresinde antrenörün önceliği ne olmalıdır?", c:["Hareketi ilk kez göstermek","Hataları azaltıp tutarlılığı artıracak ince ayar geri bildirimi vermek","Sporcuyu tamamen serbest bırakmak","Yalnızca yarışma yaptırmak","Beceriyi tamamen değiştirmek"], d:1, a:"Bu evrede sporcu ne yapacağını bilir, 'nasıl daha iyi yaparım' sorusundadır; performans bilgisi türü geri bildirim en verimli burada kullanılır."},
{u:7, s:"Aşağıdakilerden hangisi öğrenmenin gerçekleştiğinin göstergelerinden biri DEĞİLDİR?", c:["Gelişme","Tutarlılık","Kalıcılık","Uyarlanabilirlik","Tek seferlik yüksek performans"], d:4, a:"Bir kez yüksek performans göstermek öğrenmeyi kanıtlamaz; öğrenme gelişme, tutarlılık, kalıcılık ve uyarlanabilirlikle anlaşılır."},
{u:7, s:"Öğrenme sürecinde performansın bir süre ilerlemeyip aynı düzeyde kalmasına ne ad verilir?", c:["Sönme","Plato","Transfer","Regresyon","Uyum"], d:1, a:"Plato, öğrenme eğrisindeki düzlüktür. Öğrenmenin durduğu değil, sporcunun içsel olarak yeniden yapılandığı dönem olarak kabul edilir."},
{u:7, s:"Öğrenilen becerinin farklı koşullarda da kullanılabilmesi hangi göstergedir?", c:["Tutarlılık","Kalıcılık","Uyarlanabilirlik","Gelişme","Hız"], d:2, a:"Uyarlanabilirlik, becerinin antrenman ortamı dışında ve değişen koşullarda da uygulanabilmesidir; gerçek öğrenmenin en güçlü kanıtıdır."},
{u:7, s:"Kaba motor beceri ile ince motor beceriyi ayıran ölçüt nedir?", c:["Becerinin süresi","Kullanılan kas gruplarının büyüklüğü","Çevrenin değişkenliği","Başlangıç ve bitişin belirginliği","Sporcunun yaşı"], d:1, a:"Kaba motor beceriler büyük kas gruplarını (koşma, atlama), ince motor beceriler küçük kas gruplarını (dart atma, ince ayar) kullanır."},
{u:7, s:"Pilates ya da halter gibi, hareketin sporcunun kendi zamanlamasıyla ve durağan çevrede yapıldığı beceriler hangi gruptadır?", c:["Açık beceri","Kapalı beceri","Seri beceri","Manipülatif beceri","Lokomotor beceri"], d:1, a:"Çevre koşulları sabit ve kestirilebilir olduğunda beceri kapalıdır; sporcu hareketi kendisi başlatır ve dış etkene uyum zorunluluğu yoktur."},
{u:7, s:"Motor öğrenmenin tanımı için aşağıdakilerden hangisi doğrudur?", c:["Yorgunluğa bağlı geçici performans değişimidir","Alıştırma ve yaşantı sonucu becerideki nispeten kalıcı gelişmedir","Olgunlaşmayla kendiliğinden oluşan değişimdir","Yalnızca yarışmada gözlenen üstünlüktür","Kalıtımla belirlenen yetenektir"], d:1, a:"Motor öğrenme, alıştırma ve deneyimin ürünüdür ve kalıcıdır; olgunlaşmadan ve geçici performans dalgalanmalarından ayrılır."},
{u:7, s:"Açık becerilerin öğretiminde antrenmanların hangi özelliği taşıması daha uygundur?", c:["Tamamen sabit ve değişmez koşullarda yapılması","Değişen ve kestirilemeyen koşullar içermesi","Yalnızca zihinsel çalışmayla yürütülmesi","Hiç geri bildirim verilmemesi","Yalnızca tek bir tekrar biçimi kullanılması"], d:1, a:"Açık beceri değişken çevrede kullanılacaksa antrenman da değişkenlik içermelidir; sabit koşullarda öğrenilen beceri maça aktarılmakta zorlanır."},
{u:7, s:"Bir sporcunun aynı hareketi her denemede benzer biçimde yapabilmesi hangi öğrenme göstergesidir?", c:["Gelişme","Tutarlılık","Uyarlanabilirlik","Kalıcılık","Transfer"], d:1, a:"Tutarlılık, performanstaki değişkenliğin azalmasıdır ve becerinin oturduğunu gösterir."},

/* ---------- ÜNİTE 8 ---------- */
{u:8, s:"Hareket eğitimi yaklaşımının temel amacı nedir?", c:["Belirli bir spor dalının tekniğini öğretmek","Çocuğun hareket dağarcığını, beden farkındalığını ve özgüvenini geliştirmek","Yetenekli çocukları seçmek","Yarışmaya hazırlamak","Kondisyon geliştirmek"], d:1, a:"Hareket eğitimi çocuk merkezlidir ve amacı belirli bir tekniği öğretmek değil, çocuğun hareket yoluyla bütünsel gelişimini sağlamaktır."},
{u:8, s:"Hareket eğitimiyle ilgili aşağıdakilerden hangisi YANLIŞTIR?", c:["Çocuk merkezlidir","Keşfetme ve problem çözmeye dayanır","Tek doğru hareket biçimi dayatır","Her çocuğun kendi düzeyinde başarı yaşamasını hedefler","Yaratıcılığı geliştirir"], d:2, a:"Hareket eğitiminde tek doğru yoktur; çocuğa problem verilir, o kendi çözümünü üretir. Tek tip doğru dayatmak yaklaşımın özüne aykırıdır."},
{u:8, s:"Laban'ın hareket analizinde 'Ne hareket ediyor?' sorusu hangi boyuta karşılık gelir?", c:["Mekân farkındalığı","Beden farkındalığı","Çaba (efor) farkındalığı","İlişki farkındalığı","Zaman farkındalığı"], d:1, a:"Beden farkındalığı, hangi vücut bölümünün ne yaptığını ve hangi şekilleri alabildiğini kapsar."},
{u:8, s:"'Nerede hareket ediyor?' sorusu hareketin hangi boyutunu tanımlar?", c:["Beden farkındalığı","Mekân (alan) farkındalığı","Çaba farkındalığı","İlişki farkındalığı","Akış"], d:1, a:"Mekân farkındalığı kişisel ve genel alanı, yönü, düzeyi (alçak–orta–yüksek) ve izlenen yolu kapsar."},
{u:8, s:"Hareketin hızlı–yavaş, sert–yumuşak, bağlı–serbest biçiminde incelenmesi hangi boyuttur?", c:["Beden farkındalığı","Mekân farkındalığı","Çaba (efor) farkındalığı","İlişki farkındalığı","Denge"], d:2, a:"Çaba farkındalığı hareketin nasıl yapıldığıyla ilgilenir: zaman, kuvvet ve akış boyutlarını içerir."},
{u:8, s:"Çocuğun eşiyle, grupla ya da araçla kurduğu bağlantı hareketin hangi boyutudur?", c:["Beden farkındalığı","İlişki farkındalığı","Mekân farkındalığı","Çaba farkındalığı","Denge farkındalığı"], d:1, a:"İlişki farkındalığı; kiminle, neyle ve nasıl bir bağ kurularak hareket edildiğini kapsar."},
{u:8, s:"'Topu üç farklı biçimde durdurabilir misin?' yönergesi hangi öğretim anlayışının örneğidir?", c:["Komut stili","Hareket eğitimi / problem çözme yaklaşımı","Blok alıştırma","Sunuş yoluyla öğretim","Ceza uygulaması"], d:1, a:"Tek doğru dayatmadan birden çok çözüm arayan yönergeler hareket eğitiminin ve ıraksayan (problem çözme) stilinin özüdür."},
{u:8, s:"Hareket eğitiminde değerlendirme nasıl yapılır?", c:["Çocuklar birbiriyle kıyaslanarak","Her çocuğun kendi gelişimi esas alınarak","Yalnızca yarışma derecesine göre","Kronometreyle sıralama yapılarak","Değerlendirme yapılmaz"], d:1, a:"Hareket eğitiminde ölçüt bireyseldir: çocuk başkasıyla değil, kendi önceki düzeyiyle karşılaştırılır."},
{u:8, s:"Hareket eğitiminin çocuğun duygusal gelişimine katkısı aşağıdakilerden hangisidir?", c:["Yalnızca kas kuvvetini artırması","Başarı yaşayarak özgüven kazanmasını sağlaması","Rekabeti keskinleştirmesi","Kuralları ezberletmesi","Boy uzamasını hızlandırması"], d:1, a:"Herkesin kendi düzeyinde başarabildiği bir ortam, çocukta yeterlik ve özgüven duygusu oluşturur."},
{u:8, s:"Hareket eğitiminde temel hareket becerilerinin çeşitlendirilmesi neden önemlidir?", c:["Erken uzmanlaşmayı hızlandırdığı için","Geniş hareket dağarcığı ileride her spor dalına olumlu transfer sağladığı için","Yarışma sonuçlarını yükselttiği için","Antrenman süresini kısalttığı için","Ölçmeyi kolaylaştırdığı için"], d:1, a:"Zengin hareket dağarcığı, sonradan öğrenilecek spora özgü becerilere olumlu transfer sağlar; erken uzmanlaşma ise bu zemini daraltır."},
{u:8, s:"Hareket eğitimi hangi yaş grubu için özellikle uygundur?", c:["Yalnızca ergenler","Erken çocukluk ve temel hareketler evresindeki çocuklar","Yalnızca yetişkinler","Yalnızca elit sporcular","Yalnızca yaşlılar"], d:1, a:"Hareket eğitimi temel hareket becerilerinin kazanıldığı 2–7 yaş ve sonrasındaki çocukluk döneminde en verimlidir."},
{u:8, s:"Aşağıdakilerden hangisi hareket eğitiminin amaçlarından biri DEĞİLDİR?", c:["Beden farkındalığı kazandırmak","Yaratıcılığı geliştirmek","En yetenekli çocukları seçip diğerlerini elemek","Harekete karşı olumlu tutum oluşturmak","Temel hareket becerilerini çeşitlendirmek"], d:2, a:"Hareket eğitimi bir yetenek seçme aracı değildir; amacı ayıklamak değil, herkesi hareket yoluyla geliştirmektir."}
);

/* ---------- ÜNİTE 9 ---------- */
{u:9, s:"Oyunun çekiciliği en çok hangi etkenden kaynaklanır?", c:["Ödülün büyüklüğünden","Sonucun önceden bilinmemesinden (belirsizlikten)","Kuralların katılığından","Süresinin uzunluğundan","Seyirci sayısından"], d:1, a:"Sonucu baştan belli olan oyun ilgi çekmez. Bu yüzden denk takımlar kurmak, oyunu canlı tutmanın en basit ve en etkili yoludur."},
{u:9, s:"Oyunu 'fazla enerjinin boşaltılması' olarak açıklayan kuram ve kuramcı hangisidir?", c:["Dinlenme kuramı – Lazarus","Fazla enerji kuramı – Spencer","Hazırlık kuramı – Groos","Yineleme kuramı – Hall","Psikanalitik kuram – Freud"], d:1, a:"Spencer'a göre çocuk günlük yaşamda kullanmadığı fazla enerjisini oyun yoluyla boşaltır."},
{u:9, s:"Oyunu 'yetişkin yaşamına hazırlık' olarak gören kuramcı kimdir?", c:["Spencer","Lazarus","Groos","Hall","Freud"], d:2, a:"Groos'un hazırlık (alıştırma) kuramına göre çocuk oyunda ileride kullanacağı becerileri prova eder."},
{u:9, s:"Oyunu bastırılmış duyguların boşaltımı olarak açıklayan yaklaşım hangisidir?", c:["Bilişsel gelişim kuramı","Psikanalitik kuram","Fazla enerji kuramı","Dinlenme kuramı","Yineleme kuramı"], d:1, a:"Freud'un psikanalitik yaklaşımına göre çocuk oyunda kaygılarını ve bastırdığı duygularını dışa vurur."},
{u:9, s:"Piaget'in sınıflamasına göre çocuğun bir rolü üstlendiği oyun türü hangisidir?", c:["Alıştırmalı (işlevsel) oyun","Sembolik (–mış gibi) oyun","Kurallı oyun","Paralel oyun","Tek başına oyun"], d:1, a:"Sembolik oyunda çocuk doktor, öğretmen ya da anne rolüne bürünür; rol üstlenme içeren oyun türü budur."},
{u:9, s:"Hareketin kendisi için tekrarlandığı, bebeklikte görülen oyun türü hangisidir?", c:["Kurallı oyun","Sembolik oyun","Alıştırmalı (işlevsel) oyun","İşbirlikli oyun","Eğitsel oyun"], d:2, a:"Alıştırmalı oyunda çocuk topu defalarca yere atmak gibi hareketi hazzı için yineler; oyunun en ilkel biçimidir."},
{u:9, s:"Çocukların yan yana ama birbirine karışmadan, ortak amaç gütmeden oynamasına ne ad verilir?", c:["İşbirlikli oyun","Paralel oyun","Tek başına oyun","İzleyici davranışı","Kurallı oyun"], d:1, a:"Paralel oyunda çocuklar aynı ortamda ve benzer etkinlikte bulunur ama etkileşim kurmazlar; sosyal oyun gelişiminin ara basamağıdır."},
{u:9, s:"Ortak bir amaç ve rol paylaşımı içeren, sosyal oyun gelişiminin en üst basamağı hangisidir?", c:["Paralel oyun","Tek başına oyun","İşbirlikli oyun","İzleyici davranışı","Alıştırmalı oyun"], d:2, a:"İşbirlikli oyunda çocuklar ortak hedef için rol dağıtır ve birbirine bağımlı çalışır; takım sporlarının zeminidir."},
{u:9, s:"Eğitsel oyunun tanımlayıcı özelliği nedir?", c:["Kuralsız ve kendiliğinden olması","Belirli bir eğitim amacına yönelik, planlı ve kurallı olması","Yalnızca yarışma amacı taşıması","Yetişkinlere özgü olması","Yalnızca kapalı alanda oynanması"], d:1, a:"Eğitsel oyun rastgele oyundan ayrılır: önceden belirlenmiş bir hedefi, planı ve kuralı vardır."},
{u:9, s:"Eğitsel oyunlar sınıflandırılırken aşağıdakilerden hangisi ölçüt olarak kullanılMAZ?", c:["Katılımcı sayısı","Oyunun amacı","Hareket içeriği","Oyuncuların göz rengi","Yaş düzeyi"], d:3, a:"Eğitsel oyunlar katılımcı sayısı, amaç, yapı, hareket içeriği ve yaş düzeyine göre sınıflandırılır."},
{u:9, s:"Oyunun çocuğun sosyal gelişimine katkısı aşağıdakilerden hangisidir?", c:["Kas kuvvetini artırması","Kurala uyma, sıra bekleme ve işbirliği öğretmesi","Boy uzamasını hızlandırması","Dikkat süresini kısaltması","Refleksleri güçlendirmesi"], d:1, a:"Oyun, kurallara uymayı, sırasını beklemeyi, paylaşmayı ve liderliği doğal ortamda öğretir."},
{u:9, s:"Oyunun bilişsel gelişime katkısı hangisidir?", c:["Dayanıklılığı artırması","Dikkat, strateji ve problem çözme becerilerini geliştirmesi","Esnekliği artırması","Kemik yoğunluğunu artırması","Kalp atım hızını düşürmesi"], d:1, a:"Oyun kural izleme, strateji kurma ve hızlı karar verme gerektirir; bunlar doğrudan bilişsel becerilerdir."},
{u:9, s:"Kurallı oyunların çocuk tarafından benimsenmesi hangi gelişimsel kazanımı gerektirir?", c:["Nesne sürekliliği","Başkasının bakış açısını alabilme ve kurala uyabilme","Refleks baskılanması","Soyut düşünme","Dil gelişiminin tamamlanması"], d:1, a:"Kurallı oyun, benmerkezcilikten çıkmayı ve ortak kabul edilen kurala uymayı gerektirir; somut işlemler döneminde belirginleşir."},
{u:9, s:"Çocuk sporunda oyunun temel işlevi nedir?", c:["Yalnızca eğlendirmek","Öğrenmenin doğal ve en etkili aracı olmak","Yalnızca kondisyon geliştirmek","Sıralama yapmak","Disiplin sağlamak"], d:1, a:"Çocuk için oyun boş zaman etkinliği değil, öğrenmenin doğal yoludur; beceri öğretimi oyun içine yerleştirildiğinde çok daha kalıcı olur."},

/* ---------- ÜNİTE 10 ---------- */
{u:10, s:"'Etkin katılım' ilkesi hangi anlama gelir?", c:["Antrenörün çok konuşması","Öğrenenin süreçte yaparak yaşayarak yer alması","Sporcunun izleyerek öğrenmesi","Yalnızca yazılı materyal kullanılması","Antrenmanın kısa tutulması"], d:1, a:"Etkin katılım, öğrenenin pasif izleyici değil etkin uygulayıcı olmasıdır ve öğrenmeyi en çok artıran ilkelerden biri kabul edilir."},
{u:10, s:"Antrenörün önce durağan topla pas çalıştırıp sonra hareket hâlinde pasa geçmesi hangi ilkedir?", c:["Basitten karmaşığa","Yakından uzağa","Somuttan soyuta","Ekonomiklik","Güncellik"], d:0, a:"Alıştırmanın kolaydan zora doğru sıralanması basitten karmaşığa ilkesidir."},
{u:10, s:"'Öğretim bireyin yaşına, hazırbulunuşluğuna ve ilgisine uygun olmalıdır' ifadesi hangi ilkedir?", c:["Ekonomiklik","Öğrenciye görelik","Açıklık","Bütünlük","Hedefe görelik"], d:1, a:"Öğrenciye görelik (bireysellik) ilkesi, herkese aynı programı vermenin neden yanlış olduğunu açıklar."},
{u:10, s:"Antrenörün önce hareketi göstermesi, sonra taktiksel gerekçesini anlatması hangi ilkeyle uyumludur?", c:["Somuttan soyuta","Yakından uzağa","Ekonomiklik","Güncellik","Bütünlük"], d:0, a:"Elle tutulur, görülebilir olandan kavramsal olana geçmek somuttan soyuta ilkesidir."},
{u:10, s:"Öğretimde mümkün olduğunca çok duyu organına hitap etme ilkesi hangisidir?", c:["Açıklık (ayanilik)","Ekonomiklik","Bütünlük","Süreklilik","Hedefe görelik"], d:0, a:"Açıklık ilkesi anlat–göster–yaptır zincirini gerektirir; ne kadar çok duyu devreye girerse öğrenme o kadar güçlü olur."},
{u:10, s:"'En az emek ve zamanla en çok verimi elde etme' ilkesi hangisidir?", c:["Ekonomiklik","Açıklık","Bütünlük","Yaşama yakınlık","Öğrenciye görelik"], d:0, a:"Ekonomiklik ilkesi, tek bir alıştırmayla birden çok hedefe hizmet etmeyi savunur."},
{u:10, s:"Antrenmanda maç koşullarına benzer alıştırmalar kullanmak hangi ilkeyle açıklanır?", c:["Yaşama yakınlık","Ekonomiklik","Açıklık","Bilinenden bilinmeyene","Süreklilik"], d:0, a:"Yaşama yakınlık ilkesi, öğretilenin gerçek kullanım ortamına benzemesini gerektirir; böylece transfer güçlenir."},
{u:10, s:"Yeni öğretilecek beceriyi sporcunun bildiği bir hareketle ilişkilendirmek hangi ilkedir?", c:["Bilinenden bilinmeyene","Yakından uzağa","Ekonomiklik","Açıklık","Bütünlük"], d:0, a:"Yeni bilgi mevcut bilgiye bağlandığında anlamlı öğrenme gerçekleşir; bu Ausubel'in anlamlı öğrenme anlayışıyla da örtüşür."},
{u:10, s:"Sporcunun yalnız tekniğini değil, kaygısını ve sosyal uyumunu da dikkate alan antrenör hangi ilkeyi uygular?", c:["Bütünlük","Ekonomiklik","Güncellik","Süreklilik","Açıklık"], d:0, a:"Bütünlük ilkesine göre birey bedensel, zihinsel, duygusal ve sosyal yönleriyle bir bütündür ve bir arada ele alınmalıdır."},

{u:13, s:"Öğretimin SONUNDA ulaşılan düzeye karar vermek için yapılan değerlendirme hangisidir?", c:["Tanıma–yerleştirme","Biçimlendirme–izleme","Düzey belirleme","Ön değerlendirme","Süreç değerlendirmesi"], d:2, a:"Düzey belirleme (summatif) değerlendirme sonuç odaklıdır; belgelendirme ve seçme kararlarında kullanılır."},
{u:13, s:"Bir ölçme aracının 'ölçmek istediği özelliği ölçebilmesi' niteliği hangisidir?", c:["Güvenirlik","Geçerlik","Kullanışlılık","Objektiflik","Duyarlık"], d:1, a:"Geçerlik, aracın doğru şeyi ölçmesidir. Esnekliği ölçmek isterken kuvvet ölçen bir test güvenilir olsa bile geçersizdir."},
{u:13, s:"Bir ölçme aracının tekrarlanan ölçümlerde tutarlı sonuç vermesi hangi niteliktir?", c:["Geçerlik","Güvenirlik","Kullanışlılık","Ekonomiklik","Nesnellik"], d:1, a:"Güvenirlik tutarlılıktır. Bir araç güvenilir olabilir ama yanlış şeyi ölçüyorsa geçerli değildir."},
{u:13, s:"Ölçme aracında bulunması gereken üç temel nitelik hangisidir?", c:["Geçerlik – güvenirlik – kullanışlılık","Hedef – içerik – süreç","Ölçme – ölçüt – karar","Bilişsel – duyuşsal – devinişsel","Hız – kuvvet – dayanıklılık"], d:0, a:"Bir ölçme aracı doğru şeyi ölçmeli (geçerlik), tutarlı ölçmeli (güvenirlik) ve uygulanabilir olmalıdır (kullanışlılık)."},
{u:13, s:"Sporcunun sonucunun grubun ortalamasına göre yorumlanması hangi ölçüt türüdür?", c:["Mutlak ölçüt","Bağıl (göreli) ölçüt","Geçerli ölçüt","Nesnel ölçüt","Duyuşsal ölçüt"], d:1, a:"Bağıl ölçütte birey grupla karşılaştırılır. Mutlak ölçütte ise önceden belirlenmiş sabit bir değere göre karar verilir."},
{u:13, s:"Bloom'un hedef alanlarından 'devinişsel' alan neyi kapsar?", c:["Bilgi ve zihinsel becerileri","İlgi, tutum ve değerleri","Beceri ve hareketleri","Yalnızca hafızayı","Yalnızca sosyal ilişkileri"], d:2, a:"Devinişsel (psikomotor) alan hareket ve beceriyi kapsar. Bilişsel alan bilgiyi, duyuşsal alan tutum ve değerleri kapsar."},
{u:13, s:"Sporcunun spora karşı olumlu tutum geliştirmesi hangi hedef alanına girer?", c:["Bilişsel alan","Duyuşsal alan","Devinişsel alan","Sosyal alan","Fiziksel alan"], d:1, a:"İlgi, tutum, değer ve alışkanlıklar duyuşsal alanın konusudur; sporda kalma davranışının temeli budur."},
{u:13, s:"Bir antrenman planının dört temel öğesi hangileridir?", c:["Isınma – ana bölüm – soğuma – değerlendirme","Hedef – içerik – öğretme-öğrenme süreci – ölçme ve değerlendirme","Geçerlik – güvenirlik – kullanışlılık – ekonomiklik","Bilişsel – duyuşsal – devinişsel – sosyal","Strateji – yöntem – teknik – araç"], d:1, a:"Planın dört öğesi neyi (hedef), ne ile (içerik), nasıl (süreç) ve ne kadar başardığımızı (ölçme–değerlendirme) belirler."},
{u:13, s:"Bir antrenmanın hazırlık (ısınma) bölümünün amacı nedir?", c:["Günün hedefine ulaşmak","Organizmayı yüklenmeye hazırlamak ve sakatlığı önlemek","Toparlanmayı hızlandırmak","Değerlendirme yapmak","Ölçme yapmak"], d:1, a:"Hazırlık bölümü dolaşımı ve kas ısısını yükselterek organizmayı ana bölümdeki yüklenmeye hazırlar; dikkati de toplar."},
{u:13, s:"Antrenmanın bitiş (soğuma) bölümünde aşağıdakilerden hangisi yapılır?", c:["En yüksek şiddetli çalışma","Hafif koşu, germe ve günün kısa değerlendirmesi","Yeni beceri öğretimi","Maksimal kuvvet testi","Yarışma"], d:1, a:"Bitiş bölümü toparlanmayı hızlandırır ve gün içinde öğrenilenlerin kısaca değerlendirilmesine fırsat verir."},
{u:13, s:"Hedefin gözlenebilir ve ölçülebilir biçimde ifade edilmiş hâline ne ad verilir?", c:["İçerik","Davranış (kazanım)","Ölçüt","Strateji","Yöntem"], d:1, a:"Hedef genel niyeti, davranış ise bu niyetin gözlenebilir karşılığını belirtir: 'beş denemeden dördünde doğru teknikle pas verir' bir davranış ifadesidir."},

/* ---------- ÜNİTE 14 ---------- */
{u:14, s:"Çağdaş antrenörlük anlayışının merkezinde ne vardır?", c:["Kazanma","Sporcunun bütünsel gelişimi","Kulüp geliri","Antrenörün kariyeri","Seyirci beklentisi"], d:1, a:"Sporcu merkezli antrenörlükte öncelik sporcunun gelişimi, sağlığı ve sporda kalmasıdır; kazanmak bunun sonucudur, amacı değil."},
{u:14, s:"Tüm kararları kendi veren, sporcuya yalnızca uygulama rolü bırakan antrenörlük yaklaşımı hangisidir?", c:["Demokratik","Otoriter (komut veren)","Serbest bırakan","İşbirlikçi","Sporcu merkezli"], d:1, a:"Otoriter yaklaşım hızlı düzen sağlar ama sporcuda sorumluluk ve özgüven gelişimini engeller."},
{u:14, s:"Antrenörün yönlendirme yapmadığı, sporcuyu tamamen kendi hâline bıraktığı yaklaşım hangisidir?", c:["Otoriter","Demokratik","Serbest bırakan","İşbirlikçi","Bütünsel"], d:2, a:"Serbest bırakan yaklaşımda yapı ve hedef kaybolur; genellikle en verimsiz yaklaşım olarak kabul edilir."},
{u:14, s:"Sporcunun karar süreçlerine katıldığı antrenörlük yaklaşımının temel kazancı nedir?", c:["Antrenmanın kısalması","İçsel güdülenme ve bağlılığın artması","Disiplinin ortadan kalkması","Ölçmenin kolaylaşması","Yarışma sayısının artması"], d:1, a:"Demokratik yaklaşımda sporcu sürecin öznesi olur; bu içsel güdülenmeyi ve spora bağlılığı artırır. Karşılığında daha çok zaman gerektirir."},
{u:14, s:"Bireyin spora nasıl başladığını, sürdürdüğünü ve bıraktığını inceleyen alan hangisidir?", c:["Spor yönetimi","Sporda sosyalleşme","Spor fizyolojisi","Biyomekanik","Antrenman bilimi"], d:1, a:"Sporda sosyalleşme; spora katılım, spor yoluyla sosyalleşme ve spordan ayrılma boyutlarını inceler."},
{u:14, s:"Sporun bireye kurala uyma, işbirliği ve öz denetim kazandırması hangi boyutla açıklanır?", c:["Spora sosyalleşme","Spor yoluyla sosyalleşme","Spordan ayrılma","Yetenek seçimi","Uzmanlaşma"], d:1, a:"Spor yoluyla sosyalleşme, sporun bireye kazandırdığı toplumsal değer ve davranışları ifade eder."},
{u:14, s:"Çocuğun spora katılımında en güçlü etken genellikle hangisidir?", c:["Medya","Aile","Tesis sayısı","Antrenörün ünvanı","Ekonomik durum"], d:1, a:"Önemli diğerleri arasında çocuk için ilk ve en etkili olan ailedir; ailenin tutumu spora başlamayı da sürdürmeyi de belirler."},
{u:14, s:"Aşağıdakilerden hangisi spordan kopmanın (bırakmanın) başlıca nedenlerinden biri DEĞİLDİR?", c:["Eğlencenin bitmesi","Aşırı kazanma baskısı","Erken uzmanlaşma ve tükenmişlik","Oynama süresi bulamama","Antrenörün sporcuya söz hakkı vermesi"], d:4, a:"Sporcuya söz hakkı vermek bağlılığı artırır. Diğer maddeler ise spordan kopmanın en sık nedenleridir ve çoğu antrenörün denetimindedir."},
{u:14, s:"Erken uzmanlaşmanın başlıca riski nedir?", c:["Hareket dağarcığının genişlemesi","Sakatlık, tükenmişlik ve spordan erken kopma","Transferin artması","Kalıcılığın artması","Motivasyonun yükselmesi"], d:1, a:"Tek dala erken yönelme, hareket dağarcığını daraltır; tekrarlayan yüklenme sakatlığı ve tükenmişliği artırarak sporu bırakmaya yol açar."},
{u:14, s:"Antrenörlüğün deneyime dayalı bir uğraş olmaktan çıkıp bilimsel temelli, eğitim ve belge gerektiren bir alana dönüşmesi hangi kavramla adlandırılır?", c:["Sosyalleşme","Profesyonelleşme","Uzmanlaşma","Kurumsallaşma","Bireyselleşme"], d:1, a:"Profesyonelleşme, mesleğin tanımlı bilgi tabanı, eğitim yolu, belgelendirme ve etik kuralları olan bir alana dönüşmesidir."},
{u:14, s:"Çocuk sporunda başarının temel ölçütü ne olmalıdır?", c:["Kazanılan kupa sayısı","Katılımın ve spora bağlılığın sürmesi","Rakiplerin elenmesi","Antrenman saatinin çokluğu","Erken uzmanlaşma"], d:1, a:"Çocuk sporunda kısa vadeli derece uzun vadeli gelişimi gölgelememelidir; başarı, çocuğun sporda kalması ve gelişmeye devam etmesidir."},
{u:14, s:"Aşağıdakilerden hangisi antrenörün rollerinden biri DEĞİLDİR?", c:["Öğretici","Model ve lider","Güdüleyici","Sporcunun sağlık raporunu düzenleyen hekim","Yönetici ve planlayıcı"], d:3, a:"Antrenör öğretici, eğitici, model, lider, yönetici, güdüleyici ve iletişimcidir; ancak tıbbi tanı ve rapor hekimin yetkisindedir."},

/* --- Uzun Süreli Sporcu Gelişim Modeli (LTAD) --- */
{u:15, s:"Uzun Süreli Sporcu Gelişim Modelinde performans geliştirme aşaması aşağıdakilerden hangisini içerir?", c:["Sporcunun motivasyonunun artırılması","Yaralanma önleme stratejilerinin uygulanması","Teknik detayların mükemmelleştirilmesi","Oyun stratejilerinin geliştirilmesi","Fizyolojik adaptasyonun teşvik edilmesi"], d:3, a:"Performans geliştirme aşaması, sporcunun yarışma ortamına hazırlandığı evredir; burada oyun ve taktik stratejileri geliştirilir. Fizyolojik adaptasyon bir ÖNCEKİ aşamanın (antrenman için antrenman), teknik detayların mükemmelleştirilmesi ise bir SONRAKİ aşamanın (kazanmak için antrenman) işidir. Motivasyon ve yaralanma önleme her aşamada geçerli olduğu için aşamayı ayırt etmez."},
{u:15, s:"Uzun Süreli Sporcu Gelişim Modelinin temel mantığı nedir?", c:["Sporcuyu en kısa sürede yarışmaya hazırlamak","Her aşamanın kendine özgü önceliği olduğunu ve sıranın bozulmaması gerektiğini kabul etmek","Tüm yaş gruplarına aynı programı uygulamak","Yalnızca elit sporcuları kapsamak","Yetenekli olmayanları erken elemek"], d:1, a:"Model, gelişimi yaşam boyuna yayar; bir aşamanın işi ne ertelenebilir ne de öne çekilebilir. Erken uzmanlaşmanın temel eleştirisi de budur."},
{u:15, s:"LTAD modelinde temel hareket becerilerinin (koşma, atlama, atma, yakalama) oyun ağırlıklı biçimde kazandırıldığı aşama hangisidir?", c:["Aktif başlangıç","Temeller (eğlenceli temeller)","Performans geliştirme","Elit performans","Aktif yaşam"], d:1, a:"Temeller aşamasında amaç geniş bir hareket dağarcığı kurmaktır; branşa özgü teknik değil, temel beceri çeşitliliği önceliklidir."},
{u:15, s:"LTAD modelinde teknik detayların mükemmelleştirilmesi ve yarışma yönetimi hangi aşamanın işidir?", c:["Aktif başlangıç","Temeller","Öğrenmeyi öğrenme","Elit performans (kazanmayı öğrenme)","Aktif yaşam"], d:3, a:"Teknik ince ayar ve taktik incelik, fizyolojik alt yapı kurulduktan sonra elit aşamada ele alınır."},
{u:15, s:"LTAD modelinde sporcunun birden çok branşı denemesi ve genel spor becerileri kazanması hangi aşamada beklenir?", c:["Öğrenmeyi öğrenme","Elit performans","Performans geliştirme","Aktif yaşam","Aktif başlangıç"], d:0, a:"Öğrenmeyi öğrenme aşamasında sporcu genel spor becerilerini edinir ve farklı branşlar dener; bu çeşitlilik ileride olumlu transfer sağlar."},
{u:15, s:"LTAD modelinin son aşaması olan 'aktif yaşam' neyi ifade eder?", c:["Elit düzeyde yarışmayı sürdürmek","Yarışmayı bıraktıktan sonra da fiziksel etkinliğe bağlı kalmak","Antrenörlüğe geçmek","Uzmanlaşmayı tamamlamak","Yeni bir branşa başlamak"], d:1, a:"Modelin amacı yalnız şampiyon üretmek değil, bireyi yaşam boyu hareketli tutmaktır. Aktif yaşam bu hedefin karşılığıdır."},
{u:15, s:"Bir soruda 'motivasyonun artırılması' ve 'yaralanma önleme' seçenekleri LTAD aşamalarını ayırt etmek için neden yetersizdir?", c:["Modelde yer almadıkları için","Her aşamada geçerli genel ilkeler oldukları için","Yalnızca elit sporcuyu ilgilendirdikleri için","Ölçülemedikleri için","Yalnızca çocuklar için geçerli oldukları için"], d:1, a:"Tüm aşamalarda geçerli olan bir madde tek bir aşamanın ayırt edici özelliği olamaz. Sınavda bu tür 'her yere uyan' seçenekler tipik çeldiricidir."},
{u:15, s:"LTAD modeline göre erken uzmanlaşma neden sakıncalıdır?", c:["Sporcunun motivasyonunu artırdığı için","Aşamaların sırasını bozarak temel hareket alt yapısını eksik bıraktığı için","Yarışma sayısını azalttığı için","Antrenör sayısını artırdığı için","Fizyolojik adaptasyonu hızlandırdığı için"], d:1, a:"Erken uzmanlaşma, temel beceri ve genel gelişim aşamalarını atlayarak dar bir alt yapı üzerine performans kurar; sakatlık, tükenmişlik ve erken kopmayla sonuçlanır."},
{u:15, s:"LTAD modelinde 'aktif başlangıç' aşamasının önceliği nedir?", c:["Branş tekniği öğretmek","Hareketi sevdirmek ve günlük fiziksel etkinlik alışkanlığı kazandırmak","Yarışmaya hazırlamak","Kuvvet antrenmanına başlamak","Yetenek seçimi yapmak"], d:1, a:"0–6 yaş aralığında amaç performans değil, harekete karşı olumlu tutum ve düzenli etkinlik alışkanlığıdır."},
{u:15, s:"Ergenlik döneminde sistemli yüklenmeyle aerobik kapasite ve kuvvetin geliştirilmesi LTAD'ın hangi aşamasına denk gelir?", c:["Temeller","Öğrenmeyi öğrenme","Antrenman için antrenman","Aktif yaşam","Aktif başlangıç"], d:2, a:"Antrenman için antrenman aşamasında sporcunun fizyolojik kapasitesi kurulur; bu aşama atlanırsa üst düzey performansın dayanacağı zemin oluşmaz. Bir sonraki aşama olan performans geliştirme (yarışmak için antrenman) ise oyun ve taktik stratejilerine ayrılır."},

/* --- LTAD: aşamalar, pencereler, yaş kavramları, özelleşme --- */
{u:15, s:"Uzun Süreli Sporcu Gelişim Modeli kaç aşamadan oluşur ve son aşaması hangisidir?", c:["Beş aşama; son aşama kazanmak için antrenman","Yedi aşama; son aşama aktif yaşam","Üç aşama; son aşama özelleşme","Dört aşama; son aşama yarışmak için antrenman","Altı aşama; son aşama elit performans"], d:1, a:"Model yedi aşamalıdır ve aktif başlangıçla başlayıp aktif yaşamla biter. Son aşamanın yarışma değil yaşam boyu hareketlilik olması, modelin amacını özetler."},
{u:15, s:"LTAD modelinde branşa özelleşme, yarışma deneyimi ve bireysel güçlü yönlerin geliştirilmesi hangi aşamanın işidir?", c:["Temeller","Öğrenmeyi öğrenme","Antrenman için antrenman","Yarışmak için antrenman","Aktif başlangıç"], d:3, a:"Yarışmak için antrenman aşamasında sporcu artık bir branşa yönelir ve yarışma ortamına uyum sağlar. Fizyolojik alt yapı bir önceki aşamada kurulmuştur."},
{u:15, s:"Temel hareket becerileri ile temel spor becerilerinin birlikte kazanılmış olmasına ne ad verilir?", c:["Fiziksel uygunluk","Fiziksel okuryazarlık","Motor kapasite","Antrenman yaşı","Biyolojik olgunluk"], d:1, a:"Fiziksel okuryazarlık, sporun alfabesidir: bu temel olmadan hiçbir branşta ilerlenemez. LTAD'ın ilk üç aşamasının hedefi budur."},
{u:15, s:"Bir sporcunun bedeninin gerçek olgunlaşma düzeyini gösteren yaş kavramı hangisidir?", c:["Kronolojik yaş","Biyolojik yaş","Antrenman yaşı","Takvim yaşı","Yasal yaş"], d:1, a:"Kronolojik (takvim) yaş doğum tarihine dayanır ve gelişim düzeyini göstermez. Antrenman biyolojik yaşa göre planlanmalıdır; aynı sınıftaki iki çocuk arasında yıllarca fark olabilir."},
{u:15, s:"Yirmi beş yaşında olup sistemli antrenmana yeni başlamış bir sporcu için aşağıdakilerden hangisi doğrudur?", c:["Kronolojik yaşı düşüktür","Antrenman yaşı düşüktür, başlangıç aşamasına uygun program almalıdır","Biyolojik yaşı düşüktür","Doğrudan elit programa alınmalıdır","Fiziksel okuryazarlığı tamamdır"], d:1, a:"Antrenman yaşı, sporcunun kaç yıldır sistemli çalıştığını gösterir. Kronolojik olarak yetişkin olması, antrenman geçmişi olmadan ileri düzey yüklenmeyi kaldırabileceği anlamına gelmez."},
{u:15, s:"LTAD modelinde antrenman pencerelerinin zamanlaması hangi döneme göre ayarlanır?", c:["Doğum tarihine","Okula başlama yaşına","En hızlı boy uzama dönemine (PHV)","Yarışma takvimine","Kulübe kayıt tarihine"], d:2, a:"PHV (peak height velocity), ergenlikteki en hızlı boy uzama anıdır; kızlarda yaklaşık 12, erkeklerde 14 yaş civarında görülür ve gelişim pencerelerinin referans noktasıdır."},
{u:15, s:"Bir motorik özelliğin antrenmana en çok yanıt verdiği döneme ne ad verilir?", c:["Plato","Duyarlı (kritik) pencere","Adaptasyon eşiği","Süperkompanzasyon","Antrenman yaşı"], d:1, a:"Duyarlı pencereler, o özelliğin en verimli geliştiği zaman aralıklarıdır. Pencere kaçırıldığında özellik yine gelişir ama aynı düzeye ulaşmaz."},
{u:15, s:"LTAD modeline göre beceri (teknik) öğretiminin en verimli olduğu dönem hangisidir?", c:["PHV'den sonra","Çocukluk döneminde, PHV'den önce","Erken yetişkinlikte","Yalnızca elit aşamada","Aktif yaşam aşamasında"], d:1, a:"Beceri penceresi PHV'den önce, yaklaşık 8–12 yaş arasında açılır. Bu dönem teknik öğretimin altın çağıdır; sonraya bırakılan teknik aynı düzeye getirilemez."},
{u:15, s:"LTAD modeline göre kuvvet penceresi ne zaman açılır?", c:["Doğumdan hemen sonra","Okul öncesi dönemde","PHV'den sonra; kızlarda adet döngüsünün başlamasıyla, erkeklerde PHV'den 12–18 ay sonra","Beceri penceresiyle aynı anda","Elit aşamada"], d:2, a:"Kuvvet gelişimi hormonal olgunlaşmaya bağlıdır ve bu yüzden en son açılan penceredir. Sıra şudur: önce beceri, sonra dayanıklılık, en son kuvvet."},
{u:15, s:"Aşağıdakilerden hangisi erken özelleşen spor dallarından biridir?", c:["Futbol","Atletizm","Artistik jimnastik","Kürek","Güreş"], d:2, a:"Artistik jimnastik, artistik buz pateni, dalış ve masa tenisi erken özelleşen sporlardır; karmaşık beceriler olgunlaşma öncesinde kazanılmak zorundadır."},
{u:15, s:"Geç özelleşen spor dallarında özelleşmenin ergenlik sonrasına bırakılmasının temel gerekçesi nedir?", c:["Antrenör sayısının yetersiz olması","Erken özelleşmenin sakatlık, tükenmişlik ve spordan erken kopma doğurması","Yarışma takviminin geç başlaması","Tesislerin yetersiz olması","Yasal zorunluluk"], d:1, a:"Sporların büyük çoğunluğu geç özelleşendir. Erken özelleşme geniş hareket alt yapısını kurmadan performans zorlar; bedeli sakatlık ve kopmadır."},
{u:15, s:"LTAD modelinde elit düzeye ulaşmak için öngörülen ölçüt aşağıdakilerden hangisidir?", c:["3 yıl / 1.000 saat","5 yıl / 5.000 saat","10 yıl / 10.000 saat nitelikli antrenman","15 yıl / 20.000 saat","Süre önemli değildir, yetenek belirleyicidir"], d:2, a:"On yıl ve on bin saat kuralı, elit performansın kısa yoldan üretilemeyeceğini anlatır. Yetenek tek başına yeterli değildir; sistemli ve uzun süreli antrenman şarttır."},

/* ============================================================
   DURUM
   ============================================================ */
const ANAHTAR = "soo_calisma_v1";
const bos = () => ({ kayit:{}, denemeler:[], tema:"" });
let D = bos();

function yukle(){
  try{
    const h = localStorage.getItem(ANAHTAR);
    if(h) D = Object.assign(bos(), JSON.parse(h));
  }catch(e){ D = bos(); }
}
function kaydet(){
  try{ localStorage.setItem(ANAHTAR, JSON.stringify(D)); }catch(e){}
}

/* Leitner kutusu: 1 = taze yanlış, 5 = ezberlendi. Yanlışta 1'e döner. */
function kayitAl(id){
  return D.kayit[id] || (D.kayit[id] = { d:0, y:0, kutu:0, son:0 });
}
/* Kutu 4 ve üstü = öğrenildi, tekrar listesinden çıkar.
   İlk denemede doğru bilinen soru doğrudan 4'e gider; hiç yanlış yapılmadığı için
   tekrar kutusunda işi yoktur. Yanlış yapılan soru 1'e düşer ve üç doğruyla çıkar. */
const OGRENILDI = 4;
function cevapIsle(id, dogruMu){
  const k = kayitAl(id);
  if(dogruMu){ k.d++; k.kutu = k.kutu ? Math.min(5, k.kutu + 1) : OGRENILDI; }
  else { k.y++; k.kutu = 1; }
  k.son = Date.now();
  kaydet();
}
const yanlisHavuzu = () =>
  SORULAR.filter(s => { const k = D.kayit[s.id]; return k && k.kutu >= 1 && k.kutu < OGRENILDI; })
         .sort((a,b) => (D.kayit[a.id].kutu - D.kayit[b.id].kutu) || (D.kayit[a.id].son - D.kayit[b.id].son));

function uniteIst(u){
  const sorular = SORULAR.filter(s => s.u === u);
  let cozulen = 0, ogrenilen = 0;
  sorular.forEach(s => {
    const k = D.kayit[s.id];
    if(k && (k.d + k.y) > 0){ cozulen++; if(k.kutu >= OGRENILDI) ogrenilen++; }
  });
  const oran = sorular.length ? Math.round(100 * ogrenilen / sorular.length) : 0;
  return { toplam:sorular.length, cozulen, oran };
}
function genelIst(){
  const cozulen = Object.keys(D.kayit).length;
  let d = 0, y = 0;
  Object.values(D.kayit).forEach(k => { d += k.d; y += k.y; });
  return { cozulen, toplam:SORULAR.length, dogru:d, yanlis:y,
           basari: (d + y) ? Math.round(100 * d / (d + y)) : 0 };
}

/* ============================================================
   YARDIMCI
   ============================================================ */
const $ = s => document.querySelector(s);
const HARF = ["A","B","C","D","E"];
function kacir(dizi){
  const a = dizi.slice();
  for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function kacisla(t){
  return String(t).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
}
function halka(oran){
  const c = 2 * Math.PI * 14;
  return `<svg class="halka" viewBox="0 0 36 36" aria-hidden="true">
    <circle class="iz" cx="18" cy="18" r="14"></circle>
    <circle class="dolu" cx="18" cy="18" r="14" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - oran/100)}"></circle>
    <text x="18" y="21.5">${oran}</text></svg>`;
}

/* ============================================================
   GEZİNME
   ============================================================ */
const SAYFALAR = [
  { id:"konular", ad:"Konular", ikon:'<path d="M4 5h16M4 12h16M4 19h10"/>' },
  { id:"calis",   ad:"Çalış",   ikon:'<path d="M12 3v18M3 12h18"/><circle cx="12" cy="12" r="9"/>' },
  { id:"yanlis",  ad:"Yanlışlarım", ikon:'<path d="M12 8v5M12 16.5v.5"/><path d="M10.3 3.9 2.6 17a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>' },
  { id:"deneme",  ad:"Deneme",  ikon:'<path d="M9 3h6v3H9z"/><path d="M5 6h14v15H5z"/><path d="M9 12h6M9 16h4"/>' }
];
let aktifSayfa = "konular";

function navCiz(){
  const yv = yanlisHavuzu().length;
  $("#alt-nav").innerHTML = SAYFALAR.map(s => `
    <button data-git="${s.id}" ${aktifSayfa === s.id ? 'aria-current="page"' : ""}>
      <svg viewBox="0 0 24 24">${s.ikon}</svg>
      ${s.id === "yanlis" && yv ? `<span class="rozet">${yv}</span>` : ""}
      <span>${s.ad}</span>
    </button>`).join("");
  $("#alt-nav").querySelectorAll("button").forEach(b =>
    b.onclick = () => git(b.dataset.git));
}
function git(id){
  aktifSayfa = id;
  document.querySelectorAll(".sayfa").forEach(s => s.classList.remove("acik"));
  $("#sayfa-" + id).classList.add("acik");
  if(id === "konular") konularCiz();
  if(id === "calis")   calisCiz();
  if(id === "yanlis")  yanlisCiz();
  if(id === "deneme")  denemeCiz();
  navCiz(); centiklerCiz();
  basaDon();
}

function centiklerCiz(){
  $("#centikler").innerHTML = UNITELER.map(u => {
    const i = uniteIst(u.id);
    return `<span class="centik ${i.oran >= 80 ? "tam" : ""}" title="${kacisla(u.no + ". " + u.ad)} — %${i.oran}"><i style="width:${i.oran}%"></i></span>`;
  }).join("");
}

/* ============================================================
   KONULAR
   ============================================================ */
function konularCiz(){
  $("#unite-detay").style.display = "none";
  $("#unite-liste-gorunum").style.display = "";
  const g = genelIst();
  $("#genel-ist").innerHTML = `
    <div><b>${g.cozulen}<span style="font-size:14px;color:var(--metin-silik)">/${g.toplam}</span></b><span>Görülen soru</span></div>
    <div><b>%${g.basari}</b><span>Doğru oranı</span></div>
    <div><b>${yanlisHavuzu().length}</b><span>Tekrar bekliyor</span></div>`;
  $("#unite-listesi").innerHTML = UNITELER.map(u => {
    const i = uniteIst(u.id);
    return `<button class="unite ${i.oran >= 80 ? "tamam" : ""}" data-u="${u.id}">
      <span class="unite-no">${u.no}</span>
      <span class="unite-ad"><b>${kacisla(u.ad)}</b><span>${i.toplam} soru · ${i.cozulen} görüldü</span></span>
      ${halka(i.oran)}
    </button>`;
  }).join("");
  $("#unite-listesi").querySelectorAll(".unite").forEach(b =>
    b.onclick = () => uniteAc(+b.dataset.u));
  $("#dipnot").innerHTML = `Toplam <b>${SORULAR.length}</b> soru, hepsi 5 şıklı ve açıklamalı. İlerleme bu tarayıcıya kaydedilir; kaldığın yerden devam edebilirsin.<br><br><b>Şıklar her seferinde karıştırılır</b> — aynı soru ikinci kez karşına çıktığında doğru cevap başka harfte olur. Bu bilerek yapıldı: harfin yerini değil cevabın kendisini öğrenmen için. Bu yüzden cevap harfle değil, metniyle gösteriliyor.`;
}

function uniteAc(uid){
  const u = UNITELER.find(x => x.id === uid);
  if(!u) return;
  const i = uniteIst(uid);
  $("#unite-liste-gorunum").style.display = "none";
  const d = $("#unite-detay");
  d.style.display = "";
  d.innerHTML = `
    <button class="dg" id="geri-dugme" style="margin-bottom:16px">← Konular</button>
    <p class="etiket">Ünite ${u.no} · ${i.toplam} soru</p>
    <h1>${kacisla(u.ad)}</h1>
    <div class="metin">${u.ozet}</div>
    <div class="dg-sira">
      <button class="dg ana" id="unite-calis">Bu üniteden ${i.toplam} soru çöz</button>
      <button class="dg" id="unite-sonraki">Sonraki ünite →</button>
    </div>
    <div style="height:20px"></div>`;
  $("#geri-dugme").onclick = () => konularCiz();
  $("#unite-calis").onclick = () => { git("calis"); oturumBaslat(SORULAR.filter(s => s.u === uid), "Ünite " + u.no + " — " + u.ad); };
  const sonraki = UNITELER.find(x => x.no === u.no + 1);
  const sb = $("#unite-sonraki");
  if(sonraki) sb.onclick = () => { uniteAc(sonraki.id); basaDon(); };
  else { sb.textContent = "Son ünite"; sb.disabled = true; }
  basaDon();
}

/* ============================================================
   SORU OTURUMU  (çalış / yanlışlarım / deneme ortak motoru)
   ============================================================ */
let oturum = null; // {liste, i, baslik, sinav, cevaplar, kalan, zamanlayici}

function oturumBaslat(liste, baslik, secenek){
  secenek = secenek || {};
  if(!liste.length){ calisCiz(); return; }
  oturum = {
    liste: secenek.sirali ? liste.slice() : kacir(liste),
    i: 0, baslik, sinav: !!secenek.sinav,
    dogru: 0, yanlis: 0, kalan: secenek.sure || 0, zamanlayici: null, bitti: false
  };
  soruCiz();
}

function hedefSayfa(){ return $("#sayfa-" + aktifSayfa); }

/* Şıklar her gösterimde karıştırılır: doğru cevabın yeri ezberlenemesin.
   'Hiçbiri' / 'Hepsi' gibi kapanış şıkları en sonda sabit tutulur. */
function sikSirasi(s){
  const kapanis = /^(hiçbiri|hepsi|yukarıdakilerin)/i;
  const sabit = [], oynak = [];
  s.c.forEach((metin, i) => (kapanis.test(metin) ? sabit : oynak).push(i));
  return kacir(oynak).concat(sabit);
}

function soruCiz(){
  if(!oturum) return;
  const s = oturum.liste[oturum.i];
  oturum.sira = sikSirasi(s);
  const el = hedefSayfa();
  el.innerHTML = `
    <div class="soru-ust">
      <button class="dg" id="cik" style="padding:5px 10px; font-size:12.5px">✕ Çık</button>
      <span class="ilerle-cubuk"><i style="width:${100 * oturum.i / oturum.liste.length}%"></i></span>
      <span>${oturum.i + 1}/${oturum.liste.length}</span>
    </div>
    <div class="soru-kart">
      <div class="soru-unite">${oturum.sinav ? kacisla(oturum.baslik) : kacisla(uniteAdi(s.u))}</div>
      <p class="soru-metin">${kacisla(s.s)}</p>
      <div class="siklar" id="siklar">
        ${oturum.sira.map((gercek, gosterim) => `<button class="sik" data-ix="${gosterim}"><span class="sik-harf">${HARF[gosterim]}</span><span>${kacisla(s.c[gercek])}</span></button>`).join("")}
      </div>
      <div id="aciklama-yeri"></div>
    </div>`;
  $("#cik").onclick = () => oturumIptal();
  el.querySelectorAll(".sik").forEach(b => b.onclick = () => sikSec(+b.dataset.ix));
}
const uniteAdi = u => { const x = UNITELER.find(y => y.id === u); return x ? "Ünite " + x.no + " · " + x.ad : ""; };

function sikSec(gosterimIx){
  const s = oturum.liste[oturum.i];
  const dogruGosterim = oturum.sira.indexOf(s.d);
  const dogruMu = gosterimIx === dogruGosterim;
  cevapIsle(s.id, dogruMu);
  if(dogruMu) oturum.dogru++; else oturum.yanlis++;

  const btns = hedefSayfa().querySelectorAll(".sik");
  btns.forEach((b,i) => {
    b.disabled = true;
    if(i === dogruGosterim) b.classList.add("dogru");
    else if(i === gosterimIx) b.classList.add("yanlis");
    else b.classList.add("solgun");
  });

  if(oturum.sinav){
    // Sınavda anında açıklama yok — gerçek koşul. Doğrudan sonrakine.
    setTimeout(() => sonraki(), 180);
    return;
  }
  $("#aciklama-yeri").innerHTML = `
    <div class="aciklama ${dogruMu ? "iyi" : "kotu"}">
      <div class="basi">${dogruMu ? "✓ Doğru" : "✕ Yanlış"}</div>
      ${dogruMu ? "" : `<div class="dogru-cevap"><b>Doğru cevap:</b> ${kacisla(s.c[s.d])}</div>`}
      <div>${kacisla(s.a)}</div>
    </div>
    <div class="dg-sira"><button class="dg ana genis" id="ileri">${oturum.i + 1 < oturum.liste.length ? "Sonraki soru →" : "Bitir ve sonucu gör"}</button></div>`;
  $("#ileri").onclick = () => sonraki();
  $("#ileri").focus();
}
function sonraki(){
  if(!oturum || oturum.bitti) return;
  oturum.i++;
  if(oturum.i >= oturum.liste.length) oturumBitir();
  else soruCiz();
}
function oturumIptal(){
  if(oturum && oturum.zamanlayici) clearInterval(oturum.zamanlayici);
  oturum = null;
  git(aktifSayfa);
}
function oturumBitir(){
  if(!oturum) return;
  oturum.bitti = true;
  if(oturum.zamanlayici) clearInterval(oturum.zamanlayici);
  const toplam = oturum.liste.length;
  const dogru = oturum.dogru;
  const puan = Math.round(100 * dogru / toplam);
  const gecti = puan >= 60;
  if(oturum.sinav){
    D.denemeler.push({ t: new Date().toISOString().slice(0,10), dogru, toplam, puan });
    kaydet();
  }
  const kalanYanlis = yanlisHavuzu().length;
  hedefSayfa().innerHTML = `
    <div class="kart sonuc">
      <div class="puan ${gecti ? "gecti" : "kaldi"}">${puan}</div>
      <div class="karar">${gecti ? "İyi gidiyor" : "Tekrar gerek"}</div>
      <p>${toplam} soruda <b>${dogru} doğru</b>, ${toplam - dogru} yanlış.
      ${kalanYanlis ? kalanYanlis + " soru tekrar kutusunda bekliyor." : "Tekrar kutun boş."}</p>
      <div class="dg-sira" style="justify-content:center">
        <button class="dg ana" id="son-yanlis">Yanlışları çalış (${kalanYanlis})</button>
        <button class="dg" id="son-kapat">Kapat</button>
      </div>
    </div>`;
  $("#son-kapat").onclick = () => oturumIptal();
  $("#son-yanlis").onclick = () => { oturum = null; git("yanlis"); const h = yanlisHavuzu(); if(h.length) oturumBaslat(h, "Tekrar", { sirali:true }); };
  oturum = null;
}

/* ============================================================
   ÇALIŞ
   ============================================================ */
function calisCiz(){
  const g = genelIst();
  const gorulmemis = SORULAR.filter(s => !D.kayit[s.id]);
  $("#sayfa-calis").innerHTML = `
    <h1>Çalış</h1>
    <p class="giris">Her soruda cevabın hemen açıklanır. Yanlış yaptıkların otomatik olarak tekrar kutusuna düşer.</p>
    <div class="dizi">
      <button class="unite" id="c-yeni">
        <span class="unite-no">›</span>
        <span class="unite-ad"><b>Hiç görmediklerim</b><span>${gorulmemis.length} soru bekliyor</span></span>
      </button>
      <button class="unite" id="c-karisik">
        <span class="unite-no">⤨</span>
        <span class="unite-ad"><b>Karışık 20 soru</b><span>Tüm ünitelerden rastgele</span></span>
      </button>
      <button class="unite" id="c-zayif">
        <span class="unite-no">↓</span>
        <span class="unite-ad"><b>En zayıf ünitem</b><span>${zayifUnite() ? zayifUnite().ad : "henüz veri yok"}</span></span>
      </button>
      <button class="unite" id="c-tum">
        <span class="unite-no">∞</span>
        <span class="unite-ad"><b>Tüm banka</b><span>${g.toplam} soru, karışık sırada</span></span>
      </button>
    </div>
    <h2>Üniteden seç</h2>
    <div class="dizi">
      ${UNITELER.map(u => { const i = uniteIst(u.id);
        return `<button class="unite" data-cu="${u.id}">
          <span class="unite-no">${u.no}</span>
          <span class="unite-ad"><b>${kacisla(u.ad)}</b><span>${i.toplam} soru</span></span>
          ${halka(i.oran)}</button>`; }).join("")}
    </div>
    <div style="height:16px"></div>`;
  $("#c-yeni").onclick = () => gorulmemis.length ? oturumBaslat(gorulmemis, "Yeni sorular") : null;
  $("#c-karisik").onclick = () => oturumBaslat(kacir(SORULAR).slice(0,20), "Karışık");
  $("#c-zayif").onclick = () => { const z = zayifUnite(); if(z) oturumBaslat(SORULAR.filter(s => s.u === z.id), z.ad); };
  $("#c-tum").onclick = () => oturumBaslat(SORULAR, "Tüm banka");
  $("#sayfa-calis").querySelectorAll("[data-cu]").forEach(b =>
    b.onclick = () => { const u = UNITELER.find(x => x.id === +b.dataset.cu); oturumBaslat(SORULAR.filter(s => s.u === u.id), u.ad); });
}
function zayifUnite(){
  const denenmis = UNITELER.filter(u => uniteIst(u.id).cozulen >= 3);
  if(!denenmis.length) return null;
  return denenmis.sort((a,b) => uniteIst(a.id).oran - uniteIst(b.id).oran)[0];
}

/* ============================================================
   YANLIŞLARIM
   ============================================================ */
function yanlisCiz(){
  const h = yanlisHavuzu();
  const el = $("#sayfa-yanlis");
  if(!h.length){
    el.innerHTML = `<h1>Yanlışlarım</h1>
      <div class="bos"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>
      <p>Tekrar kutun boş.<br>Yanlış yaptığın her soru buraya düşer ve üç kez doğru bilene kadar kalır.</p></div>`;
    return;
  }
  const kutular = [1,2,3].map(k => h.filter(s => D.kayit[s.id].kutu === k).length);
  el.innerHTML = `
    <h1>Yanlışlarım</h1>
    <p class="giris">Aralıklı tekrar: yanlış yaptığın soru 1. kutuya düşer, her doğru cevapta bir üst kutuya çıkar, 4. kutuya ulaşınca listeden çıkar. Bir yanlış onu tekrar 1'e indirir.</p>
    <div class="ist">
      <div><b>${kutular[0]}</b><span>1. kutu · taze</span></div>
      <div><b>${kutular[1]}</b><span>2. kutu</span></div>
      <div><b>${kutular[2]}</b><span>3. kutu · son adım</span></div>
    </div>
    <button class="dg ana genis" id="y-basla">${h.length} soruyu tekrar et</button>
    <h2>Bekleyen sorular</h2>
    <div class="dizi">
      ${h.slice(0,40).map(s => `<div class="kart" style="padding:11px 13px">
        <div class="soru-unite" style="margin-bottom:4px">${kacisla(uniteAdi(s.u))} · ${D.kayit[s.id].kutu}. kutu</div>
        <div style="font-size:14.5px; line-height:1.45">${kacisla(s.s)}</div></div>`).join("")}
    </div>
    <div style="height:16px"></div>`;
  $("#y-basla").onclick = () => oturumBaslat(h, "Tekrar", { sirali:true });
}

/* ============================================================
   DENEME
   ============================================================ */
function denemeCiz(){
  const el = $("#sayfa-deneme");
  const dn = D.denemeler.slice().reverse();
  el.innerHTML = `
    <h1>Deneme</h1>
    <p class="giris">Tüm ünitelerden 20 karışık soru, açıklama olmadan. Sonunda puanını ve hangi soruları kaçırdığını görürsün. Süre yok, istediğin zaman çık.</p>
    <button class="dg ana genis" id="d-basla" style="padding:15px">20 soruluk deneme başlat</button>
    ${dn.length ? `<h2>Geçmiş denemeler</h2>
      <div class="tablo-sar"><table>
        <thead><tr><th>Tarih</th><th>Doğru</th><th>Puan</th><th>Sonuç</th></tr></thead>
        <tbody>${dn.map(x => `<tr>
          <td style="font-family:var(--f-sayi)">${x.t.split("-").reverse().join(".")}</td>
          <td style="font-family:var(--f-sayi)">${x.dogru}/${x.toplam}</td>
          <td style="font-family:var(--f-sayi)">${x.puan}</td>
          <td style="color:${x.puan >= 60 ? "var(--dogru)" : "var(--yanlis)"}; font-weight:600">${x.puan >= 60 ? "Geçti" : "Kaldı"}</td>
        </tr>`).join("")}</tbody>
      </table></div>` : ""}
    <div style="height:16px"></div>`;
  $("#d-basla").onclick = () => {
    // Üniteleri dengeli tara: her üniteden en az bir soru, kalanı rastgele.
    const secili = [];
    kacir(UNITELER).forEach(u => {
      const havuz = kacir(SORULAR.filter(s => s.u === u.id));
      if(havuz.length) secili.push(havuz[0]);
    });
    const kalanHavuz = kacir(SORULAR.filter(s => !secili.includes(s)));
    while(secili.length < 20 && kalanHavuz.length) secili.push(kalanHavuz.pop());
    oturumBaslat(kacir(secili).slice(0,20), "Deneme", { sinav:true });
  };
}

/* ============================================================
   KAYDIRMA — fare tekerleği / PageUp / PageDown olmadan
   ============================================================ */
const govde = () => $("#govde");
function basaDon(){ const g = govde(); if(g) g.scrollTo({ top:0, behavior:"auto" }); }

(function kaydirmaKur(){
  const g = govde(), yukari = $("#k-yukari"), asagi = $("#k-asagi"), kutu = $("#kaydir");

  function durumTazele(){
    const kaydirilabilir = g.scrollHeight - g.clientHeight > 8;
    kutu.style.display = kaydirilabilir ? "flex" : "none";
    yukari.disabled = g.scrollTop <= 2;
    asagi.disabled  = g.scrollTop >= g.scrollHeight - g.clientHeight - 2;
  }

  /* Tek tık: bir ekran boyu (biraz örtüşmeli, okuma yeri kaybolmasın).
     Basılı tutma: kısa adımlarla sürekli kaydırır. */
  function adim(yon, buyuk){
    g.scrollBy({ top: yon * (buyuk ? g.clientHeight * 0.82 : 46), behavior: buyuk ? "smooth" : "auto" });
  }
  [[yukari,-1],[asagi,1]].forEach(([dugme, yon]) => {
    let sayac = null, tekrar = null, basiliKaydi = false;
    const birak = () => { clearTimeout(sayac); clearInterval(tekrar); sayac = tekrar = null; };
    dugme.addEventListener("pointerdown", e => {
      if(e.button) return;
      basiliKaydi = false;
      sayac = setTimeout(() => { basiliKaydi = true; tekrar = setInterval(() => adim(yon, false), 16); }, 300);
    });
    ["pointerup","pointerleave","pointercancel"].forEach(o => dugme.addEventListener(o, birak));
    dugme.addEventListener("click", () => { if(!basiliKaydi) adim(yon, true); basiliKaydi = false; });
  });

  g.addEventListener("scroll", durumTazele, { passive:true });
  new ResizeObserver(durumTazele).observe(g.firstElementChild);
  window.addEventListener("resize", durumTazele);
  durumTazele();

  /* Klavyesi olan için: yön tuşları ve boşluk da gövdeyi kaydırsın */
  document.addEventListener("keydown", e => {
    if(/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName)) return;
    const tus = { ArrowDown:[1,false], ArrowUp:[-1,false], PageDown:[1,true], PageUp:[-1,true], " ":[1,true] }[e.key];
    if(!tus) return;
    e.preventDefault();
    adim(tus[0] * (tus[1] ? 1 : 3), tus[1]);
  });
})();

/* ============================================================
   TEMA
   ============================================================ */
function temaUygula(){
  if(D.tema) document.documentElement.setAttribute("data-theme", D.tema);
  else document.documentElement.removeAttribute("data-theme");
}
$("#temaDugme").onclick = () => {
  const suan = D.tema || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  D.tema = suan === "dark" ? "light" : "dark";
  kaydet(); temaUygula();
};

/* ============================================================
   BAŞLAT
   ============================================================ */
(function(){
  SORULAR.forEach((s, i) => s.id = i);
  UNITELER.forEach((u, i) => { if(!u.id) u.id = i + 1; u.no = i + 1; });
  yukle();
  temaUygula();
  git("konular");
})();
</script>
