,"Yönlendirilmiş buluş"],"d":2,"a":"Karşılıklı stilde gözlemci rolündeki sporcu, verilen ölçüt listesine bakarak eşine dönüt verir; hem öğretir hem öğrenir."},{"u":9,"s":"Aynı görevin farklı zorluk düzeylerinde sunulup her sporcunun kendi düzeyini seçtiği stil hangisidir?","c":["Kapsama (katılım) stili","Komut stili","Alıştırma stili","Problem çözme stili","Karşılıklı stil"],"d":0,"a":"Kapsama stili herkesin başarı yaşayabilmesini hedefler; farklı yükseklikte fileler ya da farklı mesafede hedefler tipik örneğidir."},{"u":9,"s":"Antrenörün soru dizisiyle sporcuyu tek bir doğru çözüme ulaştırdığı stil hangisidir?","c":["Problem çözme (ıraksayan)","Yönlendirilmiş buluş","Komut","Alıştırma","Kendini denetleme"],"d":1,"a":"Yönlendirilmiş buluşta hedef tek bir doğru çözümdür ve antrenör sporcuyu sorularla oraya taşır."},{"u":9,"s":"Yaratıcılığı en çok geliştiren, aynı probleme birden fazla doğru çözüm arayan stil hangisidir?","c":["Komut stili","Alıştırma stili","Problem çözme (ıraksayan) stili","Kendini denetleme stili","Karşılıklı stil"],"d":2,"a":"Iraksayan (problem çözme) stilinde tek doğru yoktur; sporcu birden çok geçerli çözüm üretir."},{"u":9,"s":"Mosston'un stiller spektrumunda sıralama hangi ölçüte göre yapılır?","c":["Antrenmanın süresine göre","Kararların antrenörden sporcuya devredilme derecesine göre","Sporcuların yaşına göre","Becerinin zorluğuna göre","Tesis olanaklarına göre"],"d":1,"a":"Spektrum, karar verme sorumluluğunun antrenörden öğrenene aktarılma derecesine göre öğretmen merkezliden öğrenci merkezliye doğru sıralanır."},{"u":10,"s":"Sporcunun kendi duyu organlarından (görme, kinestetik duyu) elde ettiği geri bildirim türü hangisidir?","c":["Dışsal geri bildirim","İçsel (doğal) geri bildirim","Sonuç bilgisi","Performans bilgisi","Özet geri bildirim"],"d":1,"a":"İçsel geri bildirim sporcunun kendi bedeninden gelir; hareketin nasıl hissettirdiği ve sonucun görülmesi buna dahildir."},{"u":10,"s":"Antrenörün 'dirseğin düşüktü' demesi hangi geri bildirim türüdür?","c":["Sonuç bilgisi (KR)","Performans bilgisi (KP)","İçsel geri bildirim","Özet geri bildirim","Pekiştireç"],"d":1,"a":"Hareketin yapılış biçimine ilişkin bilgi performans bilgisidir (KP). Sonuca ilişkin bilgi ise sonuç bilgisidir (KR)."},{"u":10,"s":"'Atışın 3 santim dışarı kaldı' bilgisi hangi geri bildirim türüne girer?","c":["Performans bilgisi (KP)","Sonuç bilgisi (KR)","İçsel geri bildirim","Bant genişliği geri bildirimi","Ceza"],"d":1,"a":"Hareketin sonucuna ilişkin bilgi sonuç bilgisidir (KR). Sporcu çoğu zaman bunu kendisi de görebilir."},{"u":10,"s":"Antrenörün asıl katma değeri hangi geri bildirim türünü vermesinden gelir?","c":["Sonuç bilgisi","Performans bilgisi","İçsel geri bildirim","Hiçbiri","Ceza"],"d":1,"a":"Sonucu sporcu genellikle kendi görür; hareketi nasıl yaptığını ve neyi düzeltmesi gerektiğini ise çoğu zaman göremez. Antrenörün katkısı buradadır."},{"u":10,"s":"Her denemeden sonra sürekli geri bildirim vermenin sakıncası nedir?","c":["Sporcunun güdülenmesini düşürmesi","Sporcuda geri bildirime bağımlılık yaratması","Antrenman süresini uzatması","Kaslarda yorgunluk yaratması","Hiçbir sakıncası yoktur"],"d":1,"a":"Sürekli dış geri bildirim, sporcunun kendi içsel geri bildirimini kullanmasını engeller; dönüt kesildiğinde performans düşer. Bu yüzden zamanla azaltılmalıdır."},{"u":10,"s":"Hareketin hemen ardından birkaç saniye beklenerek geri bildirim verilmesi neden yararlı olabilir?","c":["Antrenörün düşünmesine zaman tanıdığı için","Sporcunun kendi içsel geri bildirimini işlemesine fırsat verdiği için","Sporcuyu cezalandırdığı için","Hareketi unutturduğu için","Geri bildirimi gereksiz kıldığı için"],"d":1,"a":"Kısa gecikme sporcunun ne hissettiğini kendi değerlendirmesine olanak tanır; bu da öğrenmeyi derinleştirir."},{"u":10,"s":"Yalnızca hata belirli bir sınırı aştığında geri bildirim verilmesine ne ad verilir?","c":["Özet geri bildirim","Bant genişliği geri bildirimi","Eş zamanlı geri bildirim","Sonuç bilgisi","İçsel geri bildirim"],"d":1,"a":"Bant genişliği geri bildiriminde kabul edilebilir hata aralığı içindeki denemelere dönüt verilmez; bu hem bağımlılığı azaltır hem sporcuyu rahatlatır."},{"u":10,"s":"Birkaç denemenin toplu olarak değerlendirilip tek seferde verildiği geri bildirim türü hangisidir?","c":["Eş zamanlı geri bildirim","Özet geri bildirim","İçsel geri bildirim","Sonuç bilgisi","Anlık geri bildirim"],"d":1,"a":"Özet geri bildirim, deneme dizisinin sonunda toplu değerlendirme sunar ve kalıcı öğrenmeyi destekler."},{"u":10,"s":"Aşağıdakilerden hangisi geri bildirimin işlevlerinden biri DEĞİLDİR?","c":["Bilgi verme","Güdüleme","Pekiştirme","Sporcuyu cezalandırma","Hatanın düzeltilmesini sağlama"],"d":3,"a":"Geri bildirimin işlevleri bilgi verme, güdüleme ve pekiştirmedir. Cezalandırma geri bildirimin amacı değildir."},{"u":10,"s":"Bilişsel evredeki bir sporcuya geri bildirim verirken antrenör nasıl davranmalıdır?","c":["Aynı anda birçok hatayı düzeltmeli","Tek seferde tek bir noktaya odaklanmalı","Hiç geri bildirim vermemeli","Yalnızca olumsuz yönleri söylemeli","Teknik terimlerle ayrıntıya girmeli"],"d":1,"a":"Çoklu düzeltme hiçbirini düzeltmez. Yeni öğrenen sporcunun dikkat kapasitesi sınırlıdır; tek ve net bir nokta verilmelidir."},{"u":10,"s":"İyi bir geri bildirim için aşağıdakilerden hangisi doğrudur?","c":["Kişiye yönelik olmalıdır","Harekete yönelik, somut ve gözlenebilir olmalıdır","Genel ifadelerle verilmelidir","Sporcunun düzeyinden bağımsız olmalıdır","Mümkün olduğunca uzun olmalıdır"],"d":1,"a":"'Daha iyi yap' işe yaramaz; 'dizini öne al' işe yarar. Ayrıca geri bildirim sporcunun kişiliğine değil hareketine yönelmelidir."},{"u":10,"s":"Geri bildirim verilmeden yapılan çok sayıda tekrar ne sonuç doğurur?","c":["Öğrenmeyi hızlandırır","Yanlış hareket kalıbının pekişmesine yol açabilir","Kalıcılığı artırır","Transferi güçlendirir","Hiçbir etkisi olmaz"],"d":1,"a":"Doğru ile yanlışın ayırt edilmediği tekrar, hatalı kalıbı da sağlamlaştırır. Bu yüzden geri bildirimsiz tekrar güvenli değildir."},{"u":10,"s":"Hareket devam ederken verilen geri bildirime ne ad verilir?","c":["Sonlandırıcı geri bildirim","Eş zamanlı geri bildirim","Özet geri bildirim","Gecikmeli geri bildirim","İçsel geri bildirim"],"d":1,"a":"Eş zamanlı geri bildirim hareket sürerken verilir; sonlandırıcı geri bildirim ise hareket bittikten sonra verilir."},{"u":10,"s":"Motor öğrenmede alıştırmadan sonra öğrenmeyi en çok etkileyen değişken hangisidir?","c":["Tesis kalitesi","Geri bildirim","Sporcunun boyu","Antrenman saati","Seyirci sayısı"],"d":1,"a":"Alıştırma ve geri bildirim motor öğrenmenin iki temel değişkenidir; geri bildirim olmadan alıştırmanın öğretici gücü ciddi biçimde düşer."},{"u":11,"s":"Bir niteliğin gözlenip sayı ya da sembollerle ifade edilmesine ne ad verilir?","c":["Değerlendirme","Ölçme","Ölçüt","Yargılama","Test"],"d":1,"a":"Ölçme yargı içermez, yalnızca betimler: 'dikey sıçraması 42 cm' bir ölçme sonucudur."},{"u":11,"s":"Ölçme sonucunun bir ölçütle karşılaştırılarak yargıya varılmasına ne denir?","c":["Ölçme","Değerlendirme","Gözlem","Test","Puanlama"],"d":1,"a":"Değerlendirme üç öğe içerir: ölçme sonucu, ölçüt ve karar. Ölçme olmadan değerlendirme yapılamaz."},{"u":11,"s":"Değerlendirmenin üç öğesi hangisidir?","c":["Hedef – içerik – süreç","Ölçme sonucu – ölçüt – karar","Geçerlik – güvenirlik – kullanışlılık","Bilişsel – duyuşsal – psikomotor","Gözlem – test – anket"],"d":1,"a":"Bir ölçme sonucunu bir ölçütle karşılaştırıp karara varmadıkça değerlendirme yapılmış olmaz."},{"u":11,"s":"Öğretimden ÖNCE, sporcunun hazırbulunuşluğunu belirlemek için yapılan değerlendirme türü hangisidir?","c":["Biçimlendirme–izleme","Düzey belirleme","Tanıma–yerleştirme","Sonuç değerlendirme","Bağıl değerlendirme"],"d":2,"a":"Tanıma–yerleştirme değerlendirmesi süreç başlamadan yapılır; sporcunun nereden başlayacağını ve hangi gruba gireceğini belirler."},{"u":11,"s":"Öğretim SÜRERKEN eksikleri görüp süreci düzeltmek amacıyla yapılan değerlendirme hangisidir?","c":["Tanıma–yerleştirme","Biçimlendirme–izleme","Düzey belirleme","Bağıl değerlendirme","Mutlak değerlendirme"],"d":1,"a":"Biçimlendirme–izleme (formatif) değerlendirme süreç içinde yapılır ve amacı not vermek değil, öğretimi düzeltmektir."},{"u":11,"s":"Öğretimin SONUNDA ulaşılan düzeye karar vermek için yapılan değerlendirme hangisidir?","c":["Tanıma–yerleştirme","Biçimlendirme–izleme","Düzey belirleme","Ön değerlendirme","Süreç değerlendirmesi"],"d":2,"a":"Düzey belirleme (summatif) değerlendirme sonuç odaklıdır; belgelendirme ve seçme kararlarında kullanılır."},{"u":11,"s":"Bir ölçme aracının 'ölçmek istediği özelliği ölçebilmesi' niteliği hangisidir?","c":["Güvenirlik","Geçerlik","Kullanışlılık","Objektiflik","Duyarlık"],"d":1,"a":"Geçerlik, aracın doğru şeyi ölçmesidir. Esnekliği ölçmek isterken kuvvet ölçen bir test güvenilir olsa bile geçersizdir."},{"u":11,"s":"Bir ölçme aracının tekrarlanan ölçümlerde tutarlı sonuç vermesi hangi niteliktir?","c":["Geçerlik","Güvenirlik","Kullanışlılık","Ekonomiklik","Nesnellik"],"d":1,"a":"Güvenirlik tutarlılıktır. Bir araç güvenilir olabilir ama yanlış şeyi ölçüyorsa geçerli değildir."},{"u":11,"s":"Ölçme aracında bulunması gereken üç temel nitelik hangisidir?","c":["Geçerlik – güvenirlik – kullanışlılık","Hedef – içerik – süreç","Ölçme – ölçüt – karar","Bilişsel – duyuşsal – devinişsel","Hız – kuvvet – dayanıklılık"],"d":0,"a":"Bir ölçme aracı doğru şeyi ölçmeli (geçerlik), tutarlı ölçmeli (güvenirlik) ve uygulanabilir olmalıdır (kullanışlılık)."},{"u":11,"s":"Sporcunun sonucunun grubun ortalamasına göre yorumlanması hangi ölçüt türüdür?","c":["Mutlak ölçüt","Bağıl (göreli) ölçüt","Geçerli ölçüt","Nesnel ölçüt","Duyuşsal ölçüt"],"d":1,"a":"Bağıl ölçütte birey grupla karşılaştırılır. Mutlak ölçütte ise önceden belirlenmiş sabit bir değere göre karar verilir."},{"u":11,"s":"Bloom'un hedef alanlarından 'devinişsel' alan neyi kapsar?","c":["Bilgi ve zihinsel becerileri","İlgi, tutum ve değerleri","Beceri ve hareketleri","Yalnızca hafızayı","Yalnızca sosyal ilişkileri"],"d":2,"a":"Devinişsel (psikomotor) alan hareket ve beceriyi kapsar. Bilişsel alan bilgiyi, duyuşsal alan tutum ve değerleri kapsar."},{"u":11,"s":"Sporcunun spora karşı olumlu tutum geliştirmesi hangi hedef alanına girer?","c":["Bilişsel alan","Duyuşsal alan","Devinişsel alan","Sosyal alan","Fiziksel alan"],"d":1,"a":"İlgi, tutum, değer ve alışkanlıklar duyuşsal alanın konusudur; sporda kalma davranışının temeli budur."},{"u":11,"s":"Bir antrenman planının dört temel öğesi hangileridir?","c":["Isınma – ana bölüm – soğuma – değerlendirme","Hedef – içerik – öğretme-öğrenme süreci – ölçme ve değerlendirme","Geçerlik – güvenirlik – kullanışlılık – ekonomiklik","Bilişsel – duyuşsal – devinişsel – sosyal","Strateji – yöntem – teknik – araç"],"d":1,"a":"Planın dört öğesi neyi (hedef), ne ile (içerik), nasıl (süreç) ve ne kadar başardığımızı (ölçme–değerlendirme) belirler."},{"u":11,"s":"Bir antrenmanın hazırlık (ısınma) bölümünün amacı nedir?","c":["Günün hedefine ulaşmak","Organizmayı yüklenmeye hazırlamak ve sakatlığı önlemek","Toparlanmayı hızlandırmak","Değerlendirme yapmak","Ölçme yapmak"],"d":1,"a":"Hazırlık bölümü dolaşımı ve kas ısısını yükselterek organizmayı ana bölümdeki yüklenmeye hazırlar; dikkati de toplar."},{"u":11,"s":"Antrenmanın bitiş (soğuma) bölümünde aşağıdakilerden hangisi yapılır?","c":["En yüksek şiddetli çalışma","Hafif koşu, germe ve günün kısa değerlendirmesi","Yeni beceri öğretimi","Maksimal kuvvet testi","Yarışma"],"d":1,"a":"Bitiş bölümü toparlanmayı hızlandırır ve gün içinde öğrenilenlerin kısaca değerlendirilmesine fırsat verir."},{"u":11,"s":"Hedefin gözlenebilir ve ölçülebilir biçimde ifade edilmiş hâline ne ad verilir?","c":["İçerik","Davranış (kazanım)","Ölçüt","Strateji","Yöntem"],"d":1,"a":"Hedef genel niyeti, davranış ise bu niyetin gözlenebilir karşılığını belirtir: 'beş denemeden dördünde doğru teknikle pas verir' bir davranış ifadesidir."},{"u":11,"s":"Geçerlik kavramının en doğru tanımı aşağıdakilerden hangisidir?","c":["Ölçme aracının tekrarlanan ölçümlerde tutarlı sonuç vermesi","Ölçme aracının, ölçmek istediği özelliği başka özelliklerle karıştırmadan ölçebilmesi","Ölçme aracının kolay uygulanabilir olması","Ölçme sonucunun bir ölçütle karşılaştırılması","Ölçme aracının ucuz olması"],"d":1,"a":"Geçerlikte iki nokta vardır: doğru özelliği ölçmek ve araya başka özelliklerin karışmaması. Tutarlılık güvenirlik, uygulanabilirlik ise kullanışlılıktır."},{"u":11,"s":"Geçerlik ile güvenirlik arasındaki ilişki için aşağıdakilerden hangisi doğrudur?","c":["Güvenilir olan her araç geçerlidir","Geçerli olan bir araç mutlaka güvenilirdir, ancak güvenilir olan her araç geçerli değildir","Geçerlik ile güvenirlik arasında ilişki yoktur","Güvenirlik geçerlikten sonra aranır","Geçerli bir araç güvenilir olmayabilir"],"d":1,"a":"Güvenirlik geçerliğin ön koşuludur ama yeterli değildir. Ayarı bozuk ama hep aynı değeri veren tartı güvenilirdir, geçerli değildir. Tutarsız ölçen bir araç ise geçerli olamaz."},{"u":11,"s":"Ayarı bozuk olduğu hâlde her tartımda aynı değeri gösteren bir tartı için ne söylenebilir?","c":["Hem geçerli hem güvenilirdir","Güvenilirdir ama geçerli değildir","Geçerlidir ama güvenilir değildir","Ne geçerli ne güvenilirdir","Kullanışlı değildir"],"d":1,"a":"Tutarlı sonuç verdiği için güvenilirdir; ancak gerçek ağırlığı ölçmediği için geçersizdir. Bu örnek güvenirliğin tek başına yetmediğini gösterir."},{"u":11,"s":"Bir sınavın öğretilen konuların tamamını temsil edip etmediğiyle ilgili geçerlik türü hangisidir?","c":["Yapı geçerliği","Kapsam (içerik) geçerliği","Ölçüt geçerliği","Görünüş geçerliği","Yordama geçerliği"],"d":1,"a":"Kapsam geçerliği, soruların hedeflenen içerik ve davranış alanını dengeli biçimde temsil etmesidir. Beş üniteden yalnız birinden soru sormak bu geçerliği düşürür."},{"u":11,"s":"Bir ölçme aracının, iddia ettiği kuramsal özelliği gerçekten ölçüp ölçmediğiyle ilgili geçerlik türü hangisidir?","c":["Kapsam geçerliği","Yapı geçerliği","Görünüş geçerliği","Uygunluk geçerliği","Yordama geçerliği"],"d":1,"a":"Yapı geçerliği, aracın ölçtüğünü iddia ettiği soyut özelliği (kaygı, güdülenme, esneklik) gerçekten ölçüp ölçmediğini sorgular."},{"u":11,"s":"Bir seçme sınavının, sporcuların ileride göstereceği başarıyı ne ölçüde kestirebildiğini gösteren geçerlik türü hangisidir?","c":["Kapsam geçerliği","Görünüş geçerliği","Yordama (kestirim) geçerliği","Yapı geçerliği","Uygunluk geçerliği"],"d":2,"a":"Yordama geçerliği, ölçme sonucunun gelecekteki bir ölçütle ilişkisine bakar. Uygunluk geçerliği ise eş zamanlı kabul görmüş bir ölçümle uyuşmayı inceler."},{"u":11,"s":"Aşağıdaki geçerlik türlerinden hangisi en zayıf kabul edilir ve tek başına kanıt sayılmaz?","c":["Kapsam geçerliği","Yapı geçerliği","Ölçüt geçerliği","Görünüş geçerliği","Yordama geçerliği"],"d":3,"a":"Görünüş geçerliği, aracın ölçtüğü şeyi ölçüyormuş gibi görünmesidir; yalnızca bir izlenimdir. Bir test inandırıcı görünüp geçersiz olabilir."},{"u":11,"s":"Aerobik dayanıklılığı 30 metre sürat testiyle ölçmeye çalışan bir antrenör hangi hatayı yapmıştır?","c":["Güvenirliği düşürmüştür","Geçerliği düşürmüştür; test dayanıklılığı değil sürati ölçmektedir","Kullanışlılığı azaltmıştır","Ölçüt belirlememiştir","Hiçbir hata yoktur"],"d":1,"a":"Araç tutarlı sonuç verse bile ölçmek istenen özelliği ölçmüyorsa geçersizdir. Ölçülen nitelik ile araç arasındaki uyumsuzluk doğrudan geçerlik sorunudur."},{"u":11,"s":"Bir sınavda soruların ağdalı ve karmaşık bir dille yazılması geçerliği nasıl etkiler?","c":["Etkilemez","Düşürür; konu bilgisi yerine okuduğunu anlama ölçülmeye başlar","Yükseltir; sorular zorlaşır","Yalnızca güvenirliği etkiler","Yalnızca kullanışlılığı etkiler"],"d":1,"a":"Araya başka bir özelliğin karışması geçerliği düşürür. Konu bilgisini ölçmek isterken okuduğunu anlama becerisini ölçen bir sınav amacına hizmet etmiyor demektir."},{"u":11,"s":"Sporcunun beceri düzeyini yazılı sınavla ölçmeye çalışmak neden geçersizdir?","c":["Yazılı sınav güvenilir değildir","Beceri devinişsel (psikomotor) alandadır; yazılı sınav bilişsel alanı ölçer","Yazılı sınav kullanışsızdır","Ölçüt belirlenemez","Süre yetersiz kalır"],"d":1,"a":"Hedef alanı ile ölçme aracı uyuşmalıdır. Beceri uygulamalı olarak, bilgi ise yazılı olarak ölçülür; alan uyuşmazlığı geçerliği yok eder."},{"u":11,"s":"Geçerlik için aşağıdakilerden hangisi doğrudur?","c":["Bir araç genel olarak geçerli ya da geçersizdir","Geçerlik belirli bir amaç ve grup için söz konusudur, ayrıca derece meselesidir","Geçerlik yalnızca yazılı sınavlarda aranır","Geçerlik ölçme yapılmadan belirlenir","Geçerlik güvenirlikten bağımsızdır"],"d":1,"a":"Hiçbir araç mutlak anlamda geçerli değildir. Yetişkin için geçerli bir test çocuk için geçersiz olabilir; ayrıca geçerlik var/yok değil, az/çok meselesidir."},{"u":12,"s":"Çağdaş antrenörlük anlayışının merkezinde ne vardır?","c":["Kazanma","Sporcunun bütünsel gelişimi","Kulüp geliri","Antrenörün kariyeri","Seyirci beklentisi"],"d":1,"a":"Sporcu merkezli antrenörlükte öncelik sporcunun gelişimi, sağlığı ve sporda kalmasıdır; kazanmak bunun sonucudur, amacı değil."},{"u":12,"s":"Tüm kararları kendi veren, sporcuya yalnızca uygulama rolü bırakan antrenörlük yaklaşımı hangisidir?","c":["Demokratik","Otokratik","Bütünsel (holistik)","İşbirlikçi","Sporcu merkezli"],"d":1,"a":"Otokratik yaklaşım hızlı düzen sağlar ama sporcuda sorumluluk ve özgüven gelişimini engeller."},{"u":12,"s":"Antrenörün doğrudan yönlendirmeyi bırakıp ortamı kurduğu, sorumluluğu sporcuya devrettiği ve sporcuyu bütün bir birey olarak ele aldığı stil hangisidir?","c":["Otokratik","Demokratik","Bütünsel (holistik)","Komut stili","Kapsama stili"],"d":2,"a":"Bütünsel stilde antrenör kararı büyük ölçüde sporcuya devreder ve onu yalnız performansıyla değil bir birey olarak ele alır. Olgun sporcuda özerklik ve öz düzenleme geliştirir; sorumluluk almaya hazır olmayan sporcuda ise yapı kaybolabilir."},{"u":12,"s":"Sporcunun karar süreçlerine katıldığı antrenörlük yaklaşımının temel kazancı nedir?","c":["Antrenmanın kısalması","İçsel güdülenme ve bağlılığın artması","Disiplinin ortadan kalkması","Ölçmenin kolaylaşması","Yarışma sayısının artması"],"d":1,"a":"Demokratik yaklaşımda sporcu sürecin öznesi olur; bu içsel güdülenmeyi ve spora bağlılığı artırır. Karşılığında daha çok zaman gerektirir."},{"u":12,"s":"Bireyin spora nasıl başladığını, sürdürdüğünü ve bıraktığını inceleyen alan hangisidir?","c":["Spor yönetimi","Sporda sosyalleşme","Spor fizyolojisi","Biyomekanik","Antrenman bilimi"],"d":1,"a":"Sporda sosyalleşme; spora katılım, spor yoluyla sosyalleşme ve spordan ayrılma boyutlarını inceler."},{"u":12,"s":"Sporun bireye kurala uyma, işbirliği ve öz denetim kazandırması hangi boyutla açıklanır?","c":["Spora sosyalleşme","Spor yoluyla sosyalleşme","Spordan ayrılma","Yetenek seçimi","Uzmanlaşma"],"d":1,"a":"Spor yoluyla sosyalleşme, sporun bireye kazandırdığı toplumsal değer ve davranışları ifade eder."},{"u":12,"s":"Çocuğun spora katılımında en güçlü etken genellikle hangisidir?","c":["Medya","Aile","Tesis sayısı","Antrenörün ünvanı","Ekonomik durum"],"d":1,"a":"Önemli diğerleri arasında çocuk için ilk ve en etkili olan ailedir; ailenin tutumu spora başlamayı da sürdürmeyi de belirler."},{"u":12,"s":"Aşağıdakilerden hangisi spordan kopmanın (bırakmanın) başlıca nedenlerinden biri DEĞİLDİR?","c":["Eğlencenin bitmesi","Aşırı kazanma baskısı","Erken uzmanlaşma ve tükenmişlik","Oynama süresi bulamama","Antrenörün sporcuya söz hakkı vermesi"],"d":4,"a":"Sporcuya söz hakkı vermek bağlılığı artırır. Diğer maddeler ise spordan kopmanın en sık nedenleridir ve çoğu antrenörün denetimindedir."},{"u":12,"s":"Erken uzmanlaşmanın başlıca riski nedir?","c":["Hareket dağarcığının genişlemesi","Sakatlık, tükenmişlik ve spordan erken kopma","Transferin artması","Kalıcılığın artması","Motivasyonun yükselmesi"],"d":1,"a":"Tek dala erken yönelme, hareket dağarcığını daraltır; tekrarlayan yüklenme sakatlığı ve tükenmişliği artırarak sporu bırakmaya yol açar."},{"u":12,"s":"Antrenörlüğün deneyime dayalı bir uğraş olmaktan çıkıp bilimsel temelli, eğitim ve belge gerektiren bir alana dönüşmesi hangi kavramla adlandırılır?","c":["Sosyalleşme","Profesyonelleşme","Uzmanlaşma","Kurumsallaşma","Bireyselleşme"],"d":1,"a":"Profesyonelleşme, mesleğin tanımlı bilgi tabanı, eğitim yolu, belgelendirme ve etik kuralları olan bir alana dönüşmesidir."},{"u":12,"s":"Çocuk sporunda başarının temel ölçütü ne olmalıdır?","c":["Kazanılan kupa sayısı","Katılımın ve spora bağlılığın sürmesi","Rakiplerin elenmesi","Antrenman saatinin çokluğu","Erken uzmanlaşma"],"d":1,"a":"Çocuk sporunda kısa vadeli derece uzun vadeli gelişimi gölgelememelidir; başarı, çocuğun sporda kalması ve gelişmeye devam etmesidir."},{"u":12,"s":"Aşağıdakilerden hangisi antrenörün rollerinden biri DEĞİLDİR?","c":["Öğretici","Model ve lider","Güdüleyici","Sporcunun sağlık raporunu düzenleyen hekim","Yönetici ve planlayıcı"],"d":3,"a":"Antrenör öğretici, eğitici, model, lider, yönetici, güdüleyici ve iletişimcidir; ancak tıbbi tanı ve rapor hekimin yetkisindedir."},{"u":12,"s":"Spora katılımın gelişimsel modelinde 'özgüven kazanma' aşaması aşağıdakilerden hangisini içerir?","c":["Spor tesislerinde güvenlik önlemlerinin artırılması","Sporcuların halka açık etkinliklerde yer alması","Sporculardan ekip ruhuna uygun davranışlar beklenmesi","Rekabetçi deneyimlerin yaşanması","Sporcunun başarılarının övgüyle karşılanması"],"d":4,"a":"Özgüven, başarının görülüp övgüyle karşılanmasıyla beslenir; bu, özgüvenin kaynaklarından sözel iknaya karşılık gelir. Rekabetçi deneyimler daha ileri bir aşamanın işidir; ekip ruhu sosyal gelişimin, tesis güvenliği ise işletmenin konusudur."},{"u":12,"s":"Özgüvenin en güçlü kaynağı aşağıdakilerden hangisidir?","c":["Sporcunun kendi başarı deneyimleri","Antrenörün sözel ikna etmesi","Başkalarının başarısını izlemek","Tesis olanaklarının iyi olması","Yarışma sayısının çokluğu"],"d":0,"a":"Özgüvenin dört kaynağı vardır: başarı deneyimi, başkalarının deneyimi, sözel ikna ve duygusal durum. Bunların en güçlüsü sporcunun kendi başardığı işlerdir; söz, yaşanmış başarının yerini tutmaz."},{"u":12,"s":"Özgüveni henüz oturmamış bir sporcunun doğrudan yoğun rekabet ortamına sokulması neden sakıncalıdır?","c":["Yarışma sayısını azalttığı için","Başarısızlık deneyimi özgüveni kazandırmak yerine zedelediği için","Antrenman süresini uzattığı için","Ölçmeyi güçleştirdiği için","Ekip ruhunu artırdığı için"],"d":1,"a":"Özgüven başarı deneyimiyle kurulur. Hazır olmayan sporcunun rekabette yaşadığı yenilgi, kazandırmak istenen inancı tersine çevirir; bu yüzden rekabet sonraki aşamaya bırakılır."},{"u":12,"s":"Antrenörün övgüsü sporcunun özgüvenini en çok hangi durumda güçlendirir?","c":["Yalnızca yarışma kazanıldığında verildiğinde","Sporcunun çabasına ve gelişimine yöneltildiğinde","Herkese aynı biçimde ve sürekli verildiğinde","Yalnızca en yetenekli sporcuya verildiğinde","Sonuç kötü olduğunda hiç verilmediğinde"],"d":1,"a":"Sonuca yöneltilen övgü, sporcunun denetiminde olmayan bir şeyi pekiştirir ve yenilgide çöker. Çabaya ve gelişime yöneltilen övgü ise sporcunun kendi denetimindeki şeyi güçlendirir; bu yüzden kalıcı özgüven üretir."},{"u":13,"s":"Uzun Süreli Sporcu Gelişim Modelinde performans geliştirme aşaması aşağıdakilerden hangisini içerir?","c":["Sporcunun motivasyonunun artırılması","Yaralanma önleme stratejilerinin uygulanması","Teknik detayların mükemmelleştirilmesi","Oyun stratejilerinin geliştirilmesi","Fizyolojik adaptasyonun teşvik edilmesi"],"d":3,"a":"Performans geliştirme aşaması, sporcunun yarışma ortamına hazırlandığı evredir; burada oyun ve taktik stratejileri geliştirilir. Fizyolojik adaptasyon bir ÖNCEKİ aşamanın (antrenman için antrenman), teknik detayların mükemmelleştirilmesi ise bir SONRAKİ aşamanın (kazanmak için antrenman) işidir. Motivasyon ve yaralanma önleme her aşamada geçerli olduğu için aşamayı ayırt etmez."},{"u":13,"s":"Uzun Süreli Sporcu Gelişim Modelinin temel mantığı nedir?","c":["Sporcuyu en kısa sürede yarışmaya hazırlamak","Her aşamanın kendine özgü önceliği olduğunu ve sıranın bozulmaması gerektiğini kabul etmek","Tüm yaş gruplarına aynı programı uygulamak","Yalnızca elit sporcuları kapsamak","Yetenekli olmayanları erken elemek"],"d":1,"a":"Model, gelişimi yaşam boyuna yayar; bir aşamanın işi ne ertelenebilir ne de öne çekilebilir. Erken uzmanlaşmanın temel eleştirisi de budur."},{"u":13,"s":"LTAD modelinde temel hareket becerilerinin (koşma, atlama, atma, yakalama) oyun ağırlıklı biçimde kazandırıldığı aşama hangisidir?","c":["Aktif başlangıç","Temeller (eğlenceli temeller)","Performans geliştirme","Elit performans","Aktif yaşam"],"d":1,"a":"Temeller aşamasında amaç geniş bir hareket dağarcığı kurmaktır; branşa özgü teknik değil, temel beceri çeşitliliği önceliklidir."},{"u":13,"s":"LTAD modelinde teknik detayların mükemmelleştirilmesi ve yarışma yönetimi hangi aşamanın işidir?","c":["Aktif başlangıç","Temeller","Öğrenmeyi öğrenme","Elit performans (kazanmayı öğrenme)","Aktif yaşam"],"d":3,"a":"Teknik ince ayar ve taktik incelik, fizyolojik alt yapı kurulduktan sonra elit aşamada ele alınır."},{"u":13,"s":"LTAD modelinde sporcunun birden çok branşı denemesi ve genel spor becerileri kazanması hangi aşamada beklenir?","c":["Öğrenmeyi öğrenme","Elit performans","Performans geliştirme","Aktif yaşam","Aktif başlangıç"],"d":0,"a":"Öğrenmeyi öğrenme aşamasında sporcu genel spor becerilerini edinir ve farklı branşlar dener; bu çeşitlilik ileride olumlu transfer sağlar."},{"u":13,"s":"LTAD modelinin son aşaması olan 'aktif yaşam' neyi ifade eder?","c":["Elit düzeyde yarışmayı sürdürmek","Yarışmayı bıraktıktan sonra da fiziksel etkinliğe bağlı kalmak","Antrenörlüğe geçmek","Uzmanlaşmayı tamamlamak","Yeni bir branşa başlamak"],"d":1,"a":"Modelin amacı yalnız şampiyon üretmek değil, bireyi yaşam boyu hareketli tutmaktır. Aktif yaşam bu hedefin karşılığıdır."},{"u":13,"s":"Bir soruda 'motivasyonun artırılması' ve 'yaralanma önleme' seçenekleri LTAD aşamalarını ayırt etmek için neden yetersizdir?","c":["Modelde yer almadıkları için","Her aşamada geçerli genel ilkeler oldukları için","Yalnızca elit sporcuyu ilgilendirdikleri için","Ölçülemedikleri için","Yalnızca çocuklar için geçerli oldukları için"],"d":1,"a":"Tüm aşamalarda geçerli olan bir madde tek bir aşamanın ayırt edici özelliği olamaz. Sınavda bu tür 'her yere uyan' seçenekler tipik çeldiricidir."},{"u":13,"s":"LTAD modeline göre erken uzmanlaşma neden sakıncalıdır?","c":["Sporcunun motivasyonunu artırdığı için","Aşamaların sırasını bozarak temel hareket alt yapısını eksik bıraktığı için","Yarışma sayısını azalttığı için","Antrenör sayısını artırdığı için","Fizyolojik adaptasyonu hızlandırdığı için"],"d":1,"a":"Erken uzmanlaşma, temel beceri ve genel gelişim aşamalarını atlayarak dar bir alt yapı üzerine performans kurar; sakatlık, tükenmişlik ve erken kopmayla sonuçlanır."},{"u":13,"s":"LTAD modelinde 'aktif başlangıç' aşamasının önceliği nedir?","c":["Branş tekniği öğretmek","Hareketi sevdirmek ve günlük fiziksel etkinlik alışkanlığı kazandırmak","Yarışmaya hazırlamak","Kuvvet antrenmanına başlamak","Yetenek seçimi yapmak"],"d":1,"a":"0–6 yaş aralığında amaç performans değil, harekete karşı olumlu tutum ve düzenli etkinlik alışkanlığıdır."},{"u":13,"s":"Ergenlik döneminde sistemli yüklenmeyle aerobik kapasite ve kuvvetin geliştirilmesi LTAD'ın hangi aşamasına denk gelir?","c":["Temeller","Öğrenmeyi öğrenme","Antrenman için antrenman","Aktif yaşam","Aktif başlangıç"],"d":2,"a":"Antrenman için antrenman aşamasında sporcunun fizyolojik kapasitesi kurulur; bu aşama atlanırsa üst düzey performansın dayanacağı zemin oluşmaz. Bir sonraki aşama olan performans geliştirme (yarışmak için antrenman) ise oyun ve taktik stratejilerine ayrılır."},{"u":13,"s":"Uzun Süreli Sporcu Gelişim Modeli kaç aşamadan oluşur ve son aşaması hangisidir?","c":["Beş aşama; son aşama kazanmak için antrenman","Yedi aşama; son aşama aktif yaşam","Üç aşama; son aşama özelleşme","Dört aşama; son aşama yarışmak için antrenman","Altı aşama; son aşama elit performans"],"d":1,"a":"Model yedi aşamalıdır ve aktif başlangıçla başlayıp aktif yaşamla biter. Son aşamanın yarışma değil yaşam boyu hareketlilik olması, modelin amacını özetler."},{"u":13,"s":"LTAD modelinde branşa özelleşme, yarışma deneyimi ve bireysel güçlü yönlerin geliştirilmesi hangi aşamanın işidir?","c":["Temeller","Öğrenmeyi öğrenme","Antrenman için antrenman","Yarışmak için antrenman","Aktif başlangıç"],"d":3,"a":"Yarışmak için antrenman aşamasında sporcu artık bir branşa yönelir ve yarışma ortamına uyum sağlar. Fizyolojik alt yapı bir önceki aşamada kurulmuştur."},{"u":13,"s":"Temel hareket becerileri ile temel spor becerilerinin birlikte kazanılmış olmasına ne ad verilir?","c":["Fiziksel uygunluk","Fiziksel okuryazarlık","Motor kapasite","Antrenman yaşı","Biyolojik olgunluk"],"d":1,"a":"Fiziksel okuryazarlık, sporun alfabesidir: bu temel olmadan hiçbir branşta ilerlenemez. LTAD'ın ilk üç aşamasının hedefi budur."},{"u":13,"s":"Bir sporcunun bedeninin gerçek olgunlaşma düzeyini gösteren yaş kavramı hangisidir?","c":["Kronolojik yaş","Biyolojik yaş","Antrenman yaşı","Takvim yaşı","Yasal yaş"],"d":1,"a":"Kronolojik (takvim) yaş doğum tarihine dayanır ve gelişim düzeyini göstermez. Antrenman biyolojik yaşa göre planlanmalıdır; aynı sınıftaki iki çocuk arasında yıllarca fark olabilir."},{"u":13,"s":"Yirmi beş yaşında olup sistemli antrenmana yeni başlamış bir sporcu için aşağıdakilerden hangisi doğrudur?","c":["Kronolojik yaşı düşüktür","Antrenman yaşı düşüktür, başlangıç aşamasına uygun program almalıdır","Biyolojik yaşı düşüktür","Doğrudan elit programa alınmalıdır","Fiziksel okuryazarlığı tamamdır"],"d":1,"a":"Antrenman yaşı, sporcunun kaç yıldır sistemli çalıştığını gösterir. Kronolojik olarak yetişkin olması, antrenman geçmişi olmadan ileri düzey yüklenmeyi kaldırabileceği anlamına gelmez."},{"u":13,"s":"LTAD modelinde antrenman pencerelerinin zamanlaması hangi döneme göre ayarlanır?","c":["Doğum tarihine","Okula başlama yaşına","En hızlı boy uzama dönemine (PHV)","Yarışma takvimine","Kulübe kayıt tarihine"],"d":2,"a":"PHV (peak height velocity), ergenlikteki en hızlı boy uzama anıdır; kızlarda yaklaşık 12, erkeklerde 14 yaş civarında görülür ve gelişim pencerelerinin referans noktasıdır."},{"u":13,"s":"Bir motorik özelliğin antrenmana en çok yanıt verdiği döneme ne ad verilir?","c":["Plato","Duyarlı (kritik) pencere","Adaptasyon eşiği","Süperkompanzasyon","Antrenman yaşı"],"d":1,"a":"Duyarlı pencereler, o özelliğin en verimli geliştiği zaman aralıklarıdır. Pencere kaçırıldığında özellik yine gelişir ama aynı düzeye ulaşmaz."},{"u":13,"s":"LTAD modeline göre beceri (teknik) öğretiminin en verimli olduğu dönem hangisidir?","c":["PHV'den sonra","Çocukluk döneminde, PHV'den önce","Erken yetişkinlikte","Yalnızca elit aşamada","Aktif yaşam aşamasında"],"d":1,"a":"Beceri penceresi PHV'den önce, yaklaşık 8–12 yaş arasında açılır. Bu dönemde kazandırılmayan teknik sonradan aynı düzeye getirilemez."},{"u":13,"s":"LTAD modeline göre kuvvet penceresi ne zaman açılır?","c":["Doğumdan hemen sonra","Okul öncesi dönemde","PHV'den sonra; kızlarda adet döngüsünün başlamasıyla, erkeklerde PHV'den 12–18 ay sonra","Beceri penceresiyle aynı anda","Elit aşamada"],"d":2,"a":"Kuvvet gelişimi hormonal olgunlaşmaya bağlıdır ve bu yüzden en son açılan penceredir. Sıra şudur: önce beceri, sonra dayanıklılık, en son kuvvet."},{"u":13,"s":"Aşağıdakilerden hangisi erken özelleşen spor dallarından biridir?","c":["Futbol","Atletizm","Artistik jimnastik","Kürek","Güreş"],"d":2,"a":"Artistik jimnastik, artistik buz pateni, dalış ve masa tenisi erken özelleşen sporlardır; karmaşık beceriler olgunlaşma öncesinde kazanılmak zorundadır."},{"u":13,"s":"Geç özelleşen spor dallarında özelleşmenin ergenlik sonrasına bırakılmasının temel gerekçesi nedir?","c":["Antrenör sayısının yetersiz olması","Erken özelleşmenin sakatlık, tükenmişlik ve spordan erken kopma doğurması","Yarışma takviminin geç başlaması","Tesislerin yetersiz olması","Yasal zorunluluk"],"d":1,"a":"Sporların büyük çoğunluğu geç özelleşendir. Erken özelleşme geniş hareket alt yapısını kurmadan performans zorlar; bedeli sakatlık ve kopmadır."},{"u":13,"s":"LTAD modelinde elit düzeye ulaşmak için öngörülen ölçüt aşağıdakilerden hangisidir?","c":["3 yıl / 1.000 saat","5 yıl / 5.000 saat","10 yıl / 10.000 saat nitelikli antrenman","15 yıl / 20.000 saat","Süre önemli değildir, yetenek belirleyicidir"],"d":2,"a":"On yıl ve on bin saat kuralı, elit performansın kısa yoldan üretilemeyeceğini anlatır. Yetenek tek başına yeterli değildir; sistemli ve uzun süreli antrenman şarttır."},{"u":13,"s":"LTAD modeline göre çocuk ve erken gelişim aşamalarında antrenman–yarışma dengesi nasıl olmalıdır?","c":["Ağırlık yarışmada olmalı (%70–80 yarışma)","Ağırlık antrenmanda olmalı (yaklaşık %70–80 antrenman)","İkisi tam eşit olmalı","Yalnızca yarışma yapılmalı","Yalnızca antrenman yapılmalı, yarışma hiç olmamalı"],"d":1,"a":"Erken aşamalarda gelişim antrenmanla sağlanır; yarışmanın payı aşama ilerledikçe artar."},{"u":13,"s":"LTAD modelinde ilk üç aşamanın (aktif başlangıç, temeller, öğrenmeyi öğrenme) ortak hedefi nedir?","c":["Yarışma derecesi elde etmek","Fiziksel okuryazarlık kazandırmak","Branşa özelleşmek","Kuvvet geliştirmek","Yetenek seçimi yapmak"],"d":1,"a":"İlk üç aşama sporun alfabesini öğretir: temel hareket ve temel spor becerileri. Bu blok tamamlanmadan performans aşamalarına geçilmesi doğru değildir."},{"u":13,"s":"Aynı yaş grubundaki iki sporcunun antrenmana verdiği tepkinin çok farklı olmasının LTAD modelindeki açıklaması nedir?","c":["Kronolojik yaşlarının farklı olması","Biyolojik yaşlarının (olgunlaşma düzeylerinin) farklı olması","Yarışma sayılarının farklı olması","Tesis olanaklarının farklı olması","Antrenör sayısının farklı olması"],"d":1,"a":"Aynı takvim yaşındaki çocukların biyolojik olgunluğu yıllarca farklı olabilir. Bu yüzden yüklenme takvim yaşına değil olgunlaşma düzeyine göre ayarlanır."},{"u":15,"s":"Çabukluk gelişimini desteklemek için aşağıdakilerden hangisi daha çok önerilir?","c":["Dayanıklılık antrenmanları yapmak","Ağırlık kaldırma egzersizleri yapmak","Hız ve çeviklik egzersizleri yapmak","Esneme egzersizleri yapmak","Koordinasyon egzersizleri yapmak"],"d":2,"a":"Çabukluk sürat ailesinden bir özelliktir ve en doğrudan hız ile çeviklik çalışmalarıyla gelişir. Dayanıklılık ters yönde çalışır, ağırlık maksimal kuvveti, esneme hareketliliği geliştirir. Koordinasyon dolaylı katkı sağlar ama hedefi doğrudan çalıştırmaz."},{"u":15,"s":"Aşağıdakilerden hangisi biyomotor (kondisyonel) özelliklerden biri DEĞİLDİR?","c":["Kuvvet","Sürat","Dayanıklılık","Hareketlilik","Güdülenme"],"d":4,"a":"Güdülenme psikolojik bir özelliktir. Biyomotor özellikler kuvvet, sürat, dayanıklılık ve hareketliliktir; çoğu sınıflamada koordinasyon da bunlara eklenir."},{"u":15,"s":"Bir mesafeyi en kısa sürede alabilme yetisi hangisidir?","c":["Çabukluk","Sürat","Çeviklik","Kuvvette devamlılık","Hareketlilik"],"d":1,"a":"Sürat mesafe ve zamanla ölçülür. Çabukluk tek bir hareketin hızıdır, mesafe içermez; çeviklik ise yön değiştirmeyi kapsar."},{"u":15,"s":"Tek bir hareketi ya da vücut bölümünü en kısa sürede harekete geçirebilme yetisi hangisidir?","c":["Sürat","Çabukluk","Dayanıklılık","Maksimal kuvvet","Aktif hareketlilik"],"d":1,"a":"Çabuklukta mesafe yoktur, tek hareketin hızı vardır: boksörün yumruğu, kalecinin ele uzanması. Sürat ise mesafe kat etmeyi gerektirir."},{"u":15,"s":"Yön değiştirerek hızlı hareket edebilme yetisi hangisidir?","c":["Sürat","Çeviklik","Kuvvette devamlılık","Aerobik dayanıklılık","Pasif hareketlilik"],"d":1,"a":"Çeviklik süratin yanında koordinasyon, denge ve karar vermeyi de gerektirir; bu yüzden yalnız fiziksel değil aynı zamanda bilişsel bir yetidir."},{"u":15,"s":"Çeviklik ile yön değiştirme hızı arasındaki temel fark nedir?","c":["Çeviklik öngörülemeyen bir uyarana göre yapılır, yön değiştirme hızı önceden planlanmış rotada ölçülür","Çeviklik yalnızca çocuklarda görülür","Yön değiştirme hızı kondisyonel değildir","İkisi aynı kavramdır","Çeviklikte hız önemsizdir"],"d":0,"a":"Koni parkurunu ezbere koşmak yön değiştirme hızıdır. Rakip sağa kaçtığında ona göre dönmek çevikliktir; içinde algı ve karar verme vardır."},{"u":15,"s":"Kuvveti kısa sürede ortaya koyabilme yetisine ne ad verilir?","c":["Maksimal kuvvet","Çabuk (patlayıcı) kuvvet","Kuvvette devamlılık","Statik kuvvet","Genel kuvvet"],"d":1,"a":"Çabuk kuvvet, kuvvet ile süratin birleşimidir; dikey sıçrama, şut ve atlama bu türün göstergesidir."},{"u":15,"s":"Kuvveti uzun süre koruyabilme yetisi hangisidir?","c":["Maksimal kuvvet","Çabuk kuvvet","Kuvvette devamlılık","Reaksiyon sürati","Aktif hareketlilik"],"d":2,"a":"Kuvvette devamlılık, kuvvet ile dayanıklılığın birleşimidir; kürek çekmek ve uzun süreli mücadele bu türü gerektirir."},{"u":15,"s":"Kuvvet gelişiminin asıl penceresi hangi dönemdir ve nedeni nedir?","c":["Erken çocukluk; sinir sistemi esnektir","Ergenlik ve sonrası; hormonal olgunlaşmaya bağlıdır","Bebeklik; refleksler güçlüdür","Orta yaş; deneyim artar","Yaşlılık; eklemler oturur"],"d":1,"a":"Kuvvet hormonal olgunlaşmayla birlikte gelişir. Çocuklukta kuvvet çalışması kendi vücut ağırlığıyla ve teknik öğretimi ağırlıklı yapılır."},{"u":15,"s":"Aşağıdakilerden hangisi süratin alt türlerinden biri DEĞİLDİR?","c":["Reaksiyon sürati","İvmelenme (hızlanma) sürati","Maksimal sürat","Süratte devamlılık","Pasif hareketlilik"],"d":4,"a":"Pasif hareketlilik esneklik kapsamındadır. Süratin alt türleri reaksiyon sürati, ivmelenme, maksimal sürat ve süratte devamlılıktır."},{"u":15,"s":"Sürat çalışması ne zaman yapılmalıdır?","c":["Antrenmanın sonunda, yorgunken","Isınmadan sonra, sporcu dinlenmişken","Yalnızca yarışma günü","Dayanıklılık çalışmasının hemen ardından","Fark etmez"],"d":1,"a":"Yorgunlukta hız düşer ve hatalı hareket kalıbı yerleşir. Sürat, koordinasyon gibi, sporcu dinlenmişken ve antrenmanın erken bölümünde çalışılır."},{"u":15,"s":"Oksijenli ortamda, uzun süreli ve düşük–orta şiddetli yüklenmeye dayanan dayanıklılık türü hangisidir?","c":["Anaerobik dayanıklılık","Aerobik dayanıklılık","Kuvvette devamlılık","Süratte devamlılık","Özel dayanıklılık"],"d":1,"a":"Aerobik dayanıklılık genel dayanıklılığın temelidir ve diğer tüm dayanıklılık türlerinin üzerine kurulduğu zemindir."},{"u":15,"s":"Kısa süreli, yüksek şiddetli ve oksijensiz ortamda gerçekleşen dayanıklılık türü hangisidir?","c":["Aerobik dayanıklılık","Anaerobik dayanıklılık","Genel dayanıklılık","Hareketlilik","Maksimal kuvvet"],"d":1,"a":"Anaerobik dayanıklılık yüksek şiddetli ve kısa süreli yüklenmelerde devreye girer; laktik asit birikimine karşı direnç gerektirir."},{"u":15,"s":"Eklemlerde geniş açılı hareket yapabilme yetisi hangisidir?","c":["Kuvvet","Sürat","Hareketlilik (esneklik)","Dayanıklılık","Çabukluk"],"d":2,"a":"Hareketlilik eklem yapısına ve kas–bağ dokusunun uzayabilirliğine bağlıdır; sakatlığı önler ve tekniğin doğru uygulanmasına olanak tanır."},{"u":15,"s":"Aktif ve pasif hareketlilik arasındaki fark nedir?","c":["Aktif hareketlilik sporcunun kendi kas gücüyle, pasif hareketlilik dış yardımla ulaşılan açıdır","Aktif hareketlilik yalnızca ısınmada kullanılır","Pasif hareketlilik her zaman daha küçüktür","İkisi aynı şeydir","Aktif hareketlilik yaşla artar"],"d":0,"a":"Pasif hareketlilik her zaman aktiften büyüktür, çünkü dış kuvvet ekleme daha geniş açıya taşır. Aradaki fark sporcunun geliştirmesi gereken alanı gösterir."},{"u":15,"s":"Hareketlilik özelliği yaşla nasıl değişir ve bu antrenöre ne söyler?","c":["Yaşla artar; ileri yaşta çalışılmalıdır","Yaşla azalır; erken yaşta başlanıp korunmalıdır","Değişmez; çalışmaya gerek yoktur","Yalnızca ergenlikte gelişir","Yalnızca kuvvetle birlikte gelişir"],"d":1,"a":"Hareketlilik en erken yaşta en yüksektir ve zamanla azalır. Bu yüzden erken başlanır ve düzenli çalışmayla korunur; kaybedildikten sonra geri kazanmak zordur."},{"u":15,"s":"Genel dayanıklılık ile özel dayanıklılık arasındaki fark nedir?","c":["Genel dayanıklılık branştan bağımsızdır, özel dayanıklılık branşın yüklenme yapısına uygundur","Genel dayanıklılık yalnızca çocuklarda gelişir","Özel dayanıklılık aerobik olamaz","İkisi aynı şeydir","Genel dayanıklılık yalnızca yarışmada kullanılır"],"d":0,"a":"Önce genel dayanıklılık zemini kurulur, sonra branşın kendi ritmine ve şiddetine uygun özel dayanıklılık geliştirilir."},{"u":15,"s":"Bir basketbolcunun rakibin hareketine göre ani yön değiştirmesi hangi özelliği kullanır?","c":["Maksimal kuvvet","Çeviklik","Aerobik dayanıklılık","Pasif hareketlilik","Kuvvette devamlılık"],"d":1,"a":"Öngörülemeyen bir uyarana göre yön değiştirmek çevikliktir; içinde algı, karar verme, denge ve sürat birlikte çalışır."},{"u":15,"s":"Statik germe ile dinamik germe arasındaki fark nedir?","c":["Statik germede pozisyonda kalınır, dinamik germede kontrollü salınımla hareket edilir","Statik germe yalnızca çocuklara uygundur","Dinamik germe hareketliliği azaltır","İkisi aynı şeydir","Statik germe yalnızca yarışmada yapılır"],"d":0,"a":"Statik germede ulaşılan pozisyon bir süre korunur; dinamik germede eklem kontrollü salınımlarla hareket ettirilir. İkisi farklı amaçlarla ve antrenmanın farklı bölümlerinde kullanılır."},{"u":15,"s":"Duruş hâlinden en yüksek hıza ulaşana kadar geçen bölümdeki sürat türü hangisidir?","c":["Reaksiyon sürati","İvmelenme (hızlanma) sürati","Maksimal sürat","Süratte devamlılık","Çeviklik"],"d":1,"a":"İvmelenme sürati, hareketin başlangıcından maksimal hıza ulaşana kadar geçen bölümü kapsar. Takım sporlarında mesafeler kısa olduğu için maksimal süratten çok ivmelenme belirleyicidir."},{"u":16,"s":"Bir antrenörün profesyonel alan bilgisinin temel unsurları nelerdir?","c":["Spor psikolojisi ve sporcu iletişimi","Spesifik spor dallarındaki kurallar","Antrenman teknikleri","Fizyolojik prensipler","Beslenme bilgisi"],"d":0,"a":"Kural, teknik, fizyoloji ve beslenme birer içerik alanıdır; kitaptan öğrenilir ve her antrenörde bulunur. Antrenörü antrenör yapan, bu bilgiyi karşısındaki insana aktarabilmesidir — yani sporcuyu psikolojik olarak okuyabilmesi ve doğru iletişim kurabilmesi."},{"u":16,"s":"İletişim sürecinde 'kanal' neyi ifade eder?","c":["Mesajı gönderen kişiyi","Mesajın taşındığı yolu","Mesajı alan kişiyi","Alıcının verdiği yanıtı","İletişimin geçtiği ortamı"],"d":1,"a":"Kanal, mesajın alıcıya ulaşmasını sağlayan yoldur: ses, gösterim, video, dokunma. Gönderen kaynak, alan alıcı, yanıt ise geri bildirimdir."},{"u":16,"s":"İletişimi tek yönlü olmaktan çıkarıp çift yönlü hâle getiren öğe hangisidir?","c":["Kaynak","Mesaj","Kanal","Geri bildirim","Ortam"],"d":3,"a":"Geri bildirim olmadan antrenör konuşmuş ama iletişim kurulmamış olur. Anlaşılıp anlaşılmadığını sormak süreci çift yönlü yapar."},{"u":16,"s":"Antrenörün sözleri ile beden dili birbiriyle çeliştiğinde sporcu genellikle hangisine inanır?","c":["Söylenen söze","Sözsüz mesaja (beden dili ve ses tonuna)","İkisine de eşit ölçüde","Hiçbirine","Yazılı programa"],"d":1,"a":"Sözsüz mesaj daha güçlü taşınır. 'Sorun yok' derken yüzünü asan antrenöre kimse inanmaz; bu yüzden tutarlılık iletişimin temel koşuludur."},{"u":16,"s":"Aşağıdakilerden hangisi 'ben dili' kullanımına örnektir?","c":["Yine geç kaldın, hiç ciddiye almıyorsun","Sen zaten hep böyle yaparsın","Geç başlayınca ısınmayı kısaltmak zorunda kalıyorum, bu beni zorluyor","Tembelsin, bu işi beceremezsin","Herkes senin yüzünden bekliyor"],"d":2,"a":"Ben dilinde kişilik değil davranış ve onun etkisi konuşulur. Sen dili suçlar ve sporcuyu savunmaya iter; ben dili mesajın yerine ulaşmasını sağlar."},{"u":16,"s":"'Sen dili' kullanımının temel sakıncası nedir?","c":["Çok uzun sürmesi","Sporcuyu suçlayarak savunmaya itmesi ve mesajın kaybolması","Yalnızca yazılı iletişimde kullanılabilmesi","Ölçme yapmayı güçleştirmesi","Antrenörün otoritesini artırması"],"d":1,"a":"Suçlanan kişi mesajı dinlemez, kendini savunur. Bu yüzden sen dili iletişimi kapatır; ben dili ise davranışa odaklandığı için kanalı açık tutar."},{"u":16,"s":"Aşağıdakilerden hangisi etkin dinlemenin bir gereği DEĞİLDİR?","c":["Göz teması kurmak","Sporcunun sözünü kesmemek","Söylenenleri özetleyip doğrulamak","Sporcu konuşurken cevabını hazırlamak","Sporcunun duygusunu adlandırmak"],"d":3,"a":"Sporcu konuşurken cevap hazırlamak dinlemeyi bitirir; antrenör duyar ama anlamaz. Etkin dinleme anlamaya odaklanmayı gerektirir."},{"u":16,"s":"Aşağıdakilerden hangisi bir iletişim engelidir?","c":["Sporcunun duygusunu adlandırmak","Ben dili kullanmak","Sporcuyu etiketlemek ('tembelsin')","Söylenenleri özetleyerek doğrulamak","Göz teması kurmak"],"d":2,"a":"Etiketleme kişiliği hedef alır ve savunma doğurur. Emir vermek, tehdit etmek, yargılamak, alay etmek ve duyguyu küçümsemek de iletişim engelleridir."},{"u":16,"s":"Etkili antrenörlüğü oluşturan üç bilgi türü hangisidir?","c":["Profesyonel bilgi – kişilerarası bilgi – içsel bilgi","Kuvvet – sürat – dayanıklılık","Bilişsel – duyuşsal – devinişsel","Ölçme – değerlendirme – karar","Genel – özel – uzmanlık"],"d":0,"a":"Profesyonel bilgi branş ve spor bilimlerini, kişilerarası bilgi iletişim ve ilişki kurmayı, içsel bilgi ise kendini değerlendirmeyi ve mesleki gelişimi sürdürmeyi kapsar."},{"u":16,"s":"Antrenörün kendi uygulamalarını gözden geçirip mesleki gelişimini sürdürmesi hangi bilgi türüne girer?","c":["Profesyonel bilgi","Kişilerarası bilgi","İçsel bilgi","Teknik bilgi","Taktik bilgi"],"d":2,"a":"İçsel bilgi, antrenörün kendine dönük değerlendirme yapabilmesidir. Belge almakla öğrenme bitmez; sürekli mesleki gelişim antrenörlüğün parçasıdır."},{"u":16,"s":"Gürültülü bir salonda antrenörün mesajının sporcuya ulaşmaması iletişim sürecinin hangi öğesiyle ilgilidir?","c":["Kaynak","Mesaj","Ortam (bağlam)","Alıcı","Geri bildirim"],"d":2,"a":"Ortam, iletişimin geçtiği koşulları kapsar. Gürültü, yorgunluk ve maç gerilimi mesajın taşınmasını bozar; antrenör bu durumda kanalı değiştirmeli (gösterim, işaret) ya da mesajı kısaltmalıdır."},{"u":16,"s":"Antrenörün stresli anlarda mesajını kısaltıp basitleştirmesi neden doğrudur?","c":["Zaman kazandırdığı için","Yüksek gerilimde sporcunun bilgi işleme kapasitesi daraldığı için","Sporcuyu susturduğu için","Ölçme yapmayı kolaylaştırdığı için","Otoriteyi artırdığı için"],"d":1,"a":"Kaygı ve gerilim dikkati daraltır; uzun açıklama işlenemez. Kısa, somut ve tek noktaya odaklı mesaj bu koşulda hem anlaşılır hem güven verir."},{"u":16,"s":"Antrenörün sporcuya geri bildirim verirken kişiliğe değil harekete odaklanması hangi iletişim ilkesiyle aynı mantığı taşır?","c":["Sen dili kullanımı","Ben dili kullanımı","Emir verme","Etiketleme","Konuyu değiştirme"],"d":1,"a":"İkisi de aynı ilkeye dayanır: kişiyi değil davranışı konuşmak. Böylece sporcu savunmaya geçmez ve düzeltilmesi gereken şeye odaklanabilir."},{"u":16,"s":"Bir antrenörün branş kurallarını ve fizyolojiyi çok iyi bilmesine rağmen sporcularına öğretmekte zorlanmasının en olası nedeni nedir?","c":["Kondisyonunun yetersiz olması","Kişilerarası bilgisinin (iletişim becerisinin) zayıf olması","Beslenme bilgisinin eksik olması","Yarışma sayısının azlığı","Tesis olanaklarının yetersizliği"],"d":1,"a":"İçerik bilgisi tek başına öğretmeye yetmez; bilginin sporcuya aktarılması iletişim becerisi gerektirir."},{"u":11,"s":"Ölçme sonucuna her ölçümde herkese aynı miktarda karışan hata türü hangisidir?","c":["Tesadüfi hata","Sabit hata","Sistematik hata","Puanlama hatası","Kapsam hatası"],"d":1,"a":"Sabit hatanın yönü ve büyüklüğü değişmez. Sürekli 2 kg fazla tartan terazi herkesi aynı miktarda etkiler; sıralama bozulmaz ama değerler yanlıştır."},{"u":11,"s":"Bir puanlayıcının kendi kulübünden olan sporculara sürekli daha yüksek puan vermesi hangi hata türüdür?","c":["Sabit hata","Tesadüfi hata","Sistematik hata","Ölçüt hatası","Kullanışlılık hatası"],"d":2,"a":"Sistematik hata kişiye, gruba ya da duruma göre değişir ama düzenlidir; ortada bir yanlılık vardır. Sabit hatada ise herkes aynı miktarda etkilenir."},{"u":11,"s":"Sporcunun o günkü yorgunluğu, dikkat dağınıklığı ve salondaki gürültü nedeniyle oluşan hata türü hangisidir?","c":["Sabit hata","Sistematik hata","Tesadüfi (rastgele) hata","Kapsam hatası","Yapı hatası"],"d":2,"a":"Tesadüfi hatanın kaynağı belirsizdir ve her ölçümde farklı yönde, farklı miktarda karışır; öngörülemez."},{"u":11,"s":"Aşağıdaki hata türlerinden hangisi ölçmenin güvenirliğini düşürür?","c":["Sabit hata","Sistematik hata","Tesadüfi hata","Hiçbiri","Hepsi eşit ölçüde"],"d":2,"a":"Tesadüfi hata sonuçları tutarsızlaştırır; aynı ölçüm tekrarlandığında farklı değerler çıkar. Sabit ve sistematik hatalar tutarlı olduğu için güvenirliği bozmaz."},{"u":11,"s":"Sürekli 2 kg fazla tartan bir terazi hangi ölçme niteliğini bozar?","c":["Güvenirliği bozar","Geçerliği bozar; ölçüm tutarlıdır ama gerçek değeri vermez","Kullanışlılığı bozar","Hiçbirini bozmaz","Yalnızca ölçütü bozar"],"d":1,"a":"Terazi her seferinde aynı sonucu verdiği için güvenilirdir; ancak gerçek ağırlığı ölçmediği için geçersizdir. Sabit ve sistematik hatalar geçerliği hedef alır."},{"u":11,"s":"Aşağıdakilerden hangisi ölçme hatasının kaynaklarından biri DEĞİLDİR?","c":["Ölçme aracı","Ölçmeci (puanlayıcı)","Ölçülen birey ve ortam","Ölçme sonucunun sayı ile ifade edilmesi","Uygulama koşulları"],"d":3,"a":"Sonucun sayıyla ifade edilmesi ölçmenin tanımının parçasıdır, hata kaynağı değildir. Hata; araçtan, ölçmeciden ve bireyden ya da ortamdan kaynaklanır."},{"u":11,"s":"Çok sayıda ölçüm yapıldığında birbirini götürme eğiliminde olan hata türü hangisidir?","c":["Sabit hata","Sistematik hata","Tesadüfi hata","Yanlılık","Kapsam hatası"],"d":2,"a":"Tesadüfi hatalar rastgele yönlerde oluştuğu için tekrarlı ölçümlerde birbirini dengeler. Sabit ve sistematik hatalar ise aynı yönde olduğu için birikir."},{"u":11,"s":"Ölçme ile ilgili aşağıdakilerden hangisi doğrudur?","c":["Dikkatli yapılan ölçmede hiç hata olmaz","Hatasız ölçme yoktur; amaç hatayı en aza indirmektir","Yalnızca yazılı sınavlarda hata olur","Hata yalnızca ölçmeciden kaynaklanır","Tesadüfi hata geçerliği düşürür"],"d":1,"a":"Her ölçmeye bir miktar hata karışır. Antrenörün işi hatayı yok etmek değil, kaynaklarını tanıyıp en aza indirmektir."},{"u":11,"s":"Bir becerinin gözlenip gözlenmediğinin var/yok biçiminde işaretlendiği ölçme aracı hangisidir?","c":["Rubrik","Kontrol listesi","Analitik rubrik","Bütüncül rubrik","Yazılı yoklama"],"d":1,"a":"Kontrol listesinde iki seçenek vardır: yaptı/yapmadı. Hızlıdır ama davranışın ne düzeyde yapıldığı hakkında bilgi vermez."},{"u":11,"s":"Kontrol listesinin temel sınırlılığı nedir?","c":["Uygulanmasının çok zaman alması","Davranışın düzeyi hakkında bilgi vermemesi","Yalnızca yazılı sınavlarda kullanılabilmesi","Güvenilir olmaması","Ölçüt gerektirmemesi"],"d":1,"a":"Kontrol listesi davranışın olup olmadığını söyler, ne kadar iyi yapıldığını söylemez. Düzey bilgisi gerekiyorsa rubrik kullanılır."},{"u":11,"s":"Ölçütlerin, performans düzeylerinin ve her düzeyin tanımının birlikte verildiği ölçme aracı hangisidir?","c":["Kontrol listesi","Rubrik (dereceli puanlama anahtarı)","Anket","Yazılı yoklama","Gözlem defteri"],"d":1,"a":"Rubrik, hangi ölçüte göre hangi düzeyde puan verileceğini önceden tanımlar; bu sayede puanlama nesnelleşir ve sporcu neye göre değerlendirildiğini bilir."},{"u":11,"s":"Performansa bir bütün olarak tek puan verilen rubrik türü hangisidir?","c":["Analitik rubrik","Bütüncül (holistik) rubrik","Kontrol listesi","Sıralama ölçeği","Yapı rubriği"],"d":1,"a":"Bütüncül rubrik hızlıdır ve genel izlenim sunar; ancak sporcunun tam olarak nerede eksik kaldığını göstermez."},{"u":11,"s":"Performansın ölçütlere ayrılıp her ölçütün ayrı puanlandığı rubrik türü hangisidir?","c":["Bütüncül rubrik","Analitik rubrik","Kontrol listesi","Görünüş rubriği","Sıralama ölçeği"],"d":1,"a":"Analitik rubrik ayrıntılı geri bildirim verir ve eksiğin yerini gösterir; buna karşılık hazırlaması ve uygulaması daha çok zaman alır."},{"u":11,"s":"Sporcunun gelişimini süreç içinde izlemek ve nerede eksik kaldığını görmek isteyen bir antrenör hangi aracı tercih etmelidir?","c":["Bütüncül rubrik","Analitik rubrik","Kontrol listesi","Yazılı sınav","Sıralama listesi"],"d":1,"a":"Analitik rubrik performansı ölçütlere ayırdığı için eksiğin tam yerini gösterir; bu da biçimlendirme–izleme değerlendirmesine uygundur."},{"u":11,"s":"Çok sayıda sporcunun kısa sürede değerlendirilmesi gerektiğinde hangi araç daha uygundur?","c":["Analitik rubrik","Bütüncül rubrik","Uzun yazılı sınav","Bireysel görüşme","Günlük tutma"],"d":1,"a":"Bütüncül rubrik tek puan verdiği için hızlıdır. Ayrıntı gerekmediğinde ve zaman kısıtlı olduğunda tercih edilir."},{"u":11,"s":"Rubrik kullanmanın ölçme açısından en önemli katkısı nedir?","c":["Ölçme süresini uzatması","Puanlamadaki öznelliği azaltıp güvenirliği artırması","Ölçüt gereksinimini ortadan kaldırması","Gözlemi gereksiz kılması","Geçerliği önemsiz hâle getirmesi"],"d":1,"a":"Ölçütler ve düzey tanımları önceden belirlendiği için farklı puanlayıcılar benzer sonuçlara ulaşır; bu da puanlama güvenirliğini yükseltir."},{"u":11,"s":"Kontrol listesi ile rubrik arasındaki temel fark nedir?","c":["Kontrol listesi davranışın olup olmadığını, rubrik ne düzeyde olduğunu gösterir","Kontrol listesi yalnızca yazılı sınavlarda kullanılır","Rubrik gözlem gerektirmez","Kontrol listesi daha güvenilirdir","Aralarında fark yoktur"],"d":0,"a":"Kontrol listesi ikili bir yargı verir (var/yok); rubrik ise düzey tanımlarıyla derecelendirme yapar."},{"u":12,"s":"Etkili antrenörlükte sporcuda geliştirilmesi hedeflenen dört kazanım hangisidir?","c":["Kuvvet, sürat, dayanıklılık, esneklik","Yetkinlik, özgüven, bağ, karakter","Teknik, taktik, kondisyon, beslenme","Bilişsel, duyuşsal, devinişsel, sosyal","Geçerlik, güvenirlik, kullanışlılık, nesnellik"],"d":1,"a":"Antrenörün odakları yalnız performans değildir. Sporcuda yetkinlik (beceri), özgüven (kendine inanç), bağ (ilişkiler) ve karakter (değerler) birlikte geliştirilir."},{"u":12,"s":"Antrenörün sporcuya saygı, dürüstlük ve sorumluluk kazandırması hangi odakla ilgilidir?","c":["Yetkinlik","Özgüven","Bağ","Karakter","Kondisyon"],"d":3,"a":"Karakter odağı; saygı, dürüstlük, sorumluluk ve empatiyi kapsar. Kurala ve rakibe saygı da bu başlığın altındadır."},{"u":12,"s":"Sporcunun antrenörü, takım arkadaşları ve ailesiyle kurduğu olumlu ilişkiler hangi odağı ifade eder?","c":["Bağ","Yetkinlik","Karakter","Özgüven","Odak dışıdır"],"d":0,"a":"Bağ odağı, sporcunun çevresiyle kurduğu olumlu ilişkileri kapsar. Bağ güçlü olduğunda sporcu zor dönemlerde spora tutunur."},{"u":12,"s":"Spora özgü teknik, taktik ve fiziksel becerilerin gelişmesi hangi odaktır?","c":["Bağ","Karakter","Yetkinlik","Özgüven","Felsefe"],"d":2,"a":"Yetkinlik, sporcunun sporu yapabilme kapasitesidir; teknik, taktik, fiziksel özellikler ve sağlıklı yaşam alışkanlıklarını içerir."},{"u":12,"s":"Yalnızca yetkinliğe odaklanıp diğer üç kazanımı ihmal eden bir antrenör için en olası sonuç nedir?","c":["Sporcu her alanda gelişir","Kısa vadede derece alınabilir ancak sporcunun spordan kopma riski artar","Sporcunun karakteri kendiliğinden gelişir","Bağ kurmaya gerek kalmaz","Özgüven otomatik olarak yükselir"],"d":1,"a":"Dört odak birbirine bağlıdır. Yalnız performansa yüklenen ortam, bağ ve özgüven zayıf kaldığında sporcuyu tükenmişliğe ve kopmaya götürür."},{"u":12,"s":"Katılım sporu ortamında antrenörün önceliği ne olmalıdır?","c":["Yarışmada derece almak","Herkesin katılması, olumlu tutum ve hareket sevgisi kazandırmak","En yetenekliyi seçip diğerlerini elemek","Maksimal yüklenme uygulamak","Erken uzmanlaşmayı hızlandırmak"],"d":1,"a":"Katılım sporu ortamının amacı eğlence, sağlık, sosyalleşme ve katılımın sürmesidir. Eleme ve yoğun yarışma baskısı bu ortamın amacına aykırıdır."},{"u":12,"s":"Sporcu gelişim ortamlarıyla ilgili aşağıdakilerden hangisi doğrudur?","c":["Aynı antrenör davranışı her ortamda doğrudur","Antrenörün önceliği bulunduğu ortama göre değişmelidir","Katılım ve performans ortamı aynı şeydir","Ortam yalnızca tesis olanağıyla ilgilidir","Performans ortamında eğlenceye hiç yer yoktur"],"d":1,"a":"Katılım ortamında yoğun eleme sporcuyu kopartır; performans ortamında yalnız eğlenceye dayalı program gelişimi durdurur. Antrenörün ilk işi hangi ortamda olduğunu doğru okumaktır."},{"u":12,"s":"Antrenörlük felsefesi aşağıdakilerden hangisini ifade eder?","c":["Antrenörün kullandığı antrenman yöntemlerinin listesi","Antrenörün neden ve nasıl antrenörlük yaptığına ilişkin temel inanç ve değerler bütünü","Kulübün yıllık bütçesi","Sporcunun beslenme programı","Federasyonun yarışma takvimi"],"d":1,"a":"Felsefe soyut bir söylem değil, zor anlarda verilen kararları belirleyen değerler bütünüdür. Sakat sporcuyu oynatmak ya da az yetenekliye süre vermek gibi kararlar felsefeden çıkar."},{"u":12,"s":"Sağlam bir antrenörlük felsefesinin taşıması gereken özellikler hangileridir?","c":["Gizli, esnek ve değişken olmalı","Açık, tutarlı ve paylaşılmış olmalı","Yalnızca kulüp yönetimi tarafından bilinmeli","Her maçta yeniden belirlenmeli","Yalnızca yazılı olmalı, uygulanması şart değil"],"d":1,"a":"Felsefe antrenörün kendisi tarafından bilinçle tanımlanmış (açık), her durumda aynı ilkelerle uygulanan (tutarlı) ve sporcuyla ailenin bildiği (paylaşılmış) olmalıdır."},{"u":12,"s":"Çağdaş antrenörlük felsefesi hangi anlayışa dayanır?","c":["Kazanma merkezli anlayış","Sporcu merkezli anlayış","Kulüp geliri merkezli anlayış","Seyirci beklentisi merkezli anlayış","Antrenörün kariyeri merkezli anlayış"],"d":1,"a":"Sporcu merkezli felsefede öncelik sporcunun bütünsel gelişimi, sağlığı ve spora bağlı kalmasıdır; kazanmak bu gelişimin sonucudur, amacı değil."},{"u":12,"s":"Antrenörlük felsefesi geliştirmek öncelikle neyle başlar?","c":["Yeni antrenman yöntemleri öğrenmekle","Antrenörün kendi değerlerini gözden geçirmesiyle (öz farkındalık)","Kulüple sözleşme yapmakla","Yarışma takvimini belirlemekle","Tesis kurmakla"],"d":1,"a":"Felsefe dışarıdan alınmaz. Antrenörün neye değer verdiğini kendine sorması, yani öz farkındalık, felsefenin başlangıç noktasıdır."},{"u":12,"s":"Felsefesi belirsiz olan bir antrenörün yol açtığı temel sorun nedir?","c":["Antrenman süresi uzar","Her durumda farklı davranır ve sporcu neye göre değerlendirildiğini bilemez","Tesis kullanımı zorlaşır","Yarışma sayısı azalır","Ölçme araçları geçersizleşir"],"d":1,"a":"Tutarsız davranış güven ilişkisini zedeler. Sporcu hangi davranışın karşılık bulacağını kestiremediğinde kaygı artar ve bağ zayıflar."},{"u":13,"s":"Sporcu gelişimini açıklayan modeller neye göre birbirinden ayrılır?","c":["Uygulandıkları ülkeye göre","Neyi tarif ettiklerine göre: katılım yolu mu, antrenman aşamaları mı","Kuramcılarının yaşına göre","Yalnızca yayımlandıkları yıla göre","Kullandıkları test sayısına göre"],"d":1,"a":"Spora katılımın gelişimsel modeli bireyin katılım yolculuğunu, uzun süreli sporcu gelişim modeli ise antrenman aşamalarını tarif eder. Biri sporcuya, diğeri programa bakar."},{"u":13,"s":"Bireyin spora nasıl başladığını, sürdürdüğünü ve hangi aşamalardan geçtiğini tarif eden model hangisidir?","c":["Uzun süreli sporcu gelişim modeli","Spora katılımın gelişimsel modeli","Gallahue motor gelişim modeli","Fitts–Posner modeli","Mosston spektrumu"],"d":1,"a":"Katılım modeli sporcunun yolculuğuna bakar: başlama, sürdürme, bırakma. LTAD ise hangi aşamada neyin çalışılacağını söyler."},{"u":13,"s":"Hangi yaşta hangi özelliğin çalışılacağını belirleyen model hangisidir?","c":["Spora katılımın gelişimsel modeli","Uzun süreli sporcu gelişim modeli","Sporda sosyalleşme modeli","Öz-yeterlik modeli","Rubrik modeli"],"d":1,"a":"LTAD antrenman aşamalarını ve duyarlı pencereleri tanımlar; antrenörün programını doğrudan yönlendirir."},{"u":13,"s":"Spora katılımın gelişimsel modeli ile uzun süreli sporcu gelişim modelinin ortak yönü aşağıdakilerden hangisidir?","c":["İkisi de yalnız elit sporcuyu inceler","İkisi de erken uzmanlaşmaya karşı uyarır ve uzun vadeli gelişimi önceler","İkisi de yalnız çocukluk dönemini kapsar","İkisi de yarışma takvimini belirler","İkisi de ölçme aracıdır"],"d":1,"a":"Her iki model de gelişimi yaşam boyu ele alır, erken uzmanlaşmanın risklerine dikkat çeker ve kısa vadeli derece yerine uzun vadeli gelişimi önceler."},{"u":13,"s":"Bir soruda \"katılım\", \"sosyalleşme\" ve \"spordan ayrılma\" kavramları geçiyorsa hangi model kastediliyordur?","c":["Uzun süreli sporcu gelişim modeli","Spora katılımın gelişimsel modeli","Gallahue modeli","Laban hareket analizi","Bütüncül rubrik"],"d":1,"a":"Katılım, sürdürme ve bırakma kavramları katılım modelinin alanıdır. Aşama, pencere ve yüklenme kavramları geçiyorsa LTAD kastedilir."},{"u":13,"s":"Spora katılımın gelişimsel modelinde bireyin birçok farklı spor dalını denediği, oyun ağırlıklı ve eğlence odaklı döneme ne ad verilir?","c":["Yatırım yılları","Örneklem (katılım) yılları","Erken uzmanlaşma","Rekreasyonel gelişim","Elit sporcu gelişimi"],"d":1,"a":"Örneklem yılları modelin çıkış noktasıdır. Çocuk çok sayıda branş dener, geniş bir hareket dağarcığı kurar; bu dönemden sonra üç yoldan birine yönelir."},{"u":13,"s":"Spora katılımın gelişimsel modeline göre örneklem yıllarından sonra birey hangi yollara yönelebilir?","c":["Yalnızca elit sporcu gelişimi","Rekreasyonel gelişim, elit sporcu gelişimi ve erken uzmanlaşma","Yalnızca rekreasyonel gelişim","Yalnızca erken uzmanlaşma","Hiçbir yola yönelmez"],"d":1,"a":"Model üç yol tanımlar. Elit düzeye örneklem yollu (geç uzmanlaşma) ya da erken uzmanlaşma yoluyla ulaşılabilir; üçüncü yol ise rekreasyonel gelişimdir."},{"u":13,"s":"Bireyin spora eğlence, sağlık ve sosyalleşme amacıyla devam ettiği yol hangisidir?","c":["Elit sporcu gelişimi","Rekreasyonel gelişim","Erken uzmanlaşma","Yatırım yılları","Özelleşme yılları"],"d":1,"a":"Rekreasyonel gelişim yolunda yarışma önceliği yoktur; amaç yaşam boyu katılımdır. Bu yol bir başarısızlık değil, modelin geçerli sonuçlarından biridir."},{"u":13,"s":"Spora katılımın gelişimsel modelinde örneklem yıllarının atlanarak erken yaşta tek branşa yoğunlaşılması hangi yoldur?","c":["Rekreasyonel gelişim","Elit sporcu gelişimi","Erken uzmanlaşma","Örneklem yılları","Aktif yaşam"],"d":2,"a":"Erken uzmanlaşma yolunda geniş hareket alt yapısı kurulmadan branşa yönelinir. Yalnız sınırlı sayıda branş için uygundur ve sakatlık, tükenmişlik, erken kopma riski taşır."},{"u":13,"s":"Spora katılımın gelişimsel modeline göre elit düzeye ulaşmakla ilgili aşağıdakilerden hangisi doğrudur?","c":["Elit düzeye yalnızca erken uzmanlaşarak ulaşılabilir","Elit düzeye hem örneklem yollu hem erken uzmanlaşma yoluyla ulaşılabilir","Elit düzeye yalnızca rekreasyonel yoldan ulaşılabilir","Elit düzey modelde yer almaz","Elit düzey yalnızca takım sporlarında mümkündür"],"d":1,"a":"Model iki farklı elit yol tanımlar. Sporların büyük çoğunluğunda örneklem yollu gelişim daha sağlıklı kabul edilir; erken uzmanlaşma yalnız bazı branşlar için uygundur."},{"u":13,"s":"Spora katılımın gelişimsel modelinde rekreasyonel gelişim için aşağıdakilerden hangisi doğrudur?","c":["Elit olamamış sporcuların başarısızlık yoludur","Modelin geçerli üç sonucundan biridir ve yaşam boyu katılımı hedefler","Yalnızca yetişkinler için geçerlidir","Örneklem yıllarından önce gelir","Yarışma odaklıdır"],"d":1,"a":"Model rekreasyonel gelişimi bir eksiklik olarak görmez. Bireyin spora sağlık, eğlence ve sosyalleşme için bağlı kalması modelin başarılı sonuçlarından biridir."},{"u":12,"s":"Antrenörlük stilleri hangi ölçüte göre birbirinden ayrılır?","c":["Antrenörün yaşına göre","Kararların kimde olduğuna göre","Branşın türüne göre","Tesis olanaklarına göre","Yarışma sayısına göre"],"d":1,"a":"Otokratikte karar tamamen antrenörde, demokratikte paylaşılır, bütünselde büyük ölçüde sporcuya devredilir. Ayrımın ekseni karar verme yetkisidir."},{"u":12,"s":"Antrenörlük stilleriyle ilgili aşağıdakilerden hangisi doğrudur?","c":["Demokratik stil her durumda en iyisidir","Hiçbir stil her durumda en iyi değildir; antrenör duruma uygun stili seçmelidir","Otokratik stil hiçbir durumda kullanılmamalıdır","Bütünsel stil yalnızca çocuklarda kullanılır","Stil seçimi sporcunun düzeyinden bağımsızdır"],"d":1,"a":"Güvenlik gerektiren anlarda ve yeni başlayanlarda otokratik yön verme gerekir; deneyimli sporcuda bütünsel yaklaşım özerkliği besler. Antrenörün yeterliği, duruma uygun stili seçebilmesidir."},{"u":12,"s":"Deneyimli ve sorumluluk almaya hazır bir sporcuda özerkliği ve öz düzenlemeyi en çok geliştiren stil hangisidir?","c":["Otokratik","Demokratik","Bütünsel (holistik)","Komut","Alıştırma"],"d":2,"a":"Bütünsel stilde sporcu kendi kararlarını verir ve süreci yönetir; bu da özerklik ile öz düzenlemeyi güçlendirir. Ancak sporcu buna hazır değilse yapı kaybolabilir."},{"u":12,"s":"Güvenliğin öncelikli olduğu ve sporcuların yeni başladığı bir ortamda hangi stil daha uygundur?","c":["Bütünsel (holistik)","Otokratik yön verme","Tamamen serbest bırakma","Stil seçimi gerekmez","Yalnızca demokratik"],"d":1,"a":"Yeni başlayan sporcu ne yapacağını bilmez ve güvenlik riski yüksektir; bu koşulda net yön veren otokratik stil uygundur. Sporcu ilerledikçe karar sporcuya devredilir."},{"u":14,"s":"Koordinatif yetiler için aşağıdakilerden hangisi doğrudur?","c":["Doğuştan kazanılan özelliklerdir","Doğuştan kazanılan özellikler değildir; doğru öğrenme ile geliştirilir","Yalnızca yetişkinlikte gelişir","Antrenmanla değiştirilemez","Yalnızca elit sporcularda bulunur"],"d":1,"a":"Koordinatif yetiler doğuştan gelmez; doğru öğrenme ve alıştırmayla gelişir. Gelişimleri biyolojik yaşa bağlıdır."},{"u":14,"s":"Hareket becerilerinin bütününün gelişmesini kapsayan ve özel koordinasyonun temelini oluşturan koordinasyon türü hangisidir?","c":["Özel koordinasyon","Genel koordinasyon","İnce koordinasyon","Kapalı beceri koordinasyonu","Açık beceri koordinasyonu"],"d":1,"a":"Genel koordinasyon denge, reaksiyon zamanı ve hareket sürati gibi bütünsel becerileri kapsar ve özel koordinasyonun temelini oluşturur."},{"u":14,"s":"Spor dalına göre geliştirilen, yapılan spor türünün hazırlığı niteliğindeki koordinasyon hangisidir?","c":["Genel koordinasyon","Özel koordinasyon","Kaba koordinasyon","İnce koordinasyon","Statik koordinasyon"],"d":1,"a":"Özel koordinasyon branşa özgüdür; çeşitli ve bir seri hareketin hızlı, akıcı ve uyumlu biçimde yapılmasıdır."},{"u":14,"s":"Sabit bir motor programa dayalı teknik özellikli beceriler hangi koordinasyon türüne girer?","c":["Açık beceri koordinasyonu","Kapalı beceri koordinasyonu","Genel koordinasyon","Kaba koordinasyon","İnce koordinasyon"],"d":1,"a":"Bir stilde yüzme, bisiklete binme ve halterde ağırlık kaldırma kapalı beceri koordinasyonuna örnektir; motor program sabittir."},{"u":14,"s":"Oyun sporlarında ve taktik davranışlarda daha çok görülen, uyum gerektiren motor programa dayalı koordinasyon hangisidir?","c":["Kapalı beceri koordinasyonu","Açık becerilerin koordinasyonu","İnce koordinasyon","Genel koordinasyon","Statik koordinasyon"],"d":1,"a":"Açık becerilerde ipuçları önceden belli değildir; yeni duruma göre motor program seçilir. Oyun sporlarında etkindir."},{"u":14,"s":"Zatzyorski’ye göre koordinasyonun üç temel özelliği hangisidir?","c":["Kuvvet, sürat, dayanıklılık","Zorluk derecesi, hareketin doğruluğu, kazanılma süresi","Genel, özel, karma","Statik, dinamik, objeyle","Basit, karmaşık, seçmeli"],"d":1,"a":"Zatzyorski koordinasyonu zorluk derecesi, hareketin doğruluğu ve kazanılma süresi olmak üzere üç özellikle tanımlar."},{"u":14,"s":"Aşağıdakilerden hangisi koordinasyonu etkileyen faktörlerden biri DEĞİLDİR?","c":["Düşünme (sporsal zekâ)","Motor deneyim","Duyusal organların incelik ve sürekliliği","Sporcunun takım formasının rengi","Diğer motorik becerilerin gelişim düzeyi"],"d":3,"a":"Koordinasyonu etkileyen faktörler; düşünme (sporsal zekâ), duyusal organların incelik ve sürekliliği, motor deneyim, diğer motorik becerilerin gelişim düzeyi ve çözümleme yeteneğidir."},{"u":14,"s":"Sürat, kuvvet, dayanıklılık veya esneklikteki yetersiz gelişimin koordinasyonu sınırlaması hangi faktörle açıklanır?","c":["Motor deneyim","Diğer motorik becerilerin gelişim düzeyi","Sporsal zekâ","Çözümleme yeteneği","Dokunarak algılama"],"d":1,"a":"Koordinasyonun yetkinleşmesi diğer motorik becerilerin gelişmişliğine bağlıdır; birindeki eksiklik koordinasyonu sınırlar."},{"u":14,"s":"Hareketin başlangıcı, bitişi ve süresi hakkında bilgi veren algılama türü hangisidir?","c":["Kinestetik algılama","Dokunarak algılama","Görerek algılama","Duyarak algılama","Ayrımlama"],"d":3,"a":"İşitsel alıcılar hareketin başlangıcı, bitişi ve süresi hakkında bilgi verir; futbolcunun düdük sesini algılaması buna örnektir."},{"u":14,"s":"Hirtz’e göre koordinatif yetiler kaç temel yeti hâlinde sınıflandırılır ve bunlar hangileridir?","c":["Üç: denge, ritim, tepki","Beş: tepki, oryantasyon, denge, ritim, kinestetik ayrımlama","Yedi: denge, ritim, tepki, oryantasyon, ayrımlama, bağlama, uyum","Dört: denge, ritim, tepki, oryantasyon","Altı: denge, ritim, tepki, oryantasyon, ayrımlama, kuvvet"],"d":1,"a":"Hirtz koordinatif yetileri beş temel yeti olarak sınıflandırır: tepki, oryantasyon (mekân uyumu), denge, ritim ve kinestetik ayrımlama."},{"u":14,"s":"Kas ve kirişlerden gelen kinestetik bilgiler yolu ile hareketlerdeki hassas farklılaşmaları ifade eden yeti hangisidir?","c":["Denge yetisi","Kinestetik ayrımlama yetisi","Ritim yetisi","Tepki yetisi","Oryantasyon yetisi"],"d":1,"a":"Kinestetik ayrımlama, bir hareketi en ekonomik ve en iyi biçimde yapabilmeyi içerir. 8–10 yaş arasında hızlı gelişir, 13 yaşa kadar sürer."},{"u":14,"s":"Hareketlerin en, boy ve yükseklik boyutunu kavramayı ifade eden koordinatif yeti hangisidir?","c":["Denge yetisi","Ritim yetisi","Oryantasyon (mekân uyumu) yetisi","Kinestetik ayrımlama yetisi","Tepki yetisi"],"d":2,"a":"Oryantasyon yetisi hareketin boyutunu kavramadır ve işitsel ile görsel uyaranlarla beslenir. Gelişim yaşı 6–15, en yoğun dönem 7–9 yaştır."},{"u":14,"s":"\"Zamanın farkında olma\" yetisi olarak tanımlanan koordinatif yeti hangisidir?","c":["Ritim yetisi","Denge yetisi","Tepki yetisi","Oryantasyon yetisi","Kinestetik ayrımlama yetisi"],"d":0,"a":"Ritim yetisi, hareketin mekân boyutu içinde akıcı ve dinamik değişimlere göre hareket edebilmedir; işitsel ve görsel algılama beraberdir."},{"u":14,"s":"Bir veya birden fazla uyarıya karşı çabuk ve uygun biçimde harekete başlama yetisi hangisidir?","c":["Ritim yetisi","Tepki (reaksiyon) yetisi","Denge yetisi","Kinestetik ayrımlama yetisi","Oryantasyon yetisi"],"d":1,"a":"Tepki yetisi basit ve karmaşık olmak üzere ikiye ayrılır. Gelişim yaşı 7–18, en hızlı gelişim 7–10 yaş aralığıdır."},{"u":14,"s":"Sürat antrenmanında düdükle çıkış yapmak hangi tepki türüne örnektir?","c":["Karmaşık tepki","Basit tepki","Ayrımlama tepkisi","Dinamik tepki","Objeyle tepki"],"d":1,"a":"Basit tepkilerde yapılacak hareket önceden bilinir. Alkış sesiyle sıçramak da basit tepkiye örnektir."},{"u":14,"s":"Rakibe engel olmak ya da takım arkadaşıyla işbirliği yapmak hangi tepki türüne girer?","c":["Basit tepki","Karmaşık tepki","Statik tepki","Kinestetik tepki","Ritmik tepki"],"d":1,"a":"Karmaşık tepkiler, birçok uyarıya karşılık en iyi ve en doğru yolu seçme durumudur."},{"u":14,"s":"Vücudun dengesinin belli bir yerde ya da pozisyonda sağlanmasına ne ad verilir?","c":["Dinamik denge","Statik denge","Objeyle dengeleme","Kinestetik denge","Ritmik denge"],"d":1,"a":"Statik denge sabit bir pozisyonda dengenin korunmasıdır. Hareket ederken dengeyi sağlamak dinamik denge, araçla dengeyi korumak ise objeyle dengelemedir."},{"u":14,"s":"Bir araçla hareket yaparken ya da ek bir araç kullanırken dengenin sağlanmasına ne ad verilir?","c":["Statik denge","Dinamik denge","Objeyle dengeleme","Genel denge","Kaba denge"],"d":2,"a":"Objeyle dengeleme, denge yetisinin üç biçiminden biridir; araç kullanımı sırasında dengenin korunmasını ifade eder."},{"u":14,"s":"Kinestetik ayrımlama yetisi hangi yaş aralığında hızlı gelişir?","c":["3–5 ya /* ============================================================
   DURUM
   ============================================================ */
const ANAHTAR = "soo_calisma_v1";
const bos = () => ({ kayit:{}, denemeler:[], tema:"" });
let D = bos();

function yukle(){
  try{
    const h = localStorage.getItem(ANAHTAR);
    if(h) D = Object.assign(bos(), JSON.parse(h));
  }catch(e){ D = bos(); }
}
function kaydet(){
  try{ localStorage.setItem(ANAHTAR, JSON.stringify(D)); }catch(e){}
}

/* Leitner kutusu: 1 = taze yanlış, 5 = ezberlendi. Yanlışta 1'e döner. */
function kayitAl(id){
  return D.kayit[id] || (D.kayit[id] = { d:0, y:0, kutu:0, son:0 });
}
/* Kutu 4 ve üstü = öğrenildi, tekrar listesinden çıkar.
   İlk denemede doğru bilinen soru doğrudan 4'e gider; hiç yanlış yapılmadığı için
   tekrar kutusunda işi yoktur. Yanlış yapılan soru 1'e düşer ve üç doğruyla çıkar. */
const OGRENILDI = 4;
function cevapIsle(id, dogruMu){
  const k = kayitAl(id);
  if(dogruMu){ k.d++; k.kutu = k.kutu ? Math.min(5, k.kutu + 1) : OGRENILDI; }
  else { k.y++; k.kutu = 1; }
  k.son = Date.now();
  kaydet();
}
const yanlisHavuzu = () =>
  SORULAR.filter(s => { const k = D.kayit[s.id]; return k && k.kutu >= 1 && k.kutu < OGRENILDI; })
         .sort((a,b) => (D.kayit[a.id].kutu - D.kayit[b.id].kutu) || (D.kayit[a.id].son - D.kayit[b.id].son));

function uniteIst(u){
  const sorular = SORULAR.filter(s => s.u === u);
  let cozulen = 0, ogrenilen = 0;
  sorular.forEach(s => {
    const k = D.kayit[s.id];
    if(k && (k.d + k.y) > 0){ cozulen++; if(k.kutu >= OGRENILDI) ogrenilen++; }
  });
  const oran = sorular.length ? Math.round(100 * ogrenilen / sorular.length) : 0;
  return { toplam:sorular.length, cozulen, oran };
}
function genelIst(){
  const cozulen = Object.keys(D.kayit).length;
  let d = 0, y = 0;
  Object.values(D.kayit).forEach(k => { d += k.d; y += k.y; });
  return { cozulen, toplam:SORULAR.length, dogru:d, yanlis:y,
           basari: (d + y) ? Math.round(100 * d / (d + y)) : 0 };
}

/* ============================================================
   YARDIMCI
   ============================================================ */
const $ = s => document.querySelector(s);
const HARF = ["A","B","C","D","E"];
function kacir(dizi){
  const a = dizi.slice();
  for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function kacisla(t){
  return String(t).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
}
function halka(oran){
  const c = 2 * Math.PI * 14;
  return `<svg class="halka" viewBox="0 0 36 36" aria-hidden="true">
    <circle class="iz" cx="18" cy="18" r="14"></circle>
    <circle class="dolu" cx="18" cy="18" r="14" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - oran/100)}"></circle>
    <text x="18" y="21.5">${oran}</text></svg>`;
}
